<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>학생 성적 링크 관리 · 인후쌤 과학수업</title>
<meta name="theme-color" content="#0F1E3A" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { navy:{950:'#0A1428',900:'#0F1E3A',800:'#17294A'},
              brand:{50:'#EFF6FF',100:'#DBEAFE',200:'#BFDBFE',600:'#2563EB',700:'#1D4ED8'} },
    fontFamily: { sans:['Pretendard Variable','Pretendard','-apple-system','system-ui','sans-serif'] },
    boxShadow: { card:'0 1px 2px 0 rgba(15,30,58,0.04)' },
    maxWidth: { shell:'64rem' }
  }}};
</script>
<style>
  body{letter-spacing:-0.02em}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
  .tight{letter-spacing:-0.035em}
  :focus-visible{outline:2px solid #2563EB;outline-offset:3px;border-radius:6px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms !important}}
</style>
</head>
<body class="bg-slate-50 font-sans text-navy-900 antialiased">

<header class="bg-navy-900">
  <div class="mx-auto flex max-w-shell items-center justify-between px-5 py-5 sm:px-6">
    <div>
      <p class="text-[12.5px] text-white/50">인후쌤 과학수업</p>
      <h1 class="tight mt-0.5 text-[17px] font-bold text-white">학생 성적 링크 관리</h1>
    </div>
    <button id="logoutBtn" class="hidden rounded-lg px-3 py-2 text-[13px] font-medium text-white/70 transition-colors hover:bg-white/10 hover:text-white">로그아웃</button>
  </div>
</header>

<!-- 로그인 -->
<div id="loginView" class="hidden px-5 py-16">
  <div class="mx-auto w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-7 shadow-card">
    <h2 class="tight text-[17px] font-bold">관리자 로그인</h2>
    <label class="mt-5 block text-[13px] font-medium text-slate-600" for="email">이메일</label>
    <input id="email" type="email" autocomplete="username" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-[14.5px] outline-none focus:border-brand-600" />
    <label class="mt-4 block text-[13px] font-medium text-slate-600" for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" class="mt-1.5 w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-[14.5px] outline-none focus:border-brand-600" />
    <button id="loginBtn" class="mt-6 w-full rounded-xl bg-brand-600 py-3 text-[14.5px] font-semibold text-white transition-colors hover:bg-brand-700">로그인</button>
    <p id="loginErr" class="mt-3 hidden text-[13px] text-red-600"></p>
  </div>
</div>

<!-- 본문 -->
<main id="app" class="mx-auto hidden max-w-shell px-5 pb-20 pt-8 sm:px-6">

  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h2 class="tight text-[16px] font-bold">성적 반영하기</h2>
        <p class="mt-1.5 text-[13.5px] leading-relaxed text-slate-500">
          채점이 끝난 뒤 이 버튼을 누르면 학생 화면의 점수가 최신으로 바뀝니다.<br class="hidden sm:block" />
          기존 성적 데이터는 읽기만 하며, 변경하지 않습니다.
        </p>
      </div>
      <button id="syncBtn" class="shrink-0 rounded-xl bg-brand-600 px-5 py-3 text-[14.5px] font-semibold text-white transition-colors hover:bg-brand-700 disabled:opacity-50">
        전체 성적 반영
      </button>
    </div>
    <p id="syncMsg" class="mt-4 hidden rounded-xl bg-slate-50 px-4 py-3 text-[13.5px] text-slate-600"></p>
  </section>

  <section class="mt-8">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <h2 class="tight text-[16px] font-bold">학생 목록 <span id="cnt" class="num ml-1 text-[14px] font-medium text-slate-400"></span></h2>
      <input id="search" type="search" placeholder="이름으로 찾기" class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-[14px] outline-none focus:border-brand-600 sm:w-56" />
    </div>

    <div class="mt-3 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
      <div class="hidden border-b border-slate-100 bg-slate-50/60 px-5 py-3 sm:flex">
        <span class="w-36 text-[12.5px] font-semibold text-slate-400">이름</span>
        <span class="w-24 text-[12.5px] font-semibold text-slate-400">학년</span>
        <span class="flex-1 text-[12.5px] font-semibold text-slate-400">링크 상태</span>
        <span class="w-52 text-right text-[12.5px] font-semibold text-slate-400">관리</span>
      </div>
      <ul id="rows" class="divide-y divide-slate-100">
        <li class="px-5 py-8 text-center text-[13.5px] text-slate-400">불러오는 중입니다…</li>
      </ul>
    </div>
  </section>
</main>

<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-navy-900 px-4 py-2.5 text-[13.5px] font-medium text-white opacity-0 transition-opacity"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, serverTimestamp, query, where }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ★★★ 여기에 기존 파일의 firebaseConfig를 그대로 붙여넣으세요 ★★★ */
const firebaseConfig = {
  apiKey: "여기에_붙여넣기",
  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.appspot.com",
  messagingSenderId: "여기에_붙여넣기",
  appId: "여기에_붙여넣기"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 2200);
}

function newToken() {
  const raw = (crypto.randomUUID && crypto.randomUUID()) || "";
  if (raw) return raw.replace(/-/g, "").slice(0, 24);
  const b = new Uint8Array(18); crypto.getRandomValues(b);
  return Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("").slice(0, 24);
}

const linkBase = location.origin + location.pathname.replace(/[^/]*$/, "") + "student-me.html?t=";

let students = [];      // {docId, sid, name, grade, subject, teacher, classNames}
let portalBySid = {};   // sid -> {token, data}

/* ---------- 로그인 ---------- */
$("loginBtn").addEventListener("click", async () => {
  $("loginErr").classList.add("hidden");
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value);
  } catch (e) {
    $("loginErr").textContent = "로그인하지 못했습니다. 이메일과 비밀번호를 확인해 주세요.";
    $("loginErr").classList.remove("hidden");
  }
});
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  if (user) {
    $("loginView").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("logoutBtn").classList.remove("hidden");
    loadAll();
  } else {
    $("app").classList.add("hidden");
    $("logoutBtn").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  }
});

/* ---------- 불러오기 ---------- */
async function loadAll() {
  try {
    const [sSnap, pSnap] = await Promise.all([
      getDocs(collection(db, "students")),
      getDocs(collection(db, "portals"))
    ]);

    students = [];
    sSnap.forEach((d) => {
      const v = d.data() || {};
      const sid = v.id != null ? String(v.id) : "";
      if (!sid) return;                       // id 필드가 없는 문서는 건너뜁니다
      students.push({
        docId: d.id, sid,
        name: v.name || "(이름 없음)",
        grade: v.grade || "",
        subject: v.subject || "",
        teacher: v.teacher || "",
        classNames: Array.isArray(v.classNames) ? v.classNames : []
      });
    });
    students.sort((a, b) => a.name.localeCompare(b.name, "ko"));

    portalBySid = {};
    pSnap.forEach((d) => {
      const v = d.data() || {};
      if (v.studentId) portalBySid[String(v.studentId)] = { token: d.id, data: v };
    });

    renderRows();
  } catch (e) {
    console.error(e);
    $("rows").innerHTML = '<li class="px-5 py-8 text-center text-[13.5px] text-red-600">목록을 불러오지 못했습니다. 보안 규칙을 확인해 주세요.</li>';
  }
}

function renderRows() {
  const kw = $("search").value.trim();
  const list = kw ? students.filter((s) => s.name.includes(kw)) : students;
  $("cnt").textContent = `${list.length}명`;

  if (!list.length) {
    $("rows").innerHTML = '<li class="px-5 py-8 text-center text-[13.5px] text-slate-400">해당하는 학생이 없습니다.</li>';
    return;
  }

  $("rows").innerHTML = list.map((s) => {
    const p = portalBySid[s.sid];
    const cntTxt = p && Array.isArray(p.data.results) ? `${p.data.results.length}회차 반영됨` : "반영 대기";
    const status = p
      ? `<span class="inline-flex items-center gap-1.5 text-[13px] font-medium text-brand-700">
           <span class="h-1.5 w-1.5 rounded-full bg-brand-600"></span>발급됨 · ${esc(cntTxt)}</span>`
      : `<span class="text-[13px] text-slate-400">아직 링크 없음</span>`;

    const actions = p
      ? `<button data-act="copy" data-sid="${esc(s.sid)}" class="rounded-lg border border-slate-200 px-3 py-1.5 text-[13px] font-semibold transition-colors hover:bg-slate-50">링크 복사</button>
         <button data-act="reissue" data-sid="${esc(s.sid)}" class="rounded-lg px-3 py-1.5 text-[13px] font-medium text-slate-500 transition-colors hover:bg-slate-50">재발급</button>`
      : `<button data-act="create" data-sid="${esc(s.sid)}" class="rounded-lg bg-navy-900 px-3 py-1.5 text-[13px] font-semibold text-white transition-colors hover:bg-navy-800">링크 만들기</button>`;

    return `<li class="flex flex-col gap-2.5 px-5 py-4 sm:flex-row sm:items-center sm:gap-0">
      <span class="w-36 text-[14.5px] font-medium">${esc(s.name)}</span>
      <span class="w-24 text-[13.5px] text-slate-500">${esc(s.grade)}</span>
      <span class="flex-1">${status}</span>
      <span class="flex shrink-0 gap-2 sm:w-52 sm:justify-end">${actions}</span>
    </li>`;
  }).join("");
}

$("search").addEventListener("input", renderRows);

/* ---------- 버튼 동작 ---------- */
$("rows").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const sid = btn.getAttribute("data-sid");
  const act = btn.getAttribute("data-act");
  const s = students.find((x) => x.sid === sid);
  if (!s) return;

  if (act === "copy") {
    const p = portalBySid[sid];
    if (!p) return;
    const url = linkBase + p.token;
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했습니다"); }
    catch { window.prompt("아래 주소를 복사하세요", url); }
    return;
  }

  if (act === "create" || act === "reissue") {
    if (act === "reissue" && !confirm(`${s.name} 학생의 링크를 새로 만들까요?\n지금 쓰던 링크는 열리지 않게 됩니다.`)) return;
    btn.disabled = true;
    try {
      const old = portalBySid[sid];
      const token = newToken();
      await setDoc(doc(db, "portals", token), {
        studentId: s.sid,
        studentDocId: s.docId,
        name: s.name, grade: s.grade, subject: s.subject, teacher: s.teacher,
        classNames: s.classNames,
        results: old && Array.isArray(old.data.results) ? old.data.results : [],
        active: true,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      if (old) await deleteDoc(doc(db, "portals", old.token));

      portalBySid[sid] = { token, data: { studentId: s.sid, results: (old && old.data.results) || [] } };
      renderRows();
      try { await navigator.clipboard.writeText(linkBase + token); toast("링크를 만들고 복사했습니다"); }
      catch { toast("링크를 만들었습니다"); }
    } catch (err) {
      console.error(err);
      alert("링크를 만들지 못했습니다. 보안 규칙을 확인해 주세요.");
    } finally {
      btn.disabled = false;
    }
  }
});

/* ---------- 성적 반영 ---------- */
$("syncBtn").addEventListener("click", async () => {
  const targets = Object.keys(portalBySid);
  if (!targets.length) { alert("먼저 학생 링크를 만들어 주세요."); return; }

  const btn = $("syncBtn");
  btn.disabled = true;
  const msg = $("syncMsg");
  msg.classList.remove("hidden");
  msg.textContent = "성적을 읽는 중입니다…";

  try {
    const bySid = {};
    // 링크가 있는 학생만 조회합니다. (Firestore in 조건은 30개까지라 나눠서 요청합니다)
    for (let i = 0; i < targets.length; i += 30) {
      const chunk = targets.slice(i, i + 30);
      const qs = await getDocs(query(collection(db, "grades"), where("studentId", "in", chunk)));
      qs.forEach((d) => {
        const v = d.data() || {};
        const sid = String(v.studentId || "");
        if (!sid || !isFinite(Number(v.score))) return;
        let ts = null;
        if (v.timestamp && typeof v.timestamp.toMillis === "function") ts = v.timestamp.toMillis();
        else if (v.firstSubmittedAt && typeof v.firstSubmittedAt.toMillis === "function") ts = v.firstSubmittedAt.toMillis();
        (bySid[sid] = bySid[sid] || []).push({
          examId: v.examId || d.id.split("__")[0] || "",
          testName: v.testName || "시험",
          date: v.date || "",
          ts,
          score: Number(v.score),
          oxScore: isFinite(Number(v.oxScore)) ? Number(v.oxScore) : null,
          multiScore: isFinite(Number(v.multiScore)) ? Number(v.multiScore) : null,
          correctCount: isFinite(Number(v.correctCount)) ? Number(v.correctCount) : null,
          totalQuestions: isFinite(Number(v.totalQuestions)) ? Number(v.totalQuestions) : null
        });
      });
      msg.textContent = `성적을 읽는 중입니다… (${Math.min(i + 30, targets.length)}/${targets.length}명)`;
    }

    let done = 0, withData = 0;
    for (const sid of targets) {
      const p = portalBySid[sid];
      const rows = (bySid[sid] || []).sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-40);
      await setDoc(doc(db, "portals", p.token), { results: rows, updatedAt: serverTimestamp() }, { merge: true });
      p.data.results = rows;
      done++;
      if (rows.length) withData++;
      msg.textContent = `학생 화면에 반영하는 중입니다… (${done}/${targets.length}명)`;
    }

    msg.textContent = `반영을 마쳤습니다. 학생 ${done}명 중 ${withData}명에게 성적이 표시됩니다.`;
    renderRows();
    toast("반영을 마쳤습니다");
  } catch (e) {
    console.error(e);
    msg.textContent = "반영에 실패했습니다. 잠시 후 다시 시도해 주세요.";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
