<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>출결 등록 - 인후쌤 과학수업</title>
<style>
/* ══════════════════════════════════════════════════════════════
   출결 키오스크 · kiosk.html
   ──────────────────────────────────────────────────────────────
   · 아이패드 전용 전체화면. Firebase SDK 를 싣지 않는다.
     firestore.rules 가 쓰기를 관리자 계정에만 허용하므로
     클라이언트에서 출결을 쓰는 것 자체가 불가능하다.
     모든 조회·기록은 /api/attend 한 곳만 거친다.
   · 기기 키는 이 파일에 하드코딩하지 않는다. 저장소가 Public 이라
     커밋하는 순간 읽힌다. ?k= 로 받아 localStorage 에 보관한다.
   · 색은 학생 대면 규약(네이비 #004AAD)을 따른다.
   ══════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
  background:#04143a;color:#fff;
  -webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
  /* 더블탭 확대를 막되 탭 자체는 그대로 통과시킨다.
     touchend 에서 preventDefault 로 막으면 빠르게 연타할 때
     합성 click 이 함께 취소되어 숫자가 씹힌다. */
  touch-action:manipulation;
}
button{touch-action:manipulation}

/* 화면 전체가 상태를 말한다 — 교실 반대편에서도 색만 보고 안다 */
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background:#04143a;transition:background .28s ease;
}
#app[data-tone="ok"]{background:#065f46}
#app[data-tone="last"]{background:#854d0e}
#app[data-tone="due"]{background:#8a1c2b}
#app[data-tone="bad"]{background:#3f3f46}

/* ── 상단 ── */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.02em;opacity:.72}
.mark{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.clock{font-size:15px;font-weight:600;opacity:.72;font-variant-numeric:tabular-nums}
.netdot{width:7px;height:7px;border-radius:50%;background:#4ade80;margin-left:8px;flex-shrink:0}
.netdot.off{background:#fbbf24}

/* ── 본문 ── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 24px}
.view{display:none;flex-direction:column;align-items:center;width:100%}
.view.on{display:flex}

/* 입력 화면 */
.ask{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-bottom:6px;text-align:center}
.ask-sub{font-size:15px;opacity:.55;margin-bottom:30px;text-align:center}
.dots{display:flex;gap:20px;margin-bottom:38px;height:26px;align-items:center}
.dot{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(255,255,255,.32);transition:all .14s}
.dot.fill{background:#fff;border-color:#fff;transform:scale(1.06)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:400px}
.key{
  height:84px;border:none;border-radius:22px;
  background:rgba(255,255,255,.1);color:#fff;
  font-family:inherit;font-size:34px;font-weight:500;
  cursor:pointer;transition:transform .08s,background .12s;
  display:flex;align-items:center;justify-content:center;
}
.key:active{background:rgba(255,255,255,.26);transform:scale(.95)}
.key.util{font-size:17px;font-weight:600;background:rgba(255,255,255,.05)}
.key:disabled{opacity:.3;pointer-events:none}

/* 결과 화면 */
.big-name{font-size:58px;font-weight:700;letter-spacing:-.045em;line-height:1.1;text-align:center}
.big-act{font-size:30px;font-weight:600;margin-top:14px;opacity:.9}
.remain{
  margin-top:34px;padding:16px 34px;border-radius:999px;
  background:rgba(255,255,255,.16);font-size:21px;font-weight:600;text-align:center;line-height:1.5;
}
.remain b{font-size:27px;font-weight:800}
.remain-note{font-size:16px;opacity:.85;margin-top:16px;text-align:center;max-width:440px;line-height:1.6;word-break:keep-all}

/* 이름 고르기 */
.pick-title{font-size:24px;font-weight:600;margin-bottom:8px;text-align:center}
.pick-sub{font-size:15px;opacity:.55;margin-bottom:26px;text-align:center}
.pick-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:400px}
.pick-btn{
  height:74px;border:none;border-radius:18px;background:rgba(255,255,255,.12);
  color:#fff;font-family:inherit;font-size:23px;font-weight:600;cursor:pointer;
  transition:transform .08s,background .12s;
}
.pick-btn:active{background:rgba(255,255,255,.26);transform:scale(.97)}
.pick-cancel{
  margin-top:20px;padding:14px 30px;border:none;border-radius:14px;
  background:transparent;color:rgba(255,255,255,.6);
  font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;
}

/* 안내 · 오류 */
.msg-icon{font-size:56px;margin-bottom:18px}
.msg{font-size:27px;font-weight:600;text-align:center;letter-spacing:-.03em;line-height:1.4;word-break:keep-all;max-width:520px}
.msg-sub{font-size:17px;opacity:.68;margin-top:14px;text-align:center;line-height:1.6;word-break:keep-all;max-width:480px}

.spin{width:46px;height:46px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── 하단 ── */
.bottom{flex-shrink:0;padding:16px 28px 22px;text-align:center;font-size:13px;opacity:.4;min-height:52px}
.queued{opacity:.85;font-weight:600;color:#fde68a}

/* 설정 안 된 상태 */
.setup{padding:40px;text-align:center;max-width:560px}
.setup h2{font-size:25px;font-weight:700;margin-bottom:16px;letter-spacing:-.03em}
.setup p{font-size:16px;line-height:1.8;opacity:.8;word-break:keep-all}
.setup code{background:rgba(255,255,255,.15);padding:3px 9px;border-radius:6px;font-size:15px}

@media (max-height:700px){
  .key{height:68px;font-size:29px}
  .pad{gap:12px;max-width:340px}
  .big-name{font-size:46px}
  .dots{margin-bottom:26px}
  .ask{font-size:22px}
  .ask-sub{margin-bottom:22px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="app" data-tone="">

  <div class="top">
    <div class="brand">
      <span class="mark">
        <svg width="15" height="15" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <circle cx="9" cy="7" r="3" fill="rgba(255,255,255,.92)"/>
          <path d="M3.5 16c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke="rgba(255,255,255,.92)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
      </span>
      <span>인후쌤 과학수업</span>
    </div>
    <div style="display:flex;align-items:center">
      <span class="clock" id="clock">--:--</span>
      <span class="netdot" id="netdot" title="연결 상태"></span>
    </div>
  </div>

  <div class="stage">

    <!-- 입력 -->
    <div class="view on" id="v-input">
      <div class="ask">전화번호 뒷 4자리</div>
      <div class="ask-sub">등원과 하원 모두 같은 번호를 누르면 됩니다</div>
      <div class="dots" id="dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="pad" id="pad"></div>
    </div>

    <!-- 이름 고르기 -->
    <div class="view" id="v-pick">
      <div class="pick-title">본인 이름을 눌러 주세요</div>
      <div class="pick-sub">같은 번호를 쓰는 학생이 여러 명입니다</div>
      <div class="pick-list" id="pickList"></div>
      <button class="pick-cancel" id="pickCancel">처음으로</button>
    </div>

    <!-- 처리 중 -->
    <div class="view" id="v-load">
      <div class="spin"></div>
    </div>

    <!-- 결과 -->
    <div class="view" id="v-done">
      <div class="big-name" id="doneName"></div>
      <div class="big-act" id="doneAct"></div>
      <div class="remain" id="doneRemain"></div>
      <div class="remain-note" id="doneNote"></div>
    </div>

    <!-- 안내 · 오류 -->
    <div class="view" id="v-msg">
      <div class="msg-icon" id="msgIcon"></div>
      <div class="msg" id="msgText"></div>
      <div class="msg-sub" id="msgSub"></div>
    </div>

    <!-- 기기 키 없음 -->
    <div class="view" id="v-setup">
      <div class="setup">
        <h2>이 아이패드는 아직 등록되지 않았습니다</h2>
        <p>주소 끝에 <code>?k=기기키</code> 를 붙여 한 번만 열면 됩니다.<br>
        기기 키는 Vercel 환경변수 <code>KIOSK_KEY</code> 에 넣은 값과 같아야 합니다.</p>
      </div>
    </div>

  </div>

  <div class="bottom" id="bottom"></div>

</div>

<script>
(function(){
'use strict';

/* ── 설정 ─────────────────────────────────────────────────────── */
var API        = '/api/attend';
var KEY_STORE  = 'kioskDeviceKey';   // 기기 키 보관
var QUEUE_STORE= 'kioskQueue';       // 전송 실패분
var DONE_MS    = 4200;               // 결과 화면 유지 시간
var MSG_MS     = 3400;
var FLUSH_MS   = 30000;              // 큐 재전송 주기

/* ── 요소 ─────────────────────────────────────────────────────── */
var app    = document.getElementById('app');
var dotsEl = document.getElementById('dots');
var padEl  = document.getElementById('pad');
var bottom = document.getElementById('bottom');
var clockEl= document.getElementById('clock');
var netdot = document.getElementById('netdot');

var views = {
  input: document.getElementById('v-input'),
  pick : document.getElementById('v-pick'),
  load : document.getElementById('v-load'),
  done : document.getElementById('v-done'),
  msg  : document.getElementById('v-msg'),
  setup: document.getElementById('v-setup')
};

/* ── 상태 ─────────────────────────────────────────────────────── */
var buf = '';          // 입력 중인 숫자
var busy = false;      // 전송 중이거나 결과 표시 중
var resetTimer = null;
var deviceKey = '';

/* ── 기기 키 ───────────────────────────────────────────────────
   ?k= 로 한 번 받아 localStorage 에 넣는다. 받은 뒤에는 주소창에서
   지워 어깨너머로 보이지 않게 한다. 파일에 하드코딩하지 않는 이유는
   저장소가 Public 이기 때문이다. ------------------------------ */
function initKey(){
  var q = '';
  try{ q = new URLSearchParams(location.search).get('k') || ''; }catch(e){ q = ''; }
  if(q){
    try{ localStorage.setItem(KEY_STORE, q); }catch(e){}
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    deviceKey = q;
    return true;
  }
  try{ deviceKey = localStorage.getItem(KEY_STORE) || ''; }catch(e){ deviceKey = ''; }
  return !!deviceKey;
}

/* ── 화면 전환 ─────────────────────────────────────────────────── */
function show(name, tone){
  for(var k in views){
    if(Object.prototype.hasOwnProperty.call(views, k)){
      views[k].classList.toggle('on', k === name);
    }
  }
  app.setAttribute('data-tone', tone || '');
}

function toIdle(){
  if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
  buf = '';
  busy = false;
  paintDots();
  show('input', '');
  paintBottom();
}

function later(fn, ms){
  if(resetTimer) clearTimeout(resetTimer);
  resetTimer = setTimeout(fn, ms);
}

/* ── 입력 ─────────────────────────────────────────────────────── */
function paintDots(){
  var ds = dotsEl.children;
  for(var i = 0; i < ds.length; i++){
    ds[i].classList.toggle('fill', i < buf.length);
  }
}

function press(n){
  if(busy || !deviceKey || buf.length >= 4) return;
  buf += n;
  paintDots();
  /* 마지막 도트가 채워지는 걸 보여 준 뒤 보낸다.
     이때 값을 고정해 둔다. 180ms 사이에 ← 를 누르면 buf 가 줄어드는데,
     실행 시점에 buf 를 읽으면 3자리가 전송된다. */
  if(buf.length === 4){
    var fixed = buf;
    later(function(){ submit(fixed, null); }, 180);
  }
}

function back(){
  if(busy || !buf.length) return;
  /* 예약된 전송이 있으면 함께 취소한다 */
  if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
  buf = buf.slice(0, -1);
  paintDots();
}

function buildPad(){
  var keys = ['1','2','3','4','5','6','7','8','9','clear','0','back'];
  var frag = document.createDocumentFragment();
  keys.forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    if(k === 'clear'){
      b.className = 'key util'; b.textContent = '지움';
      b.addEventListener('click', function(){ if(!busy){ buf=''; paintDots(); } });
    }else if(k === 'back'){
      b.className = 'key util'; b.textContent = '←';
      b.setAttribute('aria-label','한 글자 지우기');
      b.addEventListener('click', back);
    }else{
      b.className = 'key'; b.textContent = k;
      b.addEventListener('click', function(){ press(k); });
    }
    frag.appendChild(b);
  });
  padEl.appendChild(frag);
}

/* ── 전송 ─────────────────────────────────────────────────────── */
function submit(last4, studentId){
  if(!deviceKey) return;
  /* 이름 고르기 화면의 15초 자동복귀 타이머가 응답 도중 터지면
     입력 화면으로 돌아간 뒤 결과가 덮어 씌워진다. 먼저 끈다. */
  if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
  busy = true;
  show('load', '');

  var payload = { last4: last4, deviceKey: deviceKey };
  if(studentId) payload.studentId = studentId;

  fetch(API, {
    method : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body   : JSON.stringify(payload)
  })
  .then(function(r){
    return r.json().catch(function(){ throw new Error('bad-json'); })
      .then(function(j){ return { status: r.status, body: j }; });
  })
  .then(function(res){
    handle(res.body, last4);
  })
  .catch(function(){
    /* 네트워크가 끊겼다. 기록을 버리지 않고 쌓아 둔 뒤 나중에 보낸다. */
    enqueue({ last4: last4, studentId: studentId || null, at: new Date().toISOString() });
    showMsg('📡', '기록해 두었습니다', '지금 인터넷이 불안정합니다. 연결되면 자동으로 등록됩니다. 그냥 들어가세요.');
  });
}

function handle(b, last4){
  if(!b || typeof b !== 'object'){
    showMsg('⚠️', '잠시 후 다시 눌러 주세요', '');
    return;
  }

  /* 같은 뒷자리가 여러 명 — 이름은 서버가 가려서 보낸다 */
  if(b.ok && b.multiple && Array.isArray(b.candidates) && b.candidates.length){
    renderPick(b.candidates, last4);
    return;
  }

  if(b.ok){
    renderDone(b);
    return;
  }

  var code = b.code || '';
  if(code === 'not_found'){
    showMsg('🔍', '등록되지 않은 번호입니다', '번호를 다시 확인하시고, 그래도 안 되면 선생님께 말씀해 주세요.');
  }else if(code === 'cooldown'){
    showMsg('✅', '이미 등록되었습니다', '방금 처리된 기록이 있습니다. 그냥 들어가세요.');
  }else if(code === 'bad_key'){
    showMsg('🔒', '이 아이패드는 등록되지 않았습니다', '선생님께 말씀해 주세요.');
  }else{
    showMsg('⚠️', '잠시 후 다시 눌러 주세요', b.message || '');
  }
}

/* ── 결과 ─────────────────────────────────────────────────────── */
function renderDone(b){
  var name = b.name || '';
  var act  = b.action === 'out' ? '하원했습니다' : '등원했습니다';
  var rem  = (typeof b.remaining === 'number') ? b.remaining : null;

  document.getElementById('doneName').textContent = name;
  document.getElementById('doneAct').textContent  = act + (b.time ? '  ·  ' + b.time : '');

  var remEl  = document.getElementById('doneRemain');
  var noteEl = document.getElementById('doneNote');
  var tone   = 'ok';

  if(rem === null){
    remEl.style.display = 'none';
    noteEl.textContent = '';
  }else{
    remEl.style.display = '';
    if(rem <= 0){
      tone = 'due';
      remEl.innerHTML = '남은 횟수 <b>0회</b>';
      noteEl.textContent = '원비 납부가 필요합니다. 선생님께 말씀해 주세요. 수업은 그대로 들으시면 됩니다.';
    }else if(rem === 1){
      tone = 'last';
      remEl.innerHTML = '남은 횟수 <b>1회</b>';
      noteEl.textContent = '오늘이 이번 4회권의 마지막 수업입니다.';
    }else{
      remEl.innerHTML = '남은 횟수 <b>' + rem + '회</b>';
      noteEl.textContent = '';
    }
  }

  show('done', tone);
  later(toIdle, DONE_MS);
}

function showMsg(icon, text, sub){
  document.getElementById('msgIcon').textContent = icon;
  document.getElementById('msgText').textContent = text;
  document.getElementById('msgSub').textContent  = sub || '';
  show('msg', 'bad');
  later(toIdle, MSG_MS);
}

/* ── 이름 고르기 ───────────────────────────────────────────────── */
function renderPick(list, last4){
  var wrap = document.getElementById('pickList');
  wrap.textContent = '';
  list.slice(0, 6).forEach(function(c){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick-btn';
    b.textContent = c.name || '?';
    b.addEventListener('click', function(){ submit(last4, c.id); });
    wrap.appendChild(b);
  });
  busy = false;
  show('pick', '');
  later(toIdle, 15000);
}

/* ── 오프라인 큐 ───────────────────────────────────────────────
   아이패드 와이파이는 생각보다 자주 끊긴다. 실패한 등원을 버리면
   그 학생 기록이 통째로 사라지므로 쌓아 두었다가 다시 보낸다. --- */
function readQueue(){
  try{ return JSON.parse(localStorage.getItem(QUEUE_STORE) || '[]'); }
  catch(e){ return []; }
}
function writeQueue(q){
  try{ localStorage.setItem(QUEUE_STORE, JSON.stringify(q.slice(-80))); }catch(e){}
}
function enqueue(item){
  var q = readQueue();
  q.push(item);
  writeQueue(q);
  paintBottom();
}

var flushing = false;

function flush(){
  /* 30초 주기와 online 이벤트가 겹치면 두 번 돌면서
     같은 항목을 두 번 보내고 shift 를 두 번 해 한 건이 사라진다. */
  if(flushing) return;
  var q = readQueue();
  if(!q.length || !deviceKey) return;
  flushing = true;

  var item = q[0];
  var payload = { last4: item.last4, deviceKey: deviceKey, at: item.at, queued: true };
  if(item.studentId) payload.studentId = item.studentId;

  fetch(API, {
    method : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body   : JSON.stringify(payload)
  })
  .then(function(r){ return r.json(); })
  .then(function(b){
    /* 성공했거나, 다시 보내도 소용없는 실패(없는 번호 등)면 큐에서 뺀다.
       서버 오류만 남겨 두고 다음 주기에 재시도한다. */
    var more = false;
    if(b && (b.ok || b.code === 'not_found' || b.code === 'cooldown' || b.code === 'bad_key')){
      var cur = readQueue();
      cur.shift();
      writeQueue(cur);
      paintBottom();
      more = cur.length > 0;
    }
    flushing = false;
    if(more) setTimeout(flush, 900);
  })
  .catch(function(){ flushing = false; /* 아직 안 된다. 다음 주기에 다시 */ });
}

/* ── 하단 표시 ─────────────────────────────────────────────────── */
function paintBottom(){
  var n = readQueue().length;
  if(n){
    bottom.className = 'bottom queued';
    bottom.textContent = '전송 대기 중인 기록 ' + n + '건 — 연결되면 자동으로 올라갑니다';
  }else{
    bottom.className = 'bottom';
    bottom.textContent = '문제가 있으면 선생님께 말씀해 주세요';
  }
}

/* ── 시계 · 연결 상태 ──────────────────────────────────────────── */
function tick(){
  var d = new Date();
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h < 12 ? '오전' : '오후';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  clockEl.textContent = ampm + ' ' + h12 + ':' + (m < 10 ? '0' + m : m);
}
function paintNet(){
  netdot.classList.toggle('off', navigator.onLine === false);
}

/* ── 화면 꺼짐 방지 ────────────────────────────────────────────── */
function keepAwake(){
  if(!navigator.wakeLock || !navigator.wakeLock.request) return;
  navigator.wakeLock.request('screen').catch(function(){});
}

/* ── 시작 ─────────────────────────────────────────────────────── */
function start(){
  buildPad();
  tick();
  paintNet();
  paintBottom();
  setInterval(tick, 15000);
  setInterval(flush, FLUSH_MS);

  window.addEventListener('online',  function(){ paintNet(); flush(); });
  window.addEventListener('offline', paintNet);

  document.getElementById('pickCancel').addEventListener('click', toIdle);

  /* 물리 키보드를 붙여 쓰는 경우도 받아 준다 */
  document.addEventListener('keydown', function(e){
    if(e.key >= '0' && e.key <= '9') press(e.key);
    else if(e.key === 'Backspace') back();
    else if(e.key === 'Escape') toIdle();
  });

  /* 두 손가락 확대 차단. 더블탭 확대는 CSS touch-action 이 맡는다. */
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){ keepAwake(); flush(); tick(); }
  });

  if(!initKey()){
    show('setup', 'bad');
    return;
  }

  keepAwake();
  flush();
  toIdle();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', start);
}else{
  start();
}

})();
</script>
</body>
