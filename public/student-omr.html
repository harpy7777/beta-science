<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="/favicon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#db2777">
<title>인후쌤의 과학 수업 관리 시스템 · 마스터테스트 OMR</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  background: #fafafa; color: #1d1d1f; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

/* ── Header ── */
.header {
  background: #fff; border-bottom: 1px solid #fce7f3;
  padding: 0 1rem;
  padding-left: max(1rem, env(safe-area-inset-left));
  padding-right: max(1rem, env(safe-area-inset-right));
  height: 54px;
  display: flex; align-items: center; justify-content: center;
  position: sticky; top: 0; z-index: 300;
}
.header-inner { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg,#f472b6,#db2777);
  border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.brand { font-size: 15px; font-weight: 700; color: #1d1d1f; line-height: 1.2; }
.brand-sub { font-size: 11px; color: #db2777; font-weight: 600; margin-top: 1px; }

/* ── 공통 카드 ── */
.card {
  background: #fff; border: 1px solid #fce7f3; border-radius: 18px;
  padding: 2rem; max-width: 520px; margin: 2rem auto;
  box-shadow: 0 4px 24px rgba(219,39,119,0.08);
}
.entry-title { font-size: 1.1rem; font-weight: 700; color: #1d1d1f; margin-bottom: 1.4rem; display: flex; align-items: center; gap: 8px; }
.field-label { font-size: 11px; font-weight: 700; color: #db2777; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
.field-group { margin-bottom: 14px; }
.inp {
  width: 100%; padding: 12px 14px; min-height: 48px; border: 1.5px solid #fce7f3;
  border-radius: 12px; font-size: 16px; font-family: inherit;
  color: #1d1d1f; outline: none; background: #fff; transition: border 0.15s;
  -webkit-appearance: none; appearance: none;
}
.inp:focus { border-color: #db2777; }
.inp-hint { font-size: 11px; color: #aeaeb2; margin-top: 5px; line-height: 1.5; }
.error-msg { font-size: 12px; color: #dc2626; margin-top: 6px; display: none; }
.grade-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.grade-btn {
  padding: 10px; border: 1.5px solid #fce7f3; border-radius: 10px;
  background: #fff; font-size: 14px; font-weight: 600; color: #6e6e73;
  cursor: pointer; font-family: inherit; transition: all 0.15s; text-align: center;
  min-height: 48px; touch-action: manipulation;
}
.grade-btn.sel { background: linear-gradient(135deg,#f472b6,#db2777); color: #fff; border-color: #db2777; }
.grade-btn:hover:not(.sel) { border-color: #fbcfe8; color: #db2777; }
.enter-btn {
  width: 100%; padding: 14px; background: linear-gradient(135deg,#f472b6,#db2777);
  border: none; border-radius: 14px; font-size: 15px; font-weight: 700;
  color: #fff; cursor: pointer; font-family: inherit; margin-top: 1.2rem;
  transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; touch-action: manipulation;
}
.enter-btn:hover { opacity: 0.88; }
.enter-btn:disabled { background: #fce7f3; color: #fff; cursor: not-allowed; }
.student-badge {
  background: #fdf2f8; border: 1px solid #fce7f3; border-radius: 10px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; color: #db2777;
  display: inline-block; margin-bottom: 14px;
}

/* ── 테스트 목록 ── */
.test-list { display: flex; flex-direction: column; gap: 10px; }
.test-item {
  padding: 14px 16px; border: 1.5px solid #fce7f3; border-radius: 14px;
  background: #fff; cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 60px; touch-action: manipulation;
}
.test-item:hover { border-color: #fbcfe8; background: #fdf2f8; }
.test-item:active { transform: scale(0.995); }
.test-info { min-width: 0; }
.test-name { font-size: 14px; font-weight: 700; color: #1d1d1f; line-height: 1.4; word-break: keep-all; }
.test-meta { font-size: 11.5px; color: #db2777; margin-top: 3px; }
.test-arrow { font-size: 18px; color: #db2777; flex-shrink: 0; }
.back-btn {
  background: none; border: none; font-size: 13px; font-weight: 600;
  color: #6e6e73; cursor: pointer; font-family: inherit; padding: 0;
  margin-bottom: 14px; display: flex; align-items: center; gap: 4px;
  transition: color 0.15s; min-height: 40px; touch-action: manipulation;
}
.back-btn:hover { color: #db2777; }

/* ── OMR 화면 ── */
.omr-wrap {
  max-width: 780px; margin: 0 auto;
  padding: 1.1rem 0.85rem 1rem;
  padding-left: max(0.85rem, env(safe-area-inset-left));
  padding-right: max(0.85rem, env(safe-area-inset-right));
}
.omr-header-card {
  background: #fff; border: 1px solid #fce7f3; border-radius: 18px;
  padding: 1rem 1.2rem; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
}
.omr-title { font-size: 1rem; font-weight: 700; color: #1d1d1f; line-height: 1.35; word-break: keep-all; }
.omr-meta { font-size: 12px; color: #db2777; margin-top: 3px; }
.omr-student-badge {
  background: #fdf2f8; border: 1px solid #fce7f3; border-radius: 10px;
  padding: 6px 12px; font-size: 12px; font-weight: 700; color: #db2777; white-space: nowrap;
}

/* ── 진행바 (스크롤해도 위에 고정) ── */
.progress-dock {
  position: sticky; top: 54px; z-index: 200;
  background: rgba(250,250,250,0.94);
  -webkit-backdrop-filter: saturate(180%) blur(10px);
  backdrop-filter: saturate(180%) blur(10px);
  padding: 8px 0 10px; margin: 0 -0.15rem 10px;
}
.progress-bar-wrap { background: #fff; border: 1px solid #fce7f3; border-radius: 14px; padding: 10px 14px; }
.progress-label { font-size: 11.5px; font-weight: 700; color: #db2777; margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.progress-left { display: flex; align-items: center; gap: 7px; min-width: 0; }
.progress-track { height: 8px; background: #fce7f3; border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg,#f472b6,#db2777); border-radius: 99px; transition: width 0.3s ease; width: 0%; }
.jump-btn {
  border: 1px solid #fecaca; background: #fff5f5; color: #dc2626;
  border-radius: 20px; padding: 5px 11px; min-height: 32px;
  font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer;
  white-space: nowrap; display: none; touch-action: manipulation;
}
.jump-btn.show { display: inline-block; }

/* ★ 미응답 안내줄 — 안 푼 문제가 있으면 항상 보인다 */
.omr-warn {
  display: none; margin-top: 9px; padding: 8px 11px;
  background: #fffbeb; border: 1px solid #fde68a; border-radius: 11px;
  font-size: 11.5px; font-weight: 700; color: #b45309; line-height: 1.55;
  word-break: keep-all;
}
.omr-warn.show { display: block; }
.omr-warn.ok { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }

/* 부(section) 바로가기 칩 */
.part-chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 9px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.part-chips::-webkit-scrollbar { display: none; }
.part-chip {
  flex-shrink: 0; border: 1.5px solid #fce7f3; background: #fff; color: #6e6e73;
  border-radius: 20px; padding: 6px 13px; min-height: 34px;
  font-size: 11.5px; font-weight: 700; font-family: inherit; cursor: pointer;
  white-space: nowrap; touch-action: manipulation;
}
.part-chip.done { border-color: #a7f3d0; background: #ecfdf5; color: #059669; }

/* ── OMR 문항 ── */
.omr-section {
  background: #fff; border: 1px solid #fce7f3; border-radius: 16px;
  padding: 1rem 1rem 1.1rem; margin-bottom: 10px;
  scroll-margin-top: 150px;
}
.omr-section-title {
  font-size: 13px; font-weight: 700; color: #1d1d1f; margin-bottom: 12px;
  padding-bottom: 9px; border-bottom: 1px solid #fdf2f8;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.part-tag { background:#fdf2f8; color:#db2777; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap; }

/* 한 문항 = 한 줄 (번호 + ①②③④⑤) — 넓은 화면에서는 자동 2~3열 */
.omr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 7px; }
.omr-q {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 7px; border: 1.5px solid transparent; border-radius: 12px;
  transition: background 0.15s, border-color 0.15s;
  scroll-margin-top: 160px;
}
.omr-q.answered { background: #fdf7fa; }
.omr-q.missing { border-color: #fecaca; background: #fff5f5; }
.omr-q-num { flex: 0 0 36px; text-align: center; font-size: 12px; font-weight: 800; color: #6e6e73; }
.omr-q.answered .omr-q-num { color: #db2777; }
.omr-choices { display: flex; gap: 5px; flex: 1 1 auto; min-width: 0; }
.omr-choice {
  flex: 1 1 0; min-width: 0; max-width: 48px; aspect-ratio: 1 / 1; min-height: 38px;
  border-radius: 50%; border: 2px solid #fce7f3; background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #6e6e73; cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.omr-choice:hover { border-color: #fbcfe8; color: #db2777; }
.omr-choice:active { transform: scale(0.93); }
.omr-choice.sel { background: linear-gradient(135deg,#f472b6,#db2777); border-color: #db2777; color: #fff; }

/* ── 제출 (아래 고정) ── */
.submit-dock {
  position: sticky; bottom: 0; z-index: 200;
  padding: 10px 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(250,250,250,0) 0%, rgba(250,250,250,0.95) 32%, #fafafa 100%);
}
.submit-btn {
  width: 100%; padding: 15px; min-height: 54px;
  background: linear-gradient(135deg,#f472b6,#db2777);
  border: none; border-radius: 16px; font-size: 16px; font-weight: 700;
  color: #fff; cursor: pointer; font-family: inherit;
  transition: opacity 0.15s; box-shadow: 0 4px 16px rgba(219,39,119,0.25);
  touch-action: manipulation;
}
.submit-btn:hover { opacity: 0.88; }
.submit-btn:active { transform: scale(0.995); }
.submit-btn:disabled { background: #fce7f3; cursor: not-allowed; box-shadow: none; }
.submit-btn.wait { background: linear-gradient(135deg,#fbbf24,#d97706); box-shadow: 0 4px 16px rgba(217,119,6,0.22); }

/* ── 결과 ── */
.result-card {
  background: #fff; border: 1px solid #fce7f3; border-radius: 20px;
  padding: 2.4rem 1.8rem; max-width: 520px; margin: 2rem auto; text-align: center;
  box-shadow: 0 4px 24px rgba(219,39,119,0.1);
}
.result-emoji { font-size: 3rem; margin-bottom: 1rem; }
.result-title { font-size: 1.3rem; font-weight: 700; color: #1d1d1f; margin-bottom: 6px; }
.result-sub { font-size: 13px; color: #6e6e73; margin-bottom: 1.8rem; line-height: 1.6; }
.result-score-box {
  background: #fdf2f8; border: 1px solid #fce7f3; border-radius: 16px;
  padding: 1.4rem; margin-bottom: 1.2rem;
}
.result-score-num { font-size: 2.5rem; font-weight: 700; color: #db2777; letter-spacing: -0.05em; }
.result-score-lbl { font-size: 12px; color: #6e6e73; margin-top: 4px; }
.result-detail { font-size: 12.5px; color: #6e6e73; margin-bottom: 1.2rem; line-height: 1.7; }
.result-task-box {
  background: #fef9c3; border: 1px solid #fde68a; border-radius: 14px;
  padding: 1rem 1.2rem; text-align: left; margin-bottom: 1.4rem;
}
.result-task-title { font-size: 11px; font-weight: 700; color: #854d0e; margin-bottom: 6px; }
.result-task-text { font-size: 13px; color: #1d1d1f; line-height: 1.6; }
.result-again {
  font-size: 11.5px; color: #6e6e73; line-height: 1.65;
  background: #f5f5f7; border-radius: 11px; padding: 9px 12px; margin-bottom: 1.2rem;
}
.home-btn {
  display: inline-block; padding: 13px 28px; min-height: 48px;
  background: linear-gradient(135deg,#f472b6,#db2777);
  border: none; border-radius: 14px; font-size: 14px; font-weight: 700;
  color: #fff; cursor: pointer; font-family: inherit; text-decoration: none;
  transition: opacity 0.15s; touch-action: manipulation;
}
.home-btn:hover { opacity: 0.88; }

.loading { text-align: center; padding: 3rem 1rem; color: #db2777; font-size: 13px; }
.spinner { width: 32px; height: 32px; border: 3px solid #fce7f3; border-top-color: #db2777; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-hint { font-size: 13px; color: #aeaeb2; padding: 2rem 1rem; text-align: center; line-height: 1.7; }
.screen { display: none; }
.screen.active { display: block; }

/* ★ 저장 중 덮개 */
.saving-veil {
  display: none; position: fixed; inset: 0; z-index: 900;
  background: rgba(255,255,255,0.88);
  align-items: center; justify-content: center; padding: 1.5rem;
}
.saving-veil.show { display: flex; }
.saving-veil .sv-in { text-align: center; }
.saving-veil .sv-t { font-size: 13.5px; font-weight: 700; color: #db2777; }
.saving-veil .sv-s { font-size: 11.5px; color: #aeaeb2; margin-top: 5px; }

/* ── 모바일 ── */
@media (max-width: 560px) {
  .brand { font-size: 13.5px; }
  .brand-sub { font-size: 10px; }
  .card { margin: 1rem 0.8rem; padding: 1.4rem 1.2rem; border-radius: 16px; }
  .card { margin-left: max(0.8rem, env(safe-area-inset-left)); margin-right: max(0.8rem, env(safe-area-inset-right)); }
  .omr-wrap { padding: 0.9rem 0.7rem 0.8rem; }
  .omr-header-card { padding: 0.9rem 1rem; border-radius: 16px; }
  .omr-title { font-size: 0.95rem; }
  .omr-student-badge { font-size: 11.5px; padding: 5px 10px; }
  .omr-section { padding: 0.9rem 0.75rem 1rem; }
  .omr-grid { grid-template-columns: 1fr; gap: 6px; }
  .omr-q-num { flex: 0 0 32px; font-size: 11.5px; }
  .omr-choice { max-width: 52px; min-height: 42px; font-size: 13px; }
  .omr-warn { font-size: 11px; padding: 8px 10px; }
  .result-card { margin: 1rem 0.8rem; padding: 2rem 1.3rem; }
}
@media (max-width: 340px) {
  .omr-q { gap: 6px; padding: 4px 3px; }
  .omr-choices { gap: 4px; }
  .omr-q-num { flex: 0 0 28px; }
  .omr-choice { min-height: 38px; }
}
/* 가로 모드 등 넓은 화면에서 3열까지 */
@media (min-width: 900px) {
  .omr-grid { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
}
</style>
<script>(function(){if(new URLSearchParams(location.search).get('student')!=='1')return;var here=location.pathname;function cross(a){var raw=a.getAttribute('href');if(!raw||raw.charAt(0)==='#')return false;if(/^(javascript:|mailto:|tel:|sms:)/i.test(raw.trim()))return false;try{return new URL(a.href,location.href).pathname!==here;}catch(e){return false;}}function lock(){document.querySelectorAll('a[href]').forEach(function(a){if(!cross(a))return;a.removeAttribute('href');a.style.pointerEvents='none';a.style.cursor='default';a.setAttribute('aria-disabled','true');});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',lock);else lock();document.addEventListener('click',function(e){var a=e.target.closest?e.target.closest('a[href]'):null;if(a&&cross(a)){e.preventDefault();e.stopPropagation();}},true);})();</script></head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="7" r="3" fill="rgba(255,255,255,0.9)"/>
        <path d="M3.5 16c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke="rgba(255,255,255,0.9)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div>
      <div class="brand">인후쌤의 과학 수업 관리 시스템</div>
      <div class="brand-sub">마스터테스트 OMR</div>
    </div>
  </div>
</header>

<!-- ★ 저장 중 덮개 -->
<div class="saving-veil" id="saving-veil">
  <div class="sv-in">
    <div class="spinner"></div>
    <div class="sv-t">성적을 저장하고 있어요</div>
    <div class="sv-s">창을 닫거나 새로고침하지 마세요</div>
  </div>
</div>

<!-- ⓪ 자동 진입 로딩 (클리닉 링크로 들어올 때) -->
<div class="screen" id="screen-autoload">
  <div class="loading" style="padding:5rem 1rem;"><div class="spinner"></div>시험을 여는 중...</div>
</div>

<!-- ① 입장 화면 -->
<div class="screen active" id="screen-entry">
  <div class="card">
    <div class="entry-title">🎓 학생 입장</div>

    <div class="field-group">
      <label class="field-label" for="entry-student-id">학생 ID</label>
      <input class="inp" type="text" id="entry-student-id"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        placeholder="예: m01001, h01001"
        oninput="this.value=this.value.toLowerCase()"
        onkeydown="if(event.key==='Enter') doEnter()">
      <div class="inp-hint">선생님께 받은 학생 ID를 입력하세요</div>
      <div class="error-msg" id="id-error">학생 ID가 올바르지 않습니다. 선생님께 확인하세요.</div>
    </div>

    <div class="field-group">
      <label class="field-label">학년</label>
      <div class="grade-grid">
        <button class="grade-btn" onclick="selGrade('중1',this)">중1</button>
        <button class="grade-btn" onclick="selGrade('중2',this)">중2</button>
        <button class="grade-btn" onclick="selGrade('중3',this)">중3</button>
        <button class="grade-btn" onclick="selGrade('고1',this)">고1</button>
        <button class="grade-btn" onclick="selGrade('고2',this)">고2</button>
        <button class="grade-btn" onclick="selGrade('고3',this)">고3</button>
      </div>
    </div>

    <button class="enter-btn" onclick="doEnter()" id="enter-btn">입장하기 →</button>
  </div>
  <p style="text-align:center;font-size:11px;color:#aeaeb2;margin:-0.6rem 1rem 2rem;line-height:1.6;">
    학생 ID는 선생님께 받은 고유 번호입니다 (예: m01001, h01001)
  </p>
</div>

<!-- ② 테스트 선택 화면 -->
<div class="screen" id="screen-select">
  <div class="card">
    <button class="back-btn" onclick="goBack('entry')">← 뒤로</button>
    <div class="entry-title">📋 테스트 선택</div>
    <div id="student-badge-wrap"></div>
    <div id="test-list-wrap"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>
</div>

<!-- ③ OMR 화면 -->
<div class="screen" id="screen-omr">
  <div class="omr-wrap">
    <div class="omr-header-card">
      <div style="min-width:0">
        <div class="omr-title" id="omr-test-title">—</div>
        <div class="omr-meta" id="omr-test-meta">—</div>
      </div>
      <div class="omr-student-badge" id="omr-student-badge">—</div>
    </div>

    <div class="progress-dock">
      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span class="progress-left">
            <span>답안 작성 현황</span>
            <span id="progress-txt">0 / 0</span>
          </span>
          <button class="jump-btn" id="jump-btn" onclick="jumpToMissing()">안 푼 문제로 ↓</button>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="omr-warn" id="omr-warn"></div>
        <div class="part-chips" id="part-chips"></div>
      </div>
    </div>

    <div id="omr-sections"></div>

    <div class="submit-dock">
      <button class="submit-btn" id="submit-btn" onclick="submitOMR()">✓ 답안 제출하기</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-result">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, setDoc, doc, getDoc,
  query, where, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {
  apiKey:"AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain:"beta-science.firebaseapp.com",
  projectId:"beta-science",
  storageBucket:"beta-science.firebasestorage.app",
  messagingSenderId:"650652155367",
  appId:"1:650652155367:web:41d2958e675cb4edd4d142"
};
const app = initializeApp(cfg);
const db  = getFirestore(app);
const auth = getAuth(app);

// ──────────────────────────────────────────────
// ★ 학생 인증 보장 (선생님 로그인은 건드리지 않음)
// ──────────────────────────────────────────────
let _authReady = null;
function waitForAuthReady() {
  if (_authReady) return _authReady;
  _authReady = new Promise((resolve) => {
    const unsub = onAuthStateChanged(auth, () => { unsub(); resolve(); });
  });
  return _authReady;
}
async function ensureAuth() {
  try {
    await waitForAuthReady();
    if (!auth.currentUser) {
      await signInAnonymously(auth);
    }
  } catch (e) {
    console.warn('[OMR] ensureAuth skipped:', e);
  }
}

// ──────────────────────────────────────────────
// 학년 정규화 테이블
// ──────────────────────────────────────────────
const GRADE_VARIANTS = {
  '중1': ['중1','중1학년','중학1학년','중학교1학년','중학교 1학년','중 1학년','중등1학년'],
  '중2': ['중2','중2학년','중학2학년','중학교2학년','중학교 2학년','중 2학년','중등2학년'],
  '중3': ['중3','중3학년','중학3학년','중학교3학년','중학교 3학년','중 3학년','중등3학년'],
  '고1': ['고1','고1학년','고등1학년','고등학교1학년','고등학교 1학년','고 1학년'],
  '고2': ['고2','고2학년','고등2학년','고등학교2학년','고등학교 2학년','고 2학년'],
  '고3': ['고3','고3학년','고등3학년','고등학교3학년','고등학교 3학년','고 3학년'],
};

function normalizeGrade(raw) {
  const s = String(raw || '').replace(/\s/g, '');
  for (const [uiGrade, variants] of Object.entries(GRADE_VARIANTS)) {
    if (variants.some(v => v.replace(/\s/g,'') === s)) return uiGrade;
  }
  return String(raw || '');
}

// ── 상태 ──
let studentName  = '';
let studentId    = '';
let studentGrade = '';
let selectedTest = null;
let answers      = {};
let allTests     = [];
let submitting   = false;

// ──────────────────────────────────────────────
// ★ 문항 수 계산 — 30문항 상한 없음 (50문항 이상도 그대로 지원)
//    부(part) 개수와 무관하게 실제 저장된 문항 수를 그대로 센다
// ──────────────────────────────────────────────
function countQuestions(test) {
  const parts = (test && Array.isArray(test.parts)) ? test.parts : [];
  let n = 0;
  parts.forEach(p => { n += Object.keys((p && p.answers) || {}).length; });
  return n;
}

// 문항 번호 순 정렬용 (q1, q2, … q50)
function qNumOf(qno) { return Number(String(qno).replace('q','')) || 0; }
function sortedQNos(part) {
  return Object.keys((part && part.answers) || {}).sort((a,b) => qNumOf(a) - qNumOf(b));
}

// ★ 답이 실제로 채워져 있는가 (공백만 있는 값은 '안 푼 것'으로 센다)
function hasAns(qno) {
  const v = answers ? answers[qno] : undefined;
  return v !== undefined && v !== null && String(v).trim() !== '';
}

// 등록일 문자열("2026. 07. 31.") 안전 파싱 → 정렬용 숫자
function parseRegDate(s) {
  const m = String(s || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (!m) return 0;
  const t = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
  return isNaN(t) ? 0 : t;
}

// ── 화면 전환 ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + id);
  if (target) target.classList.add('active');
  window.scrollTo(0, 0);
}
window.goBack = (to) => showScreen(to);

function setVeil(on) {
  const v = document.getElementById('saving-veil');
  if (v) v.classList.toggle('show', !!on);
}

// ── 학년 선택 ──
window.selGrade = (g, el) => {
  studentGrade = g;
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('sel'));
  if (el) el.classList.add('sel');
};

// ── 학생 ID 조회 ──
async function getStudentById(id) {
  const q = query(collection(db, 'students'), where('id', '==', String(id).toLowerCase()));
  const snap = await getDocs(q);
  if (snap.empty) return null;
  return { fireId: snap.docs[0].id, ...snap.docs[0].data() };
}

// ── 입장 ──
window.doEnter = async () => {
  const inputId = document.getElementById('entry-student-id').value.trim().toLowerCase();
  const idErr   = document.getElementById('id-error');
  const btn     = document.getElementById('enter-btn');

  idErr.style.display = 'none';
  if (!inputId)      return alert('학생 ID를 입력해주세요');
  if (!studentGrade) return alert('학년을 선택해주세요');

  btn.disabled = true;
  btn.textContent = '확인 중...';

  try {
    await ensureAuth();
    const student = await getStudentById(inputId);
    if (!student) {
      idErr.style.display = 'block';
      return;
    }
    studentId   = student.id;
    studentName = student.name;

    document.getElementById('student-badge-wrap').innerHTML =
      `<div class="student-badge">${esc(studentName)} · ${esc(studentGrade)}</div>`;

    showScreen('select');
    await loadTests();
  } catch(e) {
    alert('오류가 발생했습니다: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '입장하기 →';
  }
};

// ──────────────────────────────────────────────
// 테스트 목록 불러오기
// ──────────────────────────────────────────────
async function loadTests() {
  const wrap = document.getElementById('test-list-wrap');
  wrap.innerHTML = '<div class="loading"><div class="spinner"></div>불러오는 중...</div>';

  try {
    const variants = GRADE_VARIANTS[studentGrade] || [studentGrade];
    const seen = new Set();
    let docs = [];

    const snaps = await Promise.all(
      variants.map(v =>
        getDocs(query(collection(db, 'master-tests'), where('grade', '==', v))).catch(() => null)
      )
    );
    snaps.forEach(snap => {
      if (!snap) return;
      snap.forEach(d => {
        if (!seen.has(d.id)) { seen.add(d.id); docs.push({ fireId: d.id, ...d.data() }); }
      });
    });

    if (docs.length === 0) {
      const allSnap = await getDocs(collection(db, 'master-tests'));
      allSnap.forEach(d => {
        const data = d.data();
        if (normalizeGrade(data.grade) === studentGrade && !seen.has(d.id)) {
          seen.add(d.id);
          docs.push({ fireId: d.id, ...data });
        }
      });
    }

    docs.sort((a, b) => parseRegDate(b.regDate) - parseRegDate(a.regDate));

    allTests = docs;
  } catch(e) {
    wrap.innerHTML = `<div class="empty-hint">불러오기 실패: ${esc(e.message)}</div>`;
    return;
  }

  if (!allTests.length) {
    wrap.innerHTML = `<div class="empty-hint">
      <div style="font-size:2rem;margin-bottom:8px;">📭</div>
      ${esc(studentGrade)}에 등록된 테스트가 없습니다<br>
      <span style="font-size:11px;">선생님께 문의하세요</span>
    </div>`;
    return;
  }

  let html = '<div class="test-list">';
  allTests.forEach(t => {
    const totalQ = countQuestions(t);   // ★ 상한 없음
    const sub = t.subUnit ? ` · ${esc(t.subUnit)}` : '';
    html += `<div class="test-item" onclick="selectTest('${esc(t.fireId)}')">
      <div class="test-info">
        <div class="test-name">${esc(t.unitName || '—')}</div>
        <div class="test-meta">${esc(t.subject || '—')}${sub} · ${totalQ}문제</div>
      </div>
      <span class="test-arrow">›</span>
    </div>`;
  });
  html += '</div>';
  wrap.innerHTML = html;
}

// ── 테스트 선택 ──
window.selectTest = (fireId) => {
  selectedTest = allTests.find(t => t.fireId === fireId);
  if (!selectedTest) return;
  answers = {};
  buildOMR();
  showScreen('omr');
};

// ──────────────────────────────────────────────
// OMR 구성 — 5지선다 / 문항 수 제한 없음
// ──────────────────────────────────────────────
function buildOMR() {
  document.getElementById('omr-test-title').textContent = selectedTest.unitName || '—';
  const metaBits = [selectedTest.subject || '', normalizeGrade(selectedTest.grade || ''), countQuestions(selectedTest) + '문제'];
  document.getElementById('omr-test-meta').textContent = metaBits.filter(Boolean).join(' · ');
  document.getElementById('omr-student-badge').textContent = `${studentName} (${studentGrade})`;

  const parts = Array.isArray(selectedTest.parts) ? selectedTest.parts : [];
  const symbols = ['①','②','③','④','⑤'];
  let html = '';
  let chipHtml = '';
  let shownIdx = 0;

  parts.forEach((part, pi) => {
    const qNos = sortedQNos(part);
    if (!qNos.length) return;
    shownIdx++;

    const secId = 'omr-part-' + pi;
    const rangeText = part.range || (qNumOf(qNos[0]) + '-' + qNumOf(qNos[qNos.length - 1]));
    chipHtml += `<button class="part-chip" id="chip-${pi}" onclick="jumpToPart(${pi})">${shownIdx}부 · ${esc(rangeText)}</button>`;

    html += `<div class="omr-section" id="${secId}" data-part="${pi}">
      <div class="omr-section-title">
        <span class="part-tag">${shownIdx}부 · ${esc(rangeText)}번</span>
        ${part.sectionName ? `<span>${esc(part.sectionName)}</span>` : ''}
      </div>
      <div class="omr-grid">`;

    qNos.forEach(qno => {
      const num = qNumOf(qno);
      html += `<div class="omr-q" id="row-${qno}" data-part="${pi}">
        <div class="omr-q-num">${num}번</div>
        <div class="omr-choices">
          ${symbols.map((sym, idx) => {
            const n = idx + 1;
            return `<div class="omr-choice" id="choice-${qno}-${n}" onclick="pickAnswer('${qno}',${n})">${sym}</div>`;
          }).join('')}
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  document.getElementById('omr-sections').innerHTML = html;
  document.getElementById('part-chips').innerHTML = chipHtml;

  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  submitting = false;
  setVeil(false);

  updateProgress();
}

// ── 답 선택 ──
window.pickAnswer = (qno, n) => {
  if (submitting) return;
  for (let i = 1; i <= 5; i++) {
    const c = document.getElementById(`choice-${qno}-${i}`);
    if (c) c.classList.remove('sel');
  }
  const picked = document.getElementById(`choice-${qno}-${n}`);
  if (picked) picked.classList.add('sel');
  answers[qno] = String(n);

  const row = document.getElementById('row-' + qno);
  if (row) { row.classList.add('answered'); row.classList.remove('missing'); }

  updateProgress();
};

// ── 진행률 + 부별 완료 표시 + 미응답 안내 ──
function updateProgress() {
  const total   = countQuestions(selectedTest);
  const missing = missingQNos().length;
  const done    = Math.max(0, total - missing);
  const pct     = total ? Math.round(done / total * 100) : 0;

  document.getElementById('progress-txt').textContent  = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const jump = document.getElementById('jump-btn');
  if (missing > 0) {
    jump.textContent = `안 푼 ${missing}문제 ↓`;
    jump.classList.add('show');
  } else {
    jump.classList.remove('show');
  }

  // ★ 미응답 안내줄 — 안 푼 문제가 있으면 항상 보인다
  const warn = document.getElementById('omr-warn');
  if (warn) {
    if (missing > 0) {
      warn.className = 'omr-warn show';
      warn.textContent = `아직 ${missing}문제가 비어 있어요. 모든 문제를 풀어야 제출됩니다.`;
    } else if (total > 0) {
      warn.className = 'omr-warn show ok';
      warn.textContent = '✓ 모든 문제를 풀었어요. 제출할 수 있습니다.';
    } else {
      warn.className = 'omr-warn';
      warn.textContent = '';
    }
  }

  // ★ 제출 버튼에도 남은 개수를 보여준다
  const btn = document.getElementById('submit-btn');
  if (btn && !submitting) {
    if (missing > 0) {
      btn.classList.add('wait');
      btn.textContent = `안 푼 ${missing}문제가 남았어요`;
    } else {
      btn.classList.remove('wait');
      btn.textContent = '✓ 답안 제출하기';
    }
  }

  const parts = Array.isArray(selectedTest && selectedTest.parts) ? selectedTest.parts : [];
  parts.forEach((part, pi) => {
    const chip = document.getElementById('chip-' + pi);
    if (!chip) return;
    const qNos = sortedQNos(part);
    const allDone = qNos.length > 0 && qNos.every(q => hasAns(q));
    chip.classList.toggle('done', allDone);
  });
}

// ── 안 푼 문제 목록 / 이동 ──
function missingQNos() {
  const parts = Array.isArray(selectedTest && selectedTest.parts) ? selectedTest.parts : [];
  const list = [];
  parts.forEach(part => { sortedQNos(part).forEach(q => { if (!hasAns(q)) list.push(q); }); });
  return list;
}
function markMissing() {
  const miss = missingQNos();
  miss.forEach(q => {
    const row = document.getElementById('row-' + q);
    if (row) row.classList.add('missing');
  });
  return miss;
}
window.jumpToMissing = () => {
  const miss = markMissing();
  if (!miss.length) return;
  const row = document.getElementById('row-' + miss[0]);
  if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
};
window.jumpToPart = (pi) => {
  const sec = document.getElementById('omr-part-' + pi);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

// ──────────────────────────────────────────────
// ★ 제출
//   [바뀐 점 1] 안 푼 문제가 하나라도 있으면 저장하지 않는다.
//     예전에는 "그래도 제출할까요?"에서 확인을 누르면 빈 문항이
//     오답으로 굳어져 점수가 깎인 채 저장됐다.
//   [바뀐 점 2] 문서 ID를 `${시험ID}__${학생ID}`로 고정한다.
//     예전에는 addDoc(랜덤 ID)이라 두 번 제출하면 문서가 두 개 생겨
//     응시 횟수가 2회로 잡혔다. 이제는 다시 봐도 1건으로 덮어쓴다.
// ──────────────────────────────────────────────
function masterDocId(examFireId, sid) {
  return `${examFireId}__${String(sid || '').trim().toLowerCase()}`;
}

window.submitOMR = async () => {
  if (submitting) return;

  const parts = Array.isArray(selectedTest && selectedTest.parts) ? selectedTest.parts : [];
  const total = countQuestions(selectedTest);   // ★ 상한 없음 (50문항이면 50)

  if (total === 0) { alert('문항이 없는 시험입니다. 선생님께 문의하세요.'); return; }

  // ★ 빈 문항이 있으면 저장하지 않고 그 문제로 보낸다
  const miss = markMissing();
  if (miss.length > 0) {
    const nums = miss.slice(0, 10).map(qNumOf).join(', ');
    const more = miss.length > 10 ? ` 외 ${miss.length - 10}문제` : '';
    alert(`아직 ${miss.length}문제를 풀지 않았어요.\n\n${nums}번${more}\n\n모두 푼 뒤에 제출할 수 있습니다.`);
    const row = document.getElementById('row-' + miss[0]);
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const done = total - missingQNos().length;
  if (done !== total) { alert('답안을 다시 확인해주세요.'); return; }

  submitting = true;
  setVeil(true);
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.classList.remove('wait');
  btn.textContent = '제출 중...';

  // 채점: 정답 맵 생성
  const correctMap = {};
  parts.forEach(part => {
    Object.entries((part && part.answers) || {}).forEach(([qno, ans]) => {
      correctMap[qno] = String(ans);
    });
  });

  let correct = 0, wrong = 0;
  const wrongNums = [];
  const answersDetail = [];
  Object.entries(correctMap).forEach(([qno, correctAns]) => {
    const sa = answers[qno];
    const isCorrect = String(sa == null ? '' : sa).trim() === String(correctAns).trim();
    if (isCorrect) correct++; else { wrong++; wrongNums.push(qNumOf(qno)); }
    answersDetail.push({
      question:      `Q${qNumOf(qno)}`,
      studentAnswer: sa || null,
      correctAnswer: correctAns,
      isCorrect,
      type:          'master'
    });
  });
  answersDetail.sort((a, b) => Number(a.question.replace('Q','')) - Number(b.question.replace('Q','')));
  wrongNums.sort((a, b) => a - b);

  const score = total > 0 ? Math.round((correct / total) * 100) : 0;

  // 과제 결정 (첫 부의 과제 기준 — 기존 동작 유지)
  const fp = parts[0];
  let taskText = '';
  if (fp) taskText = wrong <= 2 ? (fp.taskLow || '') : wrong <= 4 ? (fp.taskMid || '') : (fp.taskHigh || '');

  // ── Firebase 저장 (1인 1시험 = 문서 1개) ──
  let attemptNo = 1;
  try {
    await ensureAuth();

    const sid = String(studentId || '').trim().toLowerCase();
    const gid = sid ? masterDocId(selectedTest.fireId, sid) : '';

    // 다시 본 경우: 첫 응시 시각과 응시 횟수를 이어받는다 (실패해도 저장은 진행)
    let firstAt = null;
    if (gid) {
      try {
        const prev = await getDoc(doc(db, 'grades', gid));
        if (prev.exists()) {
          const p = prev.data() || {};
          firstAt = p.firstSubmittedAt || p.timestamp || null;
          const n = Number(p.attemptCount);
          attemptNo = (isFinite(n) && n > 0 ? n : 1) + 1;
        }
      } catch (e) {
        console.warn('[OMR] 이전 기록 조회 실패(무시하고 저장):', e);
      }
    }

    const now = Timestamp.now();
    const payload = {
      // ── 식별 ──
      studentId: sid,
      studentName,
      grade: studentGrade,
      subject: selectedTest.subject || '',
      examId: selectedTest.fireId,                       // master-tests 문서 id (대시보드 삭제 연동 키)
      testName: selectedTest.unitName || '마스터테스트 OMR',
      category: 'master',                                // 마스터 OMR
      // ── 파트별 점수 (마스터는 객관식 → multiple에, ox는 null) ──
      ox: null,
      multiple: { correct, total, score },
      // ── 대표 점수/집계 ──
      score,
      totalCorrect: correct,
      totalQuestions: total,
      answeredCount: total,
      // ── 문항별 상세 ──
      answers: answersDetail,
      wrongNums,
      // ── 시간 · 응시 횟수 ──
      timestamp: now,
      firstSubmittedAt: firstAt || now,
      attemptCount: attemptNo,
      // ── 구버전 읽기 호환용 보조 필드 ──
      testType: 'master',
      testId: selectedTest.testId || '',
      testFireId: selectedTest.fireId,
      unitName: selectedTest.unitName || '',
      examTitle: selectedTest.unitName || '마스터테스트 OMR',
      testGrade: selectedTest.grade || '',
      testGradeNorm: normalizeGrade(selectedTest.grade || ''),
      studentGrade,
      correct, wrong, total
    };

    if (gid) {
      await setDoc(doc(db, 'grades', gid), payload);
    } else {
      // 학생 ID가 없는 예외적인 경우에만 새 문서 생성
      await addDoc(collection(db, 'grades'), payload);
    }
  } catch(e) {
    alert('제출 실패: ' + e.message + '\n\n네트워크를 확인하고 다시 제출해주세요.');
    submitting = false;
    setVeil(false);
    btn.disabled = false;
    updateProgress();
    return;
  }

  submitting = false;
  setVeil(false);

  // 결과 화면
  const emoji = score>=90?'🎉':score>=70?'😊':score>=50?'😅':'💪';
  const msg   = score>=90?'훌륭해요!':score>=70?'잘했어요!':score>=50?'더 열심히 해봐요!':'다음엔 더 잘할 수 있어요!';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = '제출 완료!';
  document.getElementById('result-sub').textContent   = `${studentName}학생, ${msg}`;
  document.getElementById('result-score').textContent = score + '점';
  document.getElementById('result-detail').textContent = `총 ${total}문제 중 ${correct}문제 정답 · ${wrong}문제 오답`;

  const againBox = document.getElementById('result-again');
  if (againBox) {
    if (attemptNo > 1) {
      againBox.style.display = 'block';
      againBox.textContent = `이 시험은 ${attemptNo}번째 응시입니다. 가장 최근 결과 하나만 기록됩니다.`;
    } else {
      againBox.style.display = 'none';
    }
  }

  if (taskText) {
    document.getElementById('result-task-box').style.display = 'block';
    document.getElementById('result-task-text').textContent  = taskText;
  }
  showScreen('result');
};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ──────────────────────────────────────────────
// ★ 클리닉 링크 자동 진입: ?testId=문서ID&sid=학생ID
//   - 입장 화면을 건너뛰고 해당 마스터테스트를 바로 OMR로 띄움
//   - sid로 학생을 자동 조회(이름·학년 채움) → 점수가 그 학생에게 기록됨
//   - testId가 없거나 학생/시험 조회 실패 시 → 기존 입장 화면 그대로
// ──────────────────────────────────────────────
async function getMasterTestById(testId) {
  try {
    const snap = await getDoc(doc(db, 'master-tests', testId));
    if (snap.exists()) return { fireId: snap.id, ...snap.data() };
  } catch (e) {
    console.warn('[OMR] master-test load fail:', e);
  }
  return null;
}

async function initFromURL() {
  const params = new URLSearchParams(location.search);
  const testId = (params.get('testId') || '').trim();
  const sid    = (params.get('sid') || '').trim().toLowerCase();

  // 클리닉에서 들어왔으면 결과 화면의 "홈으로 돌아가기"를 클리닉 첫 페이지로 연결
  // (사이트 내부 경로만 허용 — 오픈 리다이렉트 방지)
  const fromRaw = params.get('from') || '';
  if (fromRaw && fromRaw.startsWith('/') && !fromRaw.startsWith('//')) {
    const homeBtn = document.getElementById('omr-home-btn');
    if (homeBtn) { homeBtn.setAttribute('href', fromRaw); homeBtn.textContent = '← 클리닉으로 돌아가기'; }
  }

  if (!testId) return; // 일반 입장 화면 유지

  // 자동 진입 로딩 화면
  showScreen('autoload');

  try {
    await ensureAuth();

    // 학생 자동 조회 (sid 필수: 점수를 학생에게 연결하려면 필요)
    let student = null;
    if (sid) student = await getStudentById(sid);
    if (!student) {
      showScreen('entry');
      return;
    }
    studentId    = student.id;
    studentName  = student.name;
    studentGrade = normalizeGrade(student.grade);

    // 시험 문서 직접 로드 (학년 목록을 거치지 않고 콕 집어 열기)
    const test = await getMasterTestById(testId);
    if (!test) {
      alert('시험을 찾을 수 없습니다. 선생님께 문의하세요.');
      showScreen('entry');
      return;
    }

    selectedTest = test;
    answers = {};
    buildOMR();
    showScreen('omr');
  } catch (e) {
    console.warn('[OMR] initFromURL error:', e);
    showScreen('entry'); // 실패 시 일반 입장 화면
  }
}
initFromURL();
</script>
