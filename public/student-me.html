<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="/favicon.js"></script>

<title>내 성적 · 인후쌤의 과학 수업 관리 시스템</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
  background: #fafafa; color: #1d1d1f; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Header ── */
.header {
  background: #ffffff; border-bottom: 1px solid #f0e8ed;
  padding: 0 1.5rem;
  padding-left: calc(1.5rem + env(safe-area-inset-left));
  padding-right: calc(1.5rem + env(safe-area-inset-right));
  height: 54px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  position: sticky; top: 0; z-index: 300;
}
.header-left { display: flex; align-items: center; gap: 9px; color: inherit; min-width: 0; }
.logo-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.brand-name { font-size: clamp(11px,3vw,14px); font-weight: 600; color: #1d1d1f; letter-spacing: -0.3px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-badge {
  display: flex; align-items: center; gap: 5px;
  background: #fdf2f8; border: 1px solid #fce7f3;
  border-radius: 20px; padding: 4px 11px;
  font-size: 11px; font-weight: 700; color: #db2777; white-space: nowrap; flex-shrink: 0;
}

/* ── Layout ── */
.detail-wrap {
  max-width: 1100px; margin: 0 auto; padding: 1.4rem 1rem 4rem;
  padding-left: max(1rem, env(safe-area-inset-left));
  padding-right: max(1rem, env(safe-area-inset-right));
}
.sect-title { font-size:1rem; font-weight:800; color:#1d1d1f; letter-spacing:-0.02em; margin:1.6rem 0 0.9rem; display:flex; align-items:center; gap:8px; }
.sect-title .sect-ico { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; }
.sect-grade { background:#fdf2f8; } .sect-report { background:#eff6ff; }
.big-divider { height:8px; background:linear-gradient(90deg,#fdf2f8,#eff6ff); border-radius:8px; margin:1.8rem 0; }
#loadingBox { padding:4rem 1rem; text-align:center; color:#aeaeb2; font-size:14px; }
#errorBox { display:none; padding:3rem 1rem; text-align:center; color:#dc2626; font-size:14px; line-height:1.9; }

/* ── 프로필 ── */
.profile-card {
  background: #fff; border: 1px solid #fce7f3; border-radius: 16px;
  padding: 1rem 1.2rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
}
.p-av { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.p-name { font-size: 1rem; font-weight: 700; color: #1d1d1f; }
.p-meta { font-size: 11px; color: #aeaeb2; margin-top: 3px; }
.p-right { margin-left: auto; text-align: right; }
.p-overall-n { font-size: 1.4rem; font-weight: 700; line-height: 1; }
.p-overall-l { font-size: 10px; color: #aeaeb2; margin-top: 3px; }
.c-good{color:#0369a1} .c-avg{color:#d97706} .c-warn{color:#dc2626}
.subject-chip2 { display:inline-block; font-size:11px; color:#7c3aed; background:#ede9fe; padding:3px 9px; border-radius:6px; margin:2px 3px 2px 0; }

/* ── 요약 4칸 ── */
.mini-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 1rem; }
.mini-card { background: #fff; border: 1px solid #fce7f3; border-radius: 12px; padding: 0.8rem 0.6rem; text-align: center; }
.mini-n { font-size: 1.1rem; font-weight: 700; }
.mini-l { font-size: 10px; color: #aeaeb2; margin-top: 3px; font-weight: 500; line-height: 1.3; }

/* ── 카드 공통 ── */
.chart-card { background: #fff; border: 1px solid #fce7f3; border-radius: 16px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.chart-title, .card-title { font-size: 13px; font-weight: 600; color: #1d1d1f; margin-bottom: 1rem; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #6e6e73; }
.leg-dot { width: 8px; height: 8px; border-radius: 50%; }
.empty-box { padding: 3rem 1rem; text-align: center; font-size: 13px; color: #aeaeb2; background: #fff; border: 1px solid #fce7f3; border-radius: 16px; line-height: 1.9; }
.print-btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; background: #fdf2f8; border: 1px solid #fce7f3; border-radius: 10px; font-size: 12px; font-weight: 600; color: #db2777; cursor: pointer; font-family: inherit; min-height: 36px; }

/* ── 응시 기록 테이블 ── */
.gc-table { background:#fff; border:1px solid #fce7f3; border-radius:16px; overflow:hidden; }
.gc-head, .gc-row {
  display:grid;
  grid-template-columns: 150px minmax(0,1fr) 78px 92px 78px;
  align-items:center;
}
.gc-head {
  padding:0.7rem 1rem; background:#fdf2f8; border-bottom:1px solid #fce7f3;
  font-size:10px; font-weight:700; color:#c9a8bc; letter-spacing:0.06em; text-transform:uppercase;
}
.gc-head > div { display:flex; align-items:center; justify-content:center; }
.gc-row { padding:0.8rem 1rem; border-bottom:1px solid #fdf2f8; transition:background 0.15s; }
.gc-row:last-child { border-bottom:none; }
.gc-row:hover { background:#fffbfe; }
.gc-row > div { display:flex; align-items:center; justify-content:center; min-width:0; }
.gc-date { font-size:11px; color:#6e6e73; white-space:nowrap; }
.gc-exam { font-size:13px; font-weight:600; color:#1d1d1f; word-break:break-word; line-height:1.4; gap:7px; flex-wrap:wrap; }
.gc-q { font-size:10.5px; font-weight:700; color:#6e6e73; background:#f5f5f7; padding:2px 7px; border-radius:6px; white-space:nowrap; }
.gc-sc { gap:5px; }
.sc-lbl { display:none; }
.sc-pill { display:inline-flex; align-items:center; justify-content:center; min-width:46px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
.sc-ox { background:#dbeafe; color:#1e40af; }
.sc-mc { background:#ede9fe; color:#5b21b6; }
.sc-ms { background:#fdf2f8; color:#db2777; }
.sc-na { font-size:13px; color:#d8d8dd; font-weight:600; }

/* ── 분석 리포트 ── */
.analysis-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; align-items: stretch; }
.analysis-row .chart-card { margin-bottom: 0; }
.analysis-row .radar-wrap { align-items: center; height: 100%; }
.radar-wrap { display: flex; justify-content: center; }
.analysis-items { display: flex; flex-direction: column; gap: 7px; }
.analysis-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: #fafafa; border: 1px solid #f5f5f7; }
.ai-label { font-size: 12px; font-weight: 500; color: #3c3c43; }
.ai-val { font-size: 12px; font-weight: 700; }
.total-comment { margin-top: 10px; padding: 10px 12px; background: #fdf2f8; border-radius: 10px; font-size: 12px; color: #3c3c43; line-height: 1.7; }
.trend-card { background: #fff; border: 1px solid #fce7f3; border-radius: 16px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.trend-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 6px; }
.trend-title { font-size: 13px; font-weight: 600; }
.trend-badge { font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
.tb-up{background:#dcfce7;color:#166534} .tb-dn{background:#fee2e2;color:#991b1b} .tb-fl{background:#f5f5f7;color:#6e6e73}
.trend-canvas-wrap { position: relative; height: 200px; }
.trend-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-size:13px; color:#aeaeb2; line-height:1.8; }

@media print {
  .header, .print-btn { display: none !important; }
  .detail-wrap { padding-top: 0.5rem; }
}

/* ══════════════ 태블릿 ══════════════ */
@media (max-width: 900px) {
  .mini-grid { grid-template-columns: repeat(2,1fr); }
  .analysis-row { grid-template-columns: 1fr; }
}

/* ══════════════ 모바일 ══════════════ */
@media (max-width: 600px) {
  .header { padding: 0 1rem; padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); }
  .header-badge { display: none; }
  .detail-wrap { padding: 0.9rem 0.85rem 4rem; padding-left: max(0.85rem, env(safe-area-inset-left)); padding-right: max(0.85rem, env(safe-area-inset-right)); }
  .sect-title { font-size: 0.95rem; margin: 1.3rem 0 0.8rem; }
  .sect-title .sect-ico { width: 26px; height: 26px; font-size: 13px; }
  .big-divider { margin: 1.4rem 0; height: 6px; }
  .profile-card { padding: 0.9rem 1rem; border-radius: 14px; }
  .p-av { width: 42px; height: 42px; font-size: 12px; }
  .p-name { font-size: 0.95rem; }
  .p-right { margin-left: 0; text-align: left; width: 100%; }
  .p-overall-n { font-size: 1.2rem; }
  .mini-grid { grid-template-columns: repeat(2,1fr); gap: 7px; }
  .mini-card { border-radius: 10px; padding: 0.8rem 0.6rem; }
  .mini-n { font-size: 1rem; }
  .mini-l { font-size: 9.5px; }
  .chart-card { padding: 1rem; border-radius: 14px; }

  /* 응시 기록 → 카드형 리플로우 */
  .gc-head { display:none; }
  .gc-row {
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-areas:
      "exam exam exam"
      "date date date"
      "ox mc ms";
    gap: 9px 6px;
    padding: 0.95rem;
  }
  .gc-row > div { justify-content:flex-start; }
  .gc-exam { grid-area:exam; font-size:13.5px; }
  .gc-date { grid-area:date; }
  .sc-col-ox { grid-area:ox; }
  .sc-col-mc { grid-area:mc; }
  .sc-col-ms { grid-area:ms; }
  .gc-sc { flex-direction:column; align-items:flex-start !important; gap:4px; }
  .sc-lbl { display:block; font-size:9px; font-weight:700; color:#aeaeb2; letter-spacing:0.04em; }
  .sc-pill { min-width:42px; padding:4px 9px; }

  .analysis-row { grid-template-columns: 1fr; }
  .trend-canvas-wrap { height: 180px; }
  .trend-empty { font-size: 12px; }
}

@media (max-width: 380px) {
  .sc-pill { min-width:38px; padding:4px 7px; font-size:10.5px; }
  .mini-n { font-size: 0.92rem; }
}
</style>

<body>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
  apiKey:"AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain:"beta-science.firebaseapp.com",
  projectId:"beta-science",
  storageBucket:"beta-science.firebasestorage.app",
  messagingSenderId:"650652155367",
  appId:"1:650652155367:web:41d2958e675cb4edd4d142"
};

const GRADE_BG={'중등1학년':'#eff6ff','중등2학년':'#f0fdf4','중등3학년':'#fefce8','고등1학년':'#fdf4ff','고등2학년':'#fff7ed','고등3학년':'#fdf2f8'};
const GRADE_COL={'중등1학년':'#1d4ed8','중등2학년':'#15803d','중등3학년':'#a16207','고등1학년':'#7e22ce','고등2학년':'#c2410c','고등3학년':'#db2777'};
const GRADE_SHORT={'중등1학년':'중1','중등2학년':'중2','중등3학년':'중3','고등1학년':'고1','고등2학년':'고2','고등3학년':'고3'};
const DAY_KO=['일','월','화','수','목','금','토'];

let stu={}, recsAll=[];
let radarInst=null, trendInst=null;

/* ════════ 유틸 ════════ */
function num(x){ return (x===null||x===undefined||x===''||isNaN(Number(x)))?null:Number(x); }
function esc2(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setTxt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt;}
function toDate(ts){ const n=num(ts); return n===null?new Date(0):new Date(n); }
function fmtDateShort(ts){
  const d=toDate(ts); if(d.getTime()===0) return '';
  const yy=String(d.getFullYear()).slice(2), mm=String(d.getMonth()+1).padStart(2,'0'),
        dd=String(d.getDate()).padStart(2,'0'), day=DAY_KO[d.getDay()];
  return `${yy}.${mm}.${dd}(${day})`;
}
function showError(msg){
  document.getElementById('loadingBox').style.display='none';
  const box=document.getElementById('errorBox');
  if(msg) box.innerHTML=esc2(msg)+'<br>선생님께 링크를 다시 요청해 주세요.';
  box.style.display='block';
}

/* ════════════════════════════════════════════════
   기록 정규화 — portals 문서의 results 배열을 그대로 읽습니다.
   (필드명은 portal-admin.html 이 저장하는 이름 그대로)
════════════════════════════════════════════════ */
function normalizeRow(r){
  return {
    examId: r.examId||'',
    testName: r.testName||r.examTitle||'시험',
    master: r.master===true,
    subTypes: Array.isArray(r.subTypes)?r.subTypes.map(x=>String(x).toLowerCase()):[],
    score: num(r.score),
    ts: num(r.ts),
    date: r.date||'',
    oxScore:num(r.oxScore), oxCount:num(r.oxCount), oxCorrect:num(r.oxCorrect), oxDone:r.oxDone===true,
    multiScore:num(r.multiScore), multiCount:num(r.multiCount), multiCorrect:num(r.multiCorrect), multiDone:r.multiDone===true,
    correctCount:num(r.correctCount), totalQuestions:num(r.totalQuestions),
    totalCorrect:num(r.totalCorrect), total:num(r.total), correct:num(r.correct)
  };
}

/* 이 기록이 가진 파트별 점수 {ox, mc, master} (없으면 null) */
function partScores(r){
  if(r.master) return { ox:null, mc:null, master: r.score };

  const oxc=r.oxCount, mcc=r.multiCount, tq=r.totalQuestions;
  let oxDone=null, mcDone=null;

  // 1순위: 문항 수 합이 딱 맞으면 어느 쪽을 풀었는지 확실합니다
  if(tq!==null && oxc!==null && mcc!==null){
    if(tq===oxc+mcc){ oxDone=true; mcDone=true; }
    else if(tq===oxc){ oxDone=true; mcDone=false; }
    else if(tq===mcc){ oxDone=false; mcDone=true; }
  }
  // 2순위: 완료 표시 · 정답 개수 · subTypes 가 있으면 푼 것입니다
  if(oxDone===null) oxDone = r.oxDone || r.oxCorrect!==null || r.subTypes.includes('ox') || (r.oxScore!==null && r.oxScore>0);
  if(mcDone===null) mcDone = r.multiDone || r.multiCorrect!==null || r.subTypes.includes('multiple') || r.subTypes.includes('multi') || (r.multiScore!==null && r.multiScore>0);

  let ox = (oxDone && r.oxScore!==null) ? r.oxScore : null;
  let mc = (mcDone && r.multiScore!==null) ? r.multiScore : null;

  // 유형을 전혀 알 수 없으면 전체 점수를 4지선다로 봅니다 (student-detail 과 동일)
  if(ox===null && mc===null && r.score!==null) mc = r.score;
  return { ox, mc, master:null };
}
function hasType(r,kind){ return partScores(r)[kind]!==null; }
function typeScore(r,kind){ const v=partScores(r)[kind]; return v===null?0:v; }
function totalQOf(r){
  if(r.master) return r.total!==null?r.total:r.totalQuestions;
  if(r.totalQuestions!==null) return r.totalQuestions;
  if(r.oxCount!==null || r.multiCount!==null) return (r.oxCount||0)+(r.multiCount||0);
  return null;
}

/* ════════ 프로필 ════════ */
function renderProfile(){
  const name=stu.name||'학생', grade=stu.grade||'—';
  const bg=GRADE_BG[grade]||'#f5f5f7', col=GRADE_COL[grade]||'#6e6e73', short=GRADE_SHORT[grade]||grade;
  const av=document.getElementById('d-av'); av.textContent=short; av.style.background=bg; av.style.color=col;
  setTxt('d-name',name);
  const cls=Array.isArray(stu.classNames)?stu.classNames.filter(Boolean).map(String):[];
  setTxt('d-meta',`${grade} · ${cls.length?cls.join(' / '):'반 미배정'}`);
  document.title=`${name} 성적 · 인후쌤의 과학 수업 관리 시스템`;
  const badge=document.getElementById('h-badge');
  badge.textContent=[name, grade!=='—'?grade:''].filter(Boolean).join(' · ');
  badge.style.display='flex';
  const subs=(stu.subject&&stu.subject!=='-')?String(stu.subject).split(',').map(x=>x.trim()).filter(Boolean):[];
  document.getElementById('d-subjects').innerHTML=subs.length?subs.map(x=>`<span class="subject-chip2">${esc2(x)}</span>`).join(''):'';
}

/* ════════ 성적 현황 — 응시 기록 ════════ */
function gcRender(){
  const avg=(kind)=>{ const v=recsAll.filter(r=>hasType(r,kind)); return v.length?Math.round(v.map(r=>typeScore(r,kind)).reduce((s,x)=>s+x,0)/v.length):null; };
  setTxt('d-cnt',recsAll.length);
  const ox=avg('ox'), mc=avg('mc'), ms=avg('master');
  setTxt('d-ox',ox!==null?ox+'점':'—'); setTxt('d-mc',mc!==null?mc+'점':'—'); setTxt('d-ms',ms!==null?ms+'점':'—');

  const list=recsAll.slice().sort((a,b)=>toDate(b.ts)-toDate(a.ts));
  const el=document.getElementById('d-records');
  if(!list.length){ el.innerHTML=`<div class="empty-box">아직 응시한 기록이 없습니다.<br>시험을 보고 나면 여기에 결과가 쌓입니다.</div>`; return; }

  const scCell=(v,type)=>{
    const map={ ox:{cls:'sc-ox',lbl:'OX',col:'sc-col-ox'}, mc:{cls:'sc-mc',lbl:'4지선다',col:'sc-col-mc'}, ms:{cls:'sc-ms',lbl:'마스터',col:'sc-col-ms'} };
    const m=map[type];
    const inner=(v===null)?`<span class="sc-na">—</span>`:`<span class="sc-pill ${m.cls}">${Math.round(v*10)/10}점</span>`;
    return `<div class="gc-sc ${m.col}"><span class="sc-lbl">${m.lbl}</span>${inner}</div>`;
  };
  const rows=list.map(r=>{
    const p=partScores(r);
    const tq=totalQOf(r);
    const qChip=tq?`<span class="gc-q">${tq}문항</span>`:'';
    const date=fmtDateShort(r.ts)||esc2(r.date)||'—';
    return `<div class="gc-row">
      <div class="gc-date">${date}</div>
      <div class="gc-exam">${esc2(r.testName)}${qChip}</div>
      ${scCell(p.ox,'ox')}
      ${scCell(p.mc,'mc')}
      ${scCell(p.master,'ms')}
    </div>`;
  }).join('');
  el.innerHTML=`<div class="gc-table">
    <div class="gc-head"><div>응시일</div><div>시험명</div><div>OX</div><div>4지선다</div><div>마스터</div></div>
    ${rows}
  </div>`;
}

/* ════════ 분석 리포트 ════════ */
function rpRender(){
  const filtered=recsAll;
  const avg=(arr,kind)=>{ const v=arr.filter(r=>hasType(r,kind)); return v.length?Math.round(v.map(r=>typeScore(r,kind)).reduce((a,x)=>a+x,0)/v.length):null; };
  const oxA=avg(filtered,'ox'), mcA=avg(filtered,'mc'), msA=avg(filtered,'master');

  const vals=[oxA,mcA,msA].filter(v=>v!==null);
  const total=vals.length?Math.round(vals.reduce((a,v)=>a+v,0)/vals.length):null;
  const oel=document.getElementById('rp-overall');
  if(total!==null){
    if(total>=80){ oel.textContent=`양호 (${total}점)`; oel.className='p-overall-n c-good'; }
    else if(total>=60){ oel.textContent=`보통 (${total}점)`; oel.className='p-overall-n c-avg'; }
    else { oel.textContent=`주의 (${total}점)`; oel.className='p-overall-n c-warn'; }
  } else { oel.textContent='—'; oel.className='p-overall-n'; }

  rpRenderAnalysis(oxA,mcA,msA,total);
  rpDrawRadar(oxA,mcA,msA);
  rpDrawTrend(filtered);
}
function rpRenderAnalysis(oxA,mcA,msA,total){
  document.getElementById('rp-analysis-items').innerHTML=[
    {label:'OX 테스트',val:oxA},{label:'4지선다',val:mcA},{label:'마스터테스트',val:msA}
  ].map(r=>{
    if(r.val===null) return `<div class="analysis-item"><span class="ai-label">${r.label}</span><span class="ai-val" style="color:#aeaeb2;">데이터 없음</span></div>`;
    const cls=r.val>=80?'c-good':r.val>=60?'c-avg':'c-warn';
    const lbl=r.val>=80?`양호 (${r.val}점)`:r.val>=60?`보통 (${r.val}점)`:`주의 (${r.val}점)`;
    return `<div class="analysis-item"><span class="ai-label">${r.label}</span><span class="ai-val ${cls}">${lbl}</span></div>`;
  }).join('');

  const com=document.getElementById('rp-comment');
  if(total===null){ com.textContent='아직 데이터가 없습니다.'; return; }
  const low=[],high=[];
  if(oxA!==null){ if(oxA>=80)high.push('OX'); else if(oxA<60)low.push('OX'); }
  if(mcA!==null){ if(mcA>=80)high.push('4지선다'); else if(mcA<60)low.push('4지선다'); }
  if(msA!==null){ if(msA>=80)high.push('마스터'); else if(msA<60)low.push('마스터'); }
  const nm=stu.name||'학생';
  let txt=nm+' 학생';
  if(total>=80) txt+='은 전반적으로 양호한 수준입니다. ';
  else if(total>=60) txt+='은 보통 수준이며 일부 영역 보완이 필요합니다. ';
  else txt+='은 전반적인 기초 개념 복습이 필요합니다. ';
  if(high.length) txt+=high.join(', ')+' 영역은 우수한 성과를 보이고 있습니다. ';
  if(low.length) txt+=`특히 ${low.join(', ')} 영역의 집중 학습을 권장합니다.`;
  com.textContent=txt;
}
function rpDrawRadar(oxA,mcA,msA){
  const ctx=document.getElementById('rp-radar').getContext('2d');
  if(radarInst) radarInst.destroy();
  radarInst=new Chart(ctx,{
    type:'radar',
    data:{labels:['OX 테스트','4지선다','마스터테스트'],
      datasets:[{data:[oxA||0,mcA||0,msA||0],backgroundColor:'rgba(219,39,119,0.15)',borderColor:'#db2777',borderWidth:2,pointBackgroundColor:'#db2777',pointRadius:4}]},
    options:{responsive:false,animation:false,plugins:{legend:{display:false}},
      scales:{r:{min:0,max:100,ticks:{stepSize:25,font:{size:9},color:'#aeaeb2'},grid:{color:'#fce7f3'},pointLabels:{font:{size:10},color:'#6e6e73'},angleLines:{color:'#fce7f3'}}}}
  });
}

/* 점수 추이 — 유형(OX/4지선다/마스터)별로 각각 회차를 매김.
   각 유형은 그 유형의 응시 순서대로 1회차,2회차…(날짜 오름차순).
   유형별로 TREND_MIN회 이상 쌓인 라인만 표시. */
const TREND_MIN=4;
function rpDrawTrend(filtered){
  const canvas=document.getElementById('rp-trend');
  const empty=document.getElementById('rp-trend-empty');
  const badge=document.getElementById('rp-trend-badge');
  if(trendInst){ trendInst.destroy(); trendInst=null; }

  const seqOf=(kind)=> filtered.filter(r=>hasType(r,kind))
      .slice().sort((a,b)=>toDate(a.ts)-toDate(b.ts))
      .map(r=>typeScore(r,kind));
  const oxSeq=seqOf('ox'), mcSeq=seqOf('mc'), msSeq=seqOf('master');

  const types=[
    {label:'OX',      seq:oxSeq, color:'#1e40af', bg:'rgba(30,64,175,0.06)'},
    {label:'4지선다',  seq:mcSeq, color:'#5b21b6', bg:'rgba(91,33,182,0.06)'},
    {label:'마스터',   seq:msSeq, color:'#db2777', bg:'rgba(219,39,119,0.06)'}
  ];
  const qualified=types.filter(t=>t.seq.length>=TREND_MIN);

  if(!qualified.length){
    canvas.style.display='none';
    empty.style.display='flex';
    empty.innerHTML=`각 유형별 ${TREND_MIN}회 이상 응시하면 점수 추이가 표시됩니다.<br>`+
      `<span style="font-size:12px;color:#6e6e73;font-weight:600;margin-top:6px;display:inline-block;">`+
      `OX ${oxSeq.length}/${TREND_MIN} · 4지선다 ${mcSeq.length}/${TREND_MIN} · 마스터 ${msSeq.length}/${TREND_MIN}</span>`;
    badge.textContent='데이터 부족'; badge.className='trend-badge tb-fl';
    return;
  }

  canvas.style.display='block';
  empty.style.display='none';

  const maxLen=Math.max(...qualified.map(t=>t.seq.length));
  const labels=Array.from({length:maxLen},(_,i)=>`${i+1}회차`);
  const datasets=qualified.map(t=>({
    label:t.label,
    data:labels.map((_,i)=> i<t.seq.length ? t.seq[i] : null),
    borderColor:t.color, backgroundColor:t.bg,
    tension:0.35, spanGaps:true, pointRadius:4, pointBackgroundColor:t.color
  }));

  const diffs=qualified.map(t=>t.seq[t.seq.length-1]-t.seq[0]);
  const avgDiff=Math.round(diffs.reduce((a,v)=>a+v,0)/diffs.length);
  if(avgDiff>0){ badge.textContent=`상승세 (+${avgDiff}점)`; badge.className='trend-badge tb-up'; }
  else if(avgDiff<0){ badge.textContent=`하락세 (${avgDiff}점)`; badge.className='trend-badge tb-dn'; }
  else { badge.textContent='보합세'; badge.className='trend-badge tb-fl'; }

  trendInst=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false}},
      scales:{y:{min:0,max:100,ticks:{stepSize:25,font:{size:10},color:'#aeaeb2'},grid:{color:'#f5f5f7'}},
              x:{ticks:{font:{size:10},color:'#aeaeb2'},grid:{display:false}}}}
  });
}

/* ════════ 화면 띄우기 ════════ */
function render(p){
  stu={ name:p.name||'', grade:p.grade||'', subject:p.subject||'', classNames:Array.isArray(p.classNames)?p.classNames:[] };
  recsAll=(Array.isArray(p.results)?p.results:[])
    .filter(r=>r && num(r.score)!==null)
    .map(normalizeRow)
    .sort((a,b)=>toDate(a.ts)-toDate(b.ts));

  document.getElementById('loadingBox').style.display='none';
  document.getElementById('content').style.display='block';

  renderProfile();
  gcRender();
  rpRender();

  let t='';
  if(p.updatedAt && typeof p.updatedAt.toDate==='function'){
    const d=p.updatedAt.toDate();
    t=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}. 기준`;
  }
  setTxt('d-updated',t);
}
