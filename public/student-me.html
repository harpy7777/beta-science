<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.firebasestorage.app",
  messagingSenderId: "650652155367",
  appId: "1:650652155367:web:41d2958e675cb4edd4d142"
};

/* ── 색 설정 ─────────────────────────────────────────────
   기본은 #004AAD 와 회색이고, 색은 데이터에만 씁니다.
   채도를 낮춘 한 벌로 맞춰 화면이 튀지 않게 했습니다.      */
const UP_COLOR = "#7DD3AC";   // 헤더에서 점수가 올랐을 때
const BANDS = [
  { min: 90, color: "#15803D", label: "90점 이상" },
  { min: 75, color: "#1D4ED8", label: "75~89점" },
  { min: 60, color: "#C2410C", label: "60~74점" },
  { min: -1, color: "#B91C1C", label: "60점 미만" }
];
const bandOf = (v) => BANDS.find((b) => v >= b.min) || BANDS[BANDS.length - 1];

/* 유형별 색 · 점 모양 · 정렬 순서
   색은 뚜렷하게 갈리는 네 가지를 쓰고, 점 모양까지 달리해
   색을 구분하기 어려운 화면에서도 유형이 보이게 했습니다.   */
const TYPE_STYLE = {
  ox:     { label: "OX",      bg: "#E7F6EC", fg: "#15803D", line: "#16A34A", shape: "circle",   order: 1 },
  multi:  { label: "사지선다", bg: "#E4EBFB", fg: "#1D4ED8", line: "#2563EB", shape: "square",   order: 2 },
  master: { label: "마스터",   bg: "#FDEEE3", fg: "#C2410C", line: "#EA580C", shape: "diamond",  order: 3 },
  total:  { label: "시험",     bg: "#FCE9E9", fg: "#B91C1C", line: "#DC2626", shape: "triangle", order: 4 }
};

/* 점 모양을 그립니다 */
function markerSvg(shape, cx, cy, r, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  if (shape === "square")
    return `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" rx="1" ${a}/>`;
  if (shape === "diamond")
    return `<polygon points="${cx},${cy - r * 1.3} ${cx + r * 1.3},${cy} ${cx},${cy + r * 1.3} ${cx - r * 1.3},${cy}" ${a}/>`;
  if (shape === "triangle")
    return `<polygon points="${cx},${cy - r * 1.35} ${cx + r * 1.25},${cy + r * 0.92} ${cx - r * 1.25},${cy + r * 0.92}" ${a}/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
}
const styleOf = (k) => TYPE_STYLE[k] || TYPE_STYLE.total;

const PER_PAGE = 10;   // 시험 기록 한 페이지에 보여줄 개수

const $ = (id) => document.getElementById(id);
const showError = (m) => {
  $("loading").classList.add("hidden");
  $("errorView").classList.remove("hidden");
  $("errorView").classList.add("flex");
  if (m) $("errorMsg").textContent = m;
};
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const r1 = (n) => Math.round(Number(n) * 10) / 10;
const n0 = (x) => (x === null || x === undefined || x === "" || isNaN(Number(x)) ? null : Number(x));
const pick = (...xs) => { for (const x of xs) if (x !== null && x !== undefined) return x; return null; };
const isNum = (x) => x !== null && x !== undefined && isFinite(Number(x));

function fmtDate(r) {
  if (r && typeof r.ts === "number" && isFinite(r.ts)) {
    const d = new Date(r.ts);
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  }
  return r && r.date ? String(r.date) : "";
}

/* 점수와 문항 수로 맞은 개수를 역산합니다 */
function calcCorrect(score, total) {
  if (score === null || total === null || total <= 0) return null;
  return Math.round((score / 100) * total);
}

/* ── 한 회차가 어떤 유형을 포함하는지 판별합니다 ─────────── */
function splitParts(r) {
  const out = {};

  if (r.master) {
    const total = pick(r.total, r.totalQuestions);
    out.master = {
      score: r.score,
      total: total,
      correct: pick(r.totalCorrect, r.correct, r.correctCount, calcCorrect(r.score, total))
    };
    return out;
  }

  const oxc = n0(r.oxCount), muc = n0(r.multiCount), tq = n0(r.totalQuestions);
  const subs = Array.isArray(r.subTypes) ? r.subTypes.map((s) => String(s).toLowerCase()) : [];

  let oxDone = null, muDone = null;

  // 1순위: 문항 수 합이 딱 맞으면 어느 쪽을 풀었는지 확실합니다
  if (tq !== null && oxc !== null && muc !== null) {
    if (tq === oxc + muc) { oxDone = true; muDone = true; }
    else if (tq === oxc)  { oxDone = true; muDone = false; }
    else if (tq === muc)  { oxDone = false; muDone = true; }
  }
  // 2순위: 완료 표시나 정답 개수가 있으면 푼 것입니다
  if (oxDone === null) oxDone = r.oxDone === true || n0(r.oxCorrect) !== null
                             || (n0(r.oxScore) !== null && n0(r.oxScore) > 0) || subs.includes("ox");
  if (muDone === null) muDone = r.multiDone === true || n0(r.multiCorrect) !== null
                             || (n0(r.multiScore) !== null && n0(r.multiScore) > 0)
                             || subs.includes("multiple") || subs.includes("multi");

  if (oxDone && n0(r.oxScore) !== null) {
    out.ox = { score: n0(r.oxScore), total: oxc,
               correct: pick(n0(r.oxCorrect), calcCorrect(n0(r.oxScore), oxc)) };
  }
  if (muDone && n0(r.multiScore) !== null) {
    out.multi = { score: n0(r.multiScore), total: muc,
                  correct: pick(n0(r.multiCorrect), calcCorrect(n0(r.multiScore), muc)) };
  }
  return out;
}

/* ── 회차를 유형 단위로 쪼갭니다 ─────────────────────────
   OX 와 사지선다를 함께 본 회차는 두 줄로 나뉩니다.        */
function buildEntries(rows) {
  const list = [];
  rows.forEach((r) => {
    const parts = r.parts || {};
    let keys = Object.keys(parts).filter((k) => parts[k] && isNum(parts[k].score));

    // 유형을 알 수 없는 회차는 전체 점수 한 줄로 남깁니다
    if (!keys.length) {
      parts.total = { score: r.score, total: r.allTotal, correct: r.allCorrect };
      keys = ["total"];
    }

    keys.forEach((k) => {
      const p = parts[k];
      list.push({
        type: k,
        examId: r.examId,
        testName: r.testName,
        score: Number(p.score),
        total: n0(p.total),
        correct: n0(p.correct),
        ts: r.ts,
        fullDate: r.fullDate,
        shortDate: r.shortDate
      });
    });
  });

  list.sort((a, b) => {
    const d = (a.ts || 0) - (b.ts || 0);
    if (d !== 0) return d;
    return styleOf(a.type).order - styleOf(b.type).order;
  });
  return list;
}

/* ── 기간 나누기 ─────────────────────────────────────────
   이번 달이 끝이 되도록 잡습니다. 8월이고 3개월이면
   6월 1일 ~ 오늘 이 가장 최근 화면이고, 그 앞은 3~5월입니다. */
function buildPeriodsMonthly(entries, months) {
  const dated = entries.filter((e) => isNum(e.ts));
  if (!dated.length) return [];

  let minT = dated[0].ts;
  dated.forEach((e) => { if (e.ts < minT) minT = e.ts; });

  const now = new Date();
  const Y = now.getFullYear(), M = now.getMonth();
  const today = now.getTime();

  const out = [];
  for (let k = 0; k < 400; k++) {
    const sMonth = M - (months - 1) - months * k;   // 이 화면의 첫 달
    const eMonth = M - months * k;                  // 이 화면의 마지막 달
    const start = new Date(Y, sMonth, 1).getTime();
    const end = k === 0 ? today : new Date(Y, eMonth + 1, 1).getTime() - 1;

    const items = dated.filter((x) => x.ts >= start && x.ts <= end);
    if (items.length) {
      const sd = new Date(start), ed = new Date(end);
      const label = sd.getFullYear() === ed.getFullYear()
        ? `${sd.getFullYear()}년 ${sd.getMonth() + 1}~${ed.getMonth() + 1}월`
        : `${sd.getFullYear()}년 ${sd.getMonth() + 1}월 ~ ${ed.getFullYear()}년 ${ed.getMonth() + 1}월`;
      out.push({ key: -k, label, start, end, items });
    }
    if (start <= minT) break;
  }
  return out.reverse();
}

function buildPeriodAll(entries) {
  const dated = entries.filter((e) => isNum(e.ts));
  if (!dated.length) return [];
  let maxT = dated[0].ts, minT = dated[0].ts;
  dated.forEach((e) => { if (e.ts > maxT) maxT = e.ts; if (e.ts < minT) minT = e.ts; });
  const pad = Math.max((maxT - minT) * 0.04, 864e5 * 3);
  return [{ key: 0, label: "전체 기간", start: minT - pad, end: maxT + pad, items: dated }];
}

/* ── 앞뒤 기간에서 이어 그릴 기록을 찾습니다 ─────────────
   dir 이 -1 이면 그 시각 바로 앞, +1 이면 바로 뒤 기록입니다. */
function neighborOf(type, ts, dir) {
  let found = null;
  for (const e of allEntries) {
    if (e.type !== type || !isNum(e.ts)) continue;
    if (dir < 0 && e.ts < ts) found = e;               // 계속 갱신 → 가장 가까운 앞 기록
    if (dir > 0 && e.ts > ts) { found = e; break; }    // 처음 만나는 뒤 기록
  }
  return found;
}

/* ── 꺾은선 차트 ─────────────────────────────────────────
   x축은 그 기간 전체를 그대로 씁니다. 기간 밖의 앞뒤 기록까지
   이어 그린 뒤 가장자리에서 잘라내기 때문에, 선이 중간에 뚝
   끊기지 않고 계속 흘러가는 것처럼 보입니다.                */
function drawChart(period) {
  const wrap = $("chartWrap");
  const pts = ((period && period.items) || []).filter((e) => isNum(e.ts));

  if (!pts.length) {
    wrap.innerHTML = '<p class="py-8 text-center text-[13.5px] text-ink-500">이 기간에는 기록이 없습니다.</p>';
    return [];
  }

  const W = 640, H = 236, PL = 36, PR = 16, PT = 26, PB = 34;
  const gx0 = PL, gx1 = W - PR;
  const x0 = PL + 10, x1 = W - PR - 10;
  const ih = H - PT - PB;

  let dMin = period.start, dMax = period.end;
  if (!isNum(dMin) || !isNum(dMax) || dMax <= dMin) {
    dMin = pts[0].ts; dMax = pts[0].ts;
    pts.forEach((p) => { if (p.ts < dMin) dMin = p.ts; if (p.ts > dMax) dMax = p.ts; });
  }
  const dSpan = dMax - dMin;

  const X = (t) => (dSpan > 0 ? x0 + (x1 - x0) * ((t - dMin) / dSpan) : (x0 + x1) / 2);
  // 기간 밖 기록은 화면 밖 좌표로 보냅니다 (잘라내기로 가려집니다)
  const Xo = (t) => {
    if (dSpan <= 0) return t < dMin ? gx0 - 40 : (t > dMax ? gx1 + 40 : (x0 + x1) / 2);
    return Math.max(gx0 - 1200, Math.min(gx1 + 1200, X(t)));
  };
  const Y = (v) => PT + ih - (ih * Math.max(0, Math.min(100, Number(v)))) / 100;

  let grid = "";
  [0, 25, 50, 75, 100].forEach((v) => {
    grid += `<line x1="${gx0}" y1="${Y(v)}" x2="${gx1}" y2="${Y(v)}" stroke="#EBEEF3" stroke-width="1"/>`;
    grid += `<text x="${gx0 - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#98A2B3">${v}</text>`;
  });

  /* 달 구분 — 어느 달 구간인지 바로 읽히도록 세로선과 이름을 넣습니다 */
  let months = [];
  {
    let c = new Date(new Date(dMin).getFullYear(), new Date(dMin).getMonth(), 1);
    while (c.getTime() < dMax && months.length < 400) {
      const nxt = new Date(c.getFullYear(), c.getMonth() + 1, 1);
      const s = Math.max(c.getTime(), dMin), e = Math.min(nxt.getTime(), dMax);
      if (e > s) months.push({ s, e, d: new Date(c) });
      c = nxt;
    }
  }
  const mStep = Math.max(1, Math.ceil(months.length / 8));
  let mAxis = "";
  months.forEach((m, i) => {
    if (i > 0 && m.s > dMin) {
      mAxis += `<line x1="${X(m.s)}" y1="${PT}" x2="${X(m.s)}" y2="${PT + ih}" stroke="#F1F3F7" stroke-width="1"/>`;
    }
    if (i % mStep !== 0 && i !== months.length - 1) return;
    const mid = (X(m.s) + X(m.e)) / 2;
    const txt = m.d.getMonth() === 0 ? `${m.d.getFullYear()}. 1월` : `${m.d.getMonth() + 1}월`;
    mAxis += `<text x="${mid}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#98A2B3">${txt}</text>`;
  });

  // 유형별로 묶습니다 (pts 는 이미 날짜순입니다)
  const groups = new Map();
  pts.forEach((p) => { if (!groups.has(p.type)) groups.set(p.type, []); groups.get(p.type).push(p); });
  const types = Array.from(groups.keys()).sort((a, b) => styleOf(a).order - styleOf(b).order);

  let lines = "", dots = "", marks = "";
  const placed = [];

  types.forEach((t) => {
    const g = groups.get(t);
    const col = styleOf(t).line;
    const shape = styleOf(t).shape;

    // 앞뒤 기간의 이웃 기록을 붙여 선을 잇습니다
    const seq = [];
    const before = neighborOf(t, g[0].ts, -1);
    if (before) seq.push(before);
    seq.push.apply(seq, g);
    const after = neighborOf(t, g[g.length - 1].ts, 1);
    if (after) seq.push(after);

    if (seq.length >= 2) {
      lines += `<polyline points="${seq.map((p) => `${Xo(p.ts)},${Y(p.score)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    g.forEach((p, i) => {
      const last = i === g.length - 1;
      const cx = X(p.ts), cy = Y(p.score);

      dots += markerSvg(shape, cx, cy, last ? 4.8 : 3.8, last ? col : "#fff", col, 2.1);

      if (last) {
        // 마지막 점수는 겹치지 않는 자리에 적습니다
        const cands = [cy - 13, cy + 20, cy - 30, cy + 37];
        let ly = cands.find((c) => c > PT + 6 && c < H - PB + 4
          && !placed.some((q) => Math.abs(q.x - cx) < 36 && Math.abs(q.y - c) < 13));
        if (ly === undefined) ly = cy - 13;
        placed.push({ x: cx, y: ly });
        marks += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${r1(p.score)}</text>`;
      }
    });
  });

  wrap.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="h-auto w-full" role="img" aria-label="유형별 점수 추이">
      <defs>
        <clipPath id="plotClip">
          <rect x="${gx0 - 1}" y="${PT - 18}" width="${gx1 - gx0 + 2}" height="${ih + 26}"/>
        </clipPath>
      </defs>
      ${mAxis}${grid}
      <g clip-path="url(#plotClip)">${lines}</g>
      ${dots}${marks}
    </svg>`;

  return types;
}

function drawLegend(types) {
  $("legendType").innerHTML = (types || []).map((t) => {
    const st = styleOf(t);
    return `<span class="inline-flex items-center gap-1.5 text-[12.5px] font-semibold" style="color:${st.fg}">
              <svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true">
                <line x1="1" y1="6" x2="25" y2="6" stroke="${st.line}" stroke-width="2.6" stroke-linecap="round"/>
                ${markerSvg(st.shape, 13, 6, 3.6, st.line, st.line, 0)}
              </svg>${esc(st.label)}
            </span>`;
  }).join("");
}

/* ── 화면 상태 ─────────────────────────────────────────── */
let allEntries = [];
let months = 3;          // 3 | 6 | 0(전체)
let periods = [];
let pIdx = 0;
let listItems = [];      // 최신순
let lPage = 0;

const SEG = "segbtn rounded-md px-2.5 text-[12.5px] font-semibold ";
const SEG_ON  = SEG + "bg-brand-600 text-white";
const SEG_OFF = SEG + "text-ink-500 hover:text-ink-900";

function paintSegs() {
  $("r3").className   = months === 3 ? SEG_ON : SEG_OFF;
  $("r6").className   = months === 6 ? SEG_ON : SEG_OFF;
  $("rAll").className = months === 0 ? SEG_ON : SEG_OFF;
  [["r3", months === 3], ["r6", months === 6], ["rAll", months === 0]]
    .forEach(([id, on]) => $(id).setAttribute("aria-pressed", String(on)));
}

function rebuild() {
  periods = months === 0 ? buildPeriodAll(allEntries) : buildPeriodsMonthly(allEntries, months);
  pIdx = Math.max(0, periods.length - 1);
  paintSegs();
  renderPeriod();
}

function renderPeriod() {
  if (!periods.length) {
    $("chartWrap").innerHTML = '<p class="py-8 text-center text-[13.5px] text-ink-500">아직 기록이 없습니다.</p>';
    $("pLabel").textContent = "—";
    $("pPrev").disabled = true;
    $("pNext").disabled = true;
    drawLegend([]);
    $("chartNote").textContent = "";
    return;
  }
  const p = periods[pIdx];
  $("pLabel").textContent = p.label;
  $("pPrev").disabled = pIdx <= 0;
  $("pNext").disabled = pIdx >= periods.length - 1;

  const types = drawChart(p);
  drawLegend(types);

  const how = months === 0
    ? "지금까지의 기록을 한 화면에 모았습니다."
    : `이번 달까지 ${months}개월씩 끊어 보여 드립니다.`;
  const link = months === 0 ? "" : " 선은 앞뒤 기간까지 이어집니다.";
  $("chartNote").textContent =
    `${how} 이 화면에는 ${p.items.length}개의 기록이 있습니다.${link} 선의 색과 점 모양으로 유형을 구분합니다.`;
}

function renderList() {
  const totalPages = Math.max(1, Math.ceil(listItems.length / PER_PAGE));
  if (lPage > totalPages - 1) lPage = totalPages - 1;
  if (lPage < 0) lPage = 0;

  const slice = listItems.slice(lPage * PER_PAGE, lPage * PER_PAGE + PER_PAGE);

  if (!slice.length) {
    $("examList").innerHTML = '<li class="px-6 py-8 text-center text-[13.5px] text-ink-500">기록이 없습니다.</li>';
  } else {
    $("examList").innerHTML = slice.map((e) => {
      const st = styleOf(e.type);
      const chip = `<span class="inline-block shrink-0 rounded px-1.5 py-0.5 text-[11px] font-bold"
                          style="background:${st.bg};color:${st.fg}">${esc(st.label)}</span>`;
      const detail = (isNum(e.correct) && e.total) ? `${e.correct} / ${e.total}문항` : "";
      const sub = [e.fullDate, detail].filter(Boolean).map(esc).join(" · ");
      const c = bandOf(e.score).color;

      return `<li class="px-5 py-4 sm:px-6">
        <div class="flex items-start gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              ${chip}
              <p class="min-w-0 text-[14.5px] font-medium leading-snug">${esc(e.testName)}</p>
            </div>
            <p class="num mt-1 text-[12.5px] text-ink-500">${sub}</p>
          </div>
          <p class="num shrink-0 text-[17px] font-bold" style="color:${c}">${r1(e.score)}점</p>
        </div>
      </li>`;
    }).join("");
  }

  const pager = $("listPager");
  if (listItems.length > PER_PAGE) {
    pager.classList.remove("hidden");
    pager.classList.add("flex");
    $("lPage").textContent = `${lPage + 1} / ${totalPages}`;
    $("lPrev").disabled = lPage <= 0;
    $("lNext").disabled = lPage >= totalPages - 1;
  } else {
    pager.classList.add("hidden");
    pager.classList.remove("flex");
  }
}

$("r3").addEventListener("click",   () => { if (months !== 3) { months = 3; rebuild(); } });
$("r6").addEventListener("click",   () => { if (months !== 6) { months = 6; rebuild(); } });
$("rAll").addEventListener("click", () => { if (months !== 0) { months = 0; rebuild(); } });

$("pPrev").addEventListener("click", () => { if (pIdx > 0) { pIdx--; renderPeriod(); } });
$("pNext").addEventListener("click", () => { if (pIdx < periods.length - 1) { pIdx++; renderPeriod(); } });
$("lPrev").addEventListener("click", () => {
  if (lPage > 0) { lPage--; renderList(); $("examList").scrollIntoView({ block: "start", behavior: "smooth" }); }
});
$("lNext").addEventListener("click", () => {
  if (lPage < Math.ceil(listItems.length / PER_PAGE) - 1) { lPage++; renderList(); $("examList").scrollIntoView({ block: "start", behavior: "smooth" }); }
});

/* ── 화면 그리기 ───────────────────────────────────────── */
function render(p) {
  $("hName").textContent = p.name || "학생";
  const sub = [p.grade, p.subject].filter(Boolean).join(" · ");
  $("hSub").textContent = sub || "안녕하세요";
  const badge = [p.name, p.grade].filter(Boolean).join(" · ");
  if (badge) { $("hBadge").textContent = badge; $("hBadge").classList.remove("hidden"); }

  const rows = (Array.isArray(p.results) ? p.results.slice() : [])
    .filter((r) => r && isFinite(Number(r.score)))
    .map((r) => ({
      examId: r.examId || "",
      testName: r.testName || "시험",
      score: Number(r.score),
      master: r.master === true,
      subTypes: Array.isArray(r.subTypes) ? r.subTypes : [],
      oxScore: n0(r.oxScore), oxCount: n0(r.oxCount), oxCorrect: n0(r.oxCorrect), oxDone: r.oxDone === true,
      multiScore: n0(r.multiScore), multiCount: n0(r.multiCount), multiCorrect: n0(r.multiCorrect), multiDone: r.multiDone === true,
      correctCount: n0(r.correctCount), totalQuestions: n0(r.totalQuestions),
      totalCorrect: n0(r.totalCorrect), total: n0(r.total), correct: n0(r.correct),
      ts: n0(r.ts), date: r.date || ""
    }))
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));

  rows.forEach((r) => {
    const d = isNum(r.ts) ? new Date(r.ts) : null;
    r.shortDate = d ? `${d.getMonth() + 1}/${d.getDate()}` : "";
    r.fullDate = fmtDate(r);
    r.parts = splitParts(r);

    const partSum = Object.values(r.parts).reduce((a, x) => a + (x.correct || 0), 0);
    const partTot = Object.values(r.parts).reduce((a, x) => a + (x.total || 0), 0);
    r.allTotal = pick(r.totalQuestions, r.total, partTot || null);
    r.allCorrect = pick(r.correctCount, r.totalCorrect, r.correct,
                        partSum || null, calcCorrect(r.score, r.allTotal));
  });

  const entries = buildEntries(rows);
  allEntries = entries;

  if (!entries.length) {
    $("sLatest").textContent = "—";
    $("sDelta").textContent = "—";
    $("sBest").textContent = "—";
    $("sLatestNote").textContent = "";
    $("sDeltaNote").textContent = "";
    $("sBestNote").textContent = "";
    $("msgText").textContent = "아직 등록된 시험 기록이 없어요. 첫 시험을 보고 나면 여기에 점수가 쌓입니다.";
    $("chartSection").classList.add("hidden");
    $("typeSection").classList.add("hidden");
    $("listCount").textContent = "";
    listItems = [];
    renderList();
    finish(p);
    return;
  }

  const latest = entries[entries.length - 1];
  const latestStyle = styleOf(latest.type);

  // 같은 유형의 바로 이전 기록과 비교합니다
  let prevSame = null;
  for (let i = entries.length - 2; i >= 0; i--) {
    if (entries[i].type === latest.type) { prevSame = entries[i]; break; }
  }
  const best = entries.reduce((a, b) => (b.score > a.score ? b : a), entries[0]);

  $("sLatest").textContent = r1(latest.score) + "점";
  $("sLatestNote").textContent = [latestStyle.label, latest.shortDate].filter(Boolean).join(" · ");

  $("sBest").textContent = r1(best.score) + "점";
  $("sBestNote").textContent = [styleOf(best.type).label, best.shortDate].filter(Boolean).join(" · ");

  const dEl = $("sDelta");
  const baseCls = "num mt-1 text-[20px] font-bold sm:text-[22px] ";
  if (!prevSame) {
    dEl.textContent = "첫 회차";
    dEl.className = baseCls + "text-white/75";
    dEl.style.color = "";
    $("sDeltaNote").textContent = `${latestStyle.label} 첫 기록`;
  } else {
    const diff = r1(latest.score - prevSame.score);
    if (diff > 0) { dEl.textContent = "+" + diff + "점"; dEl.className = baseCls; dEl.style.color = UP_COLOR; }
    else if (diff < 0) { dEl.textContent = diff + "점"; dEl.className = baseCls + "text-white/70"; dEl.style.color = ""; }
    else { dEl.textContent = "동점"; dEl.className = baseCls + "text-white/75"; dEl.style.color = ""; }
    $("sDeltaNote").textContent = `${latestStyle.label} 기준`;
  }

  // 응원 문구 — 하락을 지적하지 않고 다음 행동으로 연결합니다.
  const tl = latestStyle.label;
  let msg;
  if (!prevSame) msg = `${tl} 유형의 첫 기록이 등록되었어요. 회차가 쌓이면 변화가 한눈에 보입니다.`;
  else if (latest.score > prevSame.score) msg = `지난 ${tl} 회차보다 ${r1(latest.score - prevSame.score)}점 올랐어요. 지금 방식이 잘 맞고 있다는 뜻입니다.`;
  else if (latest.score === prevSame.score) msg = `지난 ${tl} 회차와 같은 점수를 유지했어요. 틀린 문제 유형만 확인해 보면 다음에 올릴 수 있습니다.`;
  else msg = `이번 ${tl} 회차는 지난번보다 조금 내려갔어요. 아래 유형별 점수를 보고 약한 쪽부터 다시 보면 됩니다.`;
  if (entries.length >= 2 && latest.score >= best.score) msg = "지금까지 중 가장 높은 점수예요. 잘하고 있습니다.";
  $("msgText").textContent = msg;

  // 그래프 — 이번 달 기준 3개월로 시작합니다
  rebuild();

  /* 유형별 최근 성적 */
  const latestOf = (key) => {
    for (let i = entries.length - 1; i >= 0; i--) if (entries[i].type === key) return entries[i];
    return null;
  };

  const fill = (key, scoreId, noteId) => {
    const e = latestOf(key);
    if (!e) {
      $(scoreId).textContent = "—";
      $(scoreId).className = "num mt-2.5 text-[20px] font-bold sm:text-[23px]";
      $(scoreId).style.color = "#C4C9D2";
      $(noteId).textContent = "아직 기록 없음";
      return null;
    }
    $(scoreId).textContent = r1(e.score) + "점";
    $(scoreId).className = "num mt-2.5 text-[20px] font-bold sm:text-[23px]";
    $(scoreId).style.color = bandOf(e.score).color;
    const bits = [];
    if (isNum(e.correct) && e.total) bits.push(`${e.correct}/${e.total}문항`);
    if (e.shortDate) bits.push(e.shortDate);
    $(noteId).textContent = bits.join(" · ") || "기록됨";
    return e;
  };

  const fOx = fill("ox", "tOx", "tOxNote");
  const fMu = fill("multi", "tMulti", "tMultiNote");
  fill("master", "tMaster", "tMasterNote");

  let advice = "";
  if (fOx && fMu) {
    const gap = r1(Math.abs(fOx.score - fMu.score));
    if (gap >= 15) advice = fOx.score > fMu.score
      ? "사지선다가 OX보다 낮아요. 개념은 잡혀 있으니 보기를 비교하는 연습을 늘리면 좋습니다."
      : "OX가 사지선다보다 낮아요. 헷갈리는 개념의 정의를 다시 정리해 보면 좋습니다.";
    else advice = "두 유형의 점수 차이가 크지 않아요. 고르게 준비되어 있습니다.";
  }
  $("typeAdvice").textContent = advice;

  /* 시험 기록 — 최신순, 10개씩 */
  listItems = entries.slice().reverse();
  lPage = 0;
  $("listCount").textContent = `모두 ${listItems.length}건`;
  renderList();

  finish(p);
}

function finish(p) {
  let t = "";
  if (p.updatedAt && typeof p.updatedAt.toDate === "function") {
    const d = p.updatedAt.toDate();
    t = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. 기준`;
  }
  $("updatedAt").textContent = t || "";
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
}
