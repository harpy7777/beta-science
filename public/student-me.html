<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내 성적 기록 · 인후쌤 과학수업</title>
<meta name="theme-color" content="#F5F6F2" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<style>
:root{
  --paper:#F5F6F2;
  --card:#FFFFFF;
  --ink:#15181B;
  --ink-2:#5C645E;
  --ink-3:#949B94;
  --line:#E3E6DF;
  --line-2:#EEF0EA;
  --accent:#1B6B58;
  --accent-2:#2E8C73;
  --accent-soft:#E7EFEA;
  --down:#9AA29B;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  letter-spacing:-.02em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px calc(env(safe-area-inset-bottom) + 56px)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── 눈금 라벨 ─────────────────────────── */
.tick{
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;
}

/* ── 머리말 ────────────────────────────── */
.top{padding:30px 0 22px;border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:8px}
.top .brand::before{content:"";width:14px;height:1px;background:var(--accent);flex:none}
.name{margin:14px 0 0;font-size:27px;font-weight:800;letter-spacing:-.045em;line-height:1.15}
.meta{margin:7px 0 0;font-size:13.5px;color:var(--ink-2)}
.meta span+span::before{content:"·";margin:0 7px;color:var(--ink-3)}

/* ── 최근 점수 ─────────────────────────── */
.hero{padding:30px 0 26px;border-bottom:1px solid var(--line)}
.hero-row{display:flex;align-items:flex-end;gap:14px}
.big{
  font-family:var(--mono);font-size:64px;font-weight:600;line-height:.86;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums;
}
.unit{font-family:var(--mono);font-size:16px;color:var(--ink-3);padding-bottom:5px}
.delta{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:13px;font-weight:600;padding:5px 9px;border-radius:3px;
}
.delta.up{color:var(--accent);background:var(--accent-soft)}
.delta.down{color:var(--down);background:#F0F1EE}
.delta.flat{color:var(--ink-3);background:#F0F1EE}
.hero-sub{margin:16px 0 0;font-size:14px;color:var(--ink-2);line-height:1.5}
.hero-sub b{font-weight:600;color:var(--ink)}

/* ── 요약 3칸 ──────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stat{padding:20px 0}
.stat+.stat{border-left:1px solid var(--line-2);padding-left:16px}
.stat .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:7px;display:block}

/* ── 추이 그래프 ───────────────────────── */
.chart-sec{padding:28px 0 22px;border-bottom:1px solid var(--line)}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.chart-note{font-size:12.5px;color:var(--ink-3)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.grid-line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.grid-label{font-family:var(--mono);font-size:8px;fill:var(--ink-3)}
.x-label{font-family:var(--mono);font-size:8px;fill:var(--ink-3);text-anchor:middle}
.trend{fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.dot-last{fill:var(--accent)}
.halo{fill:var(--accent);opacity:.14}
.area{fill:var(--accent);opacity:.05}

/* ── 회차 목록 ─────────────────────────── */
.list-sec{padding:28px 0 0}
.list-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.row{padding:18px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:0}
.row-top{display:flex;align-items:baseline;gap:12px}
.idx{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);flex:none;width:20px;letter-spacing:.02em}
.title{font-size:15px;font-weight:600;letter-spacing:-.03em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.03em;flex:none}
.row-sub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:9px 0 0 32px}
.chip{
  font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line);border-radius:3px;padding:3px 6px;background:var(--card);
}
.chip.date{border-color:transparent;background:transparent;color:var(--ink-3);padding-left:0}
.bar{height:3px;background:var(--line-2);border-radius:2px;margin:11px 0 0 32px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;width:0;
  transition:width .7s cubic-bezier(.2,.7,.3,1)}

/* ── 상태 화면 ─────────────────────────── */
.state{padding:70px 0;text-align:center}
.state h2{margin:16px 0 0;font-size:17px;font-weight:700;letter-spacing:-.035em}
.state p{margin:9px 0 0;font-size:14px;color:var(--ink-2);line-height:1.6}
.state .mark{width:30px;height:30px;margin:0 auto;border:1px solid var(--line);
  border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-size:12px;color:var(--ink-3)}

/* ── 꼬리말 ────────────────────────────── */
.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.foot p{margin:0;font-size:12px;color:var(--ink-3);line-height:1.65}

.hidden{display:none !important}

@media (max-width:380px){
  .big{font-size:54px}
  .stat .v{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 불러오는 중 -->
  <div id="loading" class="state">
    <div class="mark mono">···</div>
    <h2>기록을 불러오는 중입니다</h2>
  </div>

  <!-- 오류 -->
  <div id="errorView" class="state hidden">
    <div class="mark mono">!</div>
    <h2 id="errTitle">기록을 열 수 없습니다</h2>
    <p id="errBody">주소가 정확한지 확인해 주세요. 계속 같은 화면이 나오면 선생님께 링크를 다시 받아 주세요.</p>
  </div>

  <!-- 본문 -->
  <main id="app" class="hidden">

    <header class="top">
      <div class="brand tick">인후쌤 과학수업</div>
      <h1 class="name" id="sName">—</h1>
      <p class="meta" id="sMeta"></p>
    </header>

    <section class="hero" id="hero">
      <div class="tick">최근 점수</div>
      <div class="hero-row" style="margin-top:14px">
        <span class="big" id="lastScore">0</span>
        <span class="unit">점</span>
        <span class="delta flat mono" id="delta">—</span>
      </div>
      <p class="hero-sub" id="heroSub"></p>
    </section>

    <section class="stats" id="stats">
      <div class="stat">
        <span class="tick">기록</span>
        <span class="v" id="stCount">0</span>
      </div>
      <div class="stat">
        <span class="tick">평균</span>
        <span class="v" id="stAvg">0</span>
      </div>
      <div class="stat">
        <span class="tick">최고</span>
        <span class="v" id="stMax">0</span>
      </div>
    </section>

    <section class="chart-sec" id="chartSec">
      <div class="chart-head">
        <span class="tick">점수 추이</span>
        <span class="chart-note" id="chartNote"></span>
      </div>
      <svg class="chart" id="chart" viewBox="0 0 320 168" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="회차별 점수 추이 그래프"></svg>
    </section>

    <section class="list-sec">
      <div class="list-head">
        <span class="tick">회차별 기록</span>
        <span class="chart-note">최근이 아래</span>
      </div>
      <div id="rows"></div>
    </section>

    <footer class="foot">
      <p>이 페이지는 본인만 볼 수 있는 링크입니다. 다른 사람에게 공유하지 마세요.<br />
         점수가 실제와 다르면 선생님께 알려 주세요.</p>
    </footer>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.firebasestorage.app",
  messagingSenderId: "650652155367",
  appId: "1:650652155367:web:41d2958e675cb4edd4d142"
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num = (x) => (x === null || x === undefined || x === "" || isNaN(Number(x)) ? null : Number(x));
const pad2 = (n) => String(n).padStart(2, "0");

function fmtDate(row){
  if (row.date) {
    const m = String(row.date).match(/(\d{4})[.\-/]?\s?(\d{1,2})[.\-/]?\s?(\d{1,2})/);
    if (m) return `${m[2]}.${pad2(m[3])}`;
    return String(row.date);
  }
  if (row.ts) { const d = new Date(row.ts); return `${d.getMonth()+1}.${pad2(d.getDate())}`; }
  return "";
}
function fmtScore(v){ return Number.isInteger(v) ? String(v) : String(Math.round(v*10)/10); }

function showError(title, body){
  $("loading").classList.add("hidden");
  $("app").classList.add("hidden");
  if (title) $("errTitle").textContent = title;
  if (body) $("errBody").textContent = body;
  $("errorView").classList.remove("hidden");
}

/* ── 그래프 ───────────────────────────── */
function drawChart(rows){
  const svg = $("chart");
  const W = 320, H = 168, L = 24, R = 8, T = 12, B = 22;
  const iw = W - L - R, ih = H - T - B;

  const scores = rows.map(r => r.score);
  const top = Math.max(100, Math.ceil(Math.max(...scores) / 10) * 10);
  const x = (i) => rows.length === 1 ? L + iw/2 : L + (iw * i) / (rows.length - 1);
  const y = (v) => T + ih * (1 - v / top);

  let out = "";
  [0, top/2, top].forEach(g => {
    out += `<line class="grid-line" x1="${L}" y1="${y(g).toFixed(1)}" x2="${W-R}" y2="${y(g).toFixed(1)}" vector-effect="non-scaling-stroke"/>`;
    out += `<text class="grid-label" x="${L-6}" y="${(y(g)+2.8).toFixed(1)}" text-anchor="end">${g}</text>`;
  });

  const pts = rows.map((r,i) => [x(i), y(r.score)]);
  if (pts.length > 1){
    const d = pts.map((p,i) => `${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
    out += `<path class="area" d="${d} L${pts[pts.length-1][0].toFixed(1)},${y(0).toFixed(1)} L${pts[0][0].toFixed(1)},${y(0).toFixed(1)} Z"/>`;
    out += `<path class="trend" id="trendPath" d="${d}" vector-effect="non-scaling-stroke"/>`;
  }

  const step = Math.ceil(rows.length / 8);
  pts.forEach((p,i) => {
    const last = i === pts.length - 1;
    if (last) out += `<circle class="halo" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="7"/>`;
    out += `<circle class="dot ${last?"dot-last":""}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?3.4:2.4}" vector-effect="non-scaling-stroke"/>`;
    if (i % step === 0 || last)
      out += `<text class="x-label" x="${p[0].toFixed(1)}" y="${H - B + 13}">${pad2(i+1)}</text>`;
  });

  svg.innerHTML = out;

  const path = document.getElementById("trendPath");
  if (path && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = "stroke-dashoffset 900ms cubic-bezier(.2,.7,.3,1)";
    path.style.strokeDashoffset = "0";
  }
}

/* ── 화면 그리기 ──────────────────────── */
function render(p){
  $("sName").textContent = p.name || "학생";
  const meta = [p.grade, p.subject].filter(Boolean).map(esc).map(t => `<span>${t}</span>`).join("");
  $("sMeta").innerHTML = meta;

  const rows = (Array.isArray(p.results) ? p.results : [])
    .map(r => ({ ...r, score: num(r.score) }))
    .filter(r => r.score !== null)
    .sort((a,b) => (a.ts || 0) - (b.ts || 0));

  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");

  if (!rows.length){
    $("hero").classList.add("hidden");
    $("stats").classList.add("hidden");
    $("chartSec").classList.add("hidden");
    $("rows").innerHTML = `<div class="state" style="padding:48px 0">
      <div class="mark mono">0</div>
      <h2>아직 기록된 시험이 없습니다</h2>
      <p>시험을 풀고 나면 이 자리에 회차별 점수가 쌓입니다.</p></div>`;
    return;
  }

  const last = rows[rows.length - 1];
  const prev = rows.length > 1 ? rows[rows.length - 2] : null;

  $("lastScore").textContent = fmtScore(last.score);

  const dEl = $("delta");
  if (prev){
    const diff = Math.round((last.score - prev.score) * 10) / 10;
    dEl.className = "delta mono " + (diff > 0 ? "up" : diff < 0 ? "down" : "flat");
    dEl.textContent = diff > 0 ? `▲ ${fmtScore(diff)}` : diff < 0 ? `▼ ${fmtScore(Math.abs(diff))}` : "= 0";
  } else {
    dEl.className = "delta flat mono";
    dEl.textContent = "첫 기록";
  }

  const parts = [`<b>${esc(last.testName || "시험")}</b>`];
  const dt = fmtDate(last); if (dt) parts.push(dt);
  if (last.correctCount !== null && last.correctCount !== undefined &&
      last.totalQuestions) parts.push(`${last.correctCount} / ${last.totalQuestions}문항`);
  $("heroSub").innerHTML = parts.join(" · ") + (prev ? ` · 지난 회차 ${fmtScore(prev.score)}점` : "");

  const sum = rows.reduce((a,r) => a + r.score, 0);
  $("stCount").textContent = rows.length;
  $("stAvg").textContent = fmtScore(Math.round((sum / rows.length) * 10) / 10);
  $("stMax").textContent = fmtScore(Math.max(...rows.map(r => r.score)));

  const shown = rows.slice(-12);
  $("chartNote").textContent = rows.length > 12 ? `최근 12회` : `전체 ${rows.length}회`;
  drawChart(shown);

  const offset = rows.length - shown.length;
  $("rows").innerHTML = rows.map((r,i) => {
    const chips = [];
    const d = fmtDate(r); if (d) chips.push(`<span class="chip date">${esc(d)}</span>`);
    if (num(r.oxScore) !== null) chips.push(`<span class="chip">OX ${fmtScore(num(r.oxScore))}</span>`);
    if (num(r.multiScore) !== null) chips.push(`<span class="chip">객관식 ${fmtScore(num(r.multiScore))}</span>`);
    if (num(r.correctCount) !== null && num(r.totalQuestions))
      chips.push(`<span class="chip">${num(r.correctCount)}/${num(r.totalQuestions)}문항</span>`);
    const pct = Math.max(0, Math.min(100, r.score));
    return `<div class="row">
      <div class="row-top">
        <span class="idx">${pad2(i+1)}</span>
        <span class="title">${esc(r.testName || "시험")}</span>
        <span class="pt">${fmtScore(r.score)}</span>
      </div>
      ${chips.length ? `<div class="row-sub">${chips.join("")}</div>` : ""}
      <div class="bar"><i data-w="${pct}"></i></div>
    </div>`;
  }).join("");

  requestAnimationFrame(() => {
    document.querySelectorAll(".bar i").forEach((el, k) => {
      setTimeout(() => { el.style.width = el.getAttribute("data-w") + "%"; }, 40 + k * 30);
    });
  });

  void offset;
}

/* ── 데이터 ───────────────────────────── */
const params = new URLSearchParams(location.search);
const token = (params.get("t") || "").trim();

if (params.get("demo") === "1"){
  const base = Date.now() - 1000 * 60 * 60 * 24 * 70;
  render({
    name: "신재영", grade: "고등1학년", subject: "통합과학",
    results: [
      { testName:"물질의 규칙성 1회", score:62, ts:base,                    oxScore:30, multiScore:32, correctCount:12, totalQuestions:20 },
      { testName:"화학 결합 진단",     score:71, ts:base+864e5*9,           oxScore:36, multiScore:35, correctCount:14, totalQuestions:20 },
      { testName:"산화·환원 1회",      score:68, ts:base+864e5*17,          correctCount:17, totalQuestions:25 },
      { testName:"산과 염기",          score:79, ts:base+864e5*24,          oxScore:40, multiScore:39 },
      { testName:"중화 반응 단원평가", score:85, ts:base+864e5*33,          correctCount:17, totalQuestions:20 },
      { testName:"역학적 시스템",      score:74, ts:base+864e5*41 },
      { testName:"지구 시스템 1회",    score:88, ts:base+864e5*52,          oxScore:44, multiScore:44 },
      { testName:"중간 대비 모의",     score:93, ts:base+864e5*63,          correctCount:28, totalQuestions:30 }
    ]
  });
} else if (!token){
  showError("링크가 올바르지 않습니다", "선생님께 받은 주소를 그대로 열어 주세요. 주소 뒷부분이 잘렸을 수 있습니다.");
} else {
  const db = getFirestore(initializeApp(firebaseConfig));
  getDoc(doc(db, "portals", token))
    .then((snap) => {
      if (!snap.exists()) {
        showError("기록을 찾을 수 없습니다", "링크가 새로 발급되었을 수 있습니다. 선생님께 최신 링크를 받아 주세요.");
        return;
      }
      const p = snap.data() || {};
      if (p.active === false) {
        showError("사용이 중지된 링크입니다", "선생님께 새 링크를 요청해 주세요.");
        return;
      }
      render(p);
    })
    .catch((e) => {
      console.error(e);
      showError("기록을 열지 못했습니다", "잠시 후 다시 시도해 주세요. 계속 같은 화면이면 선생님께 알려 주세요.");
    });
}
</script>
</body>
</html>
