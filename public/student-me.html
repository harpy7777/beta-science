<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내 성적 · 인후쌤 과학수업</title>
<meta name="theme-color" content="#0F1E3A" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { navy:{950:'#0A1428',900:'#0F1E3A',800:'#17294A'},
                brand:{50:'#EFF6FF',100:'#DBEAFE',200:'#BFDBFE',500:'#3B82F6',600:'#2563EB',700:'#1D4ED8'} },
      fontFamily: { sans:['Pretendard Variable','Pretendard','-apple-system','system-ui','sans-serif'] },
      boxShadow: { card:'0 1px 2px 0 rgba(15,30,58,0.04)' },
      maxWidth: { shell:'44rem' }
    }}
  };
</script>
<style>
  body{letter-spacing:-0.02em}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-0.03em}
  .tight{letter-spacing:-0.035em}
  :focus-visible{outline:2px solid #2563EB;outline-offset:3px;border-radius:6px}
  .on-navy :focus-visible{outline-color:#fff}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body class="bg-slate-50 font-sans text-navy-900 antialiased">

<!-- 로딩 -->
<div id="loading" class="flex min-h-screen items-center justify-center">
  <p class="text-[14px] text-slate-400">불러오는 중입니다…</p>
</div>

<!-- 오류 -->
<div id="errorView" class="hidden min-h-screen items-center justify-center px-6">
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-card">
    <h1 class="tight text-[18px] font-bold">주소를 확인해 주세요</h1>
    <p id="errorMsg" class="mt-3 text-[14px] leading-relaxed text-slate-500">링크가 올바르지 않습니다.</p>
    <p class="mt-5 text-[13px] text-slate-400">선생님께 링크를 다시 요청해 주세요.</p>
  </div>
</div>

<!-- 본문 -->
<div id="app" class="hidden">

  <header class="on-navy bg-navy-900">
    <div class="mx-auto max-w-shell px-5 py-6 sm:px-6 sm:py-8">
      <div class="flex items-center gap-2.5">
        <span class="flex h-7 w-7 items-center justify-center rounded-lg bg-white/10">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.5 3v6.2L4.8 17.4A2.4 2.4 0 0 0 6.9 21h10.2a2.4 2.4 0 0 0 2.1-3.6L14.5 9.2V3"/><path d="M8.2 3h7.6"/><path d="M7.4 14.4h9.2"/>
          </svg>
        </span>
        <span class="text-[13.5px] font-semibold text-white/70">인후쌤 과학수업</span>
      </div>

      <p class="mt-6 text-[14px] text-white/50" id="hSub">—</p>
      <h1 class="tight mt-1 text-[24px] font-bold text-white sm:text-[27px]"><span id="hName">—</span> 학생의 성적표</h1>

      <div class="mt-7 grid grid-cols-3 gap-4">
        <div>
          <p class="text-[12.5px] text-white/45">최근 점수</p>
          <p class="num mt-1 text-[20px] font-bold text-white sm:text-[22px]" id="sLatest">—</p>
        </div>
        <div>
          <p class="text-[12.5px] text-white/45">지난 회차 대비</p>
          <p class="num mt-1 text-[20px] font-bold sm:text-[22px]" id="sDelta">—</p>
        </div>
        <div>
          <p class="text-[12.5px] text-white/45">나의 최고 기록</p>
          <p class="num mt-1 text-[20px] font-bold text-white sm:text-[22px]" id="sBest">—</p>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-shell px-5 pb-16 pt-8 sm:px-6">

    <!-- 응원 문구 -->
    <div id="msgBox" class="rounded-2xl border border-slate-200 bg-white p-6 shadow-card">
      <p id="msgText" class="text-[15px] leading-relaxed text-navy-900">—</p>
    </div>

    <!-- 점수 추이 -->
    <section class="mt-8" id="chartSection">
      <h2 class="tight text-[16px] font-bold">점수 추이</h2>
      <div class="mt-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-card sm:p-6">
        <div id="chartWrap" class="w-full"></div>
        <p class="mt-3 text-[12.5px] text-slate-400">최근 회차 순서대로 표시됩니다.</p>
      </div>
    </section>

    <!-- 유형별 -->
    <section class="mt-8" id="typeSection">
      <h2 class="tight text-[16px] font-bold">유형별 최근 성적</h2>
      <div class="mt-3 grid grid-cols-2 gap-3">
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-card">
          <p class="text-[13px] font-medium text-slate-500">OX 문제</p>
          <p class="num mt-2 text-[22px] font-bold" id="tOx">—</p>
          <p class="mt-1 text-[12.5px] text-slate-400" id="tOxNote">—</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-card">
          <p class="text-[13px] font-medium text-slate-500">객관식 문제</p>
          <p class="num mt-2 text-[22px] font-bold" id="tMulti">—</p>
          <p class="mt-1 text-[12.5px] text-slate-400" id="tMultiNote">—</p>
        </div>
      </div>
      <p id="typeAdvice" class="mt-3 text-[13.5px] leading-relaxed text-slate-500"></p>
    </section>

    <!-- 회차 목록 -->
    <section class="mt-8">
      <h2 class="tight text-[16px] font-bold">시험 기록</h2>
      <div class="mt-3 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-card">
        <ul id="examList" class="divide-y divide-slate-100"></ul>
      </div>
    </section>

    <p class="mt-8 text-center text-[12.5px] text-slate-400" id="updatedAt">—</p>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ★★★ 여기에 기존 파일(student-portal.html 등)의 firebaseConfig를 그대로 붙여넣으세요 ★★★ */
 const firebaseConfig = {
  apiKey: "AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.firebasestorage.app",
  messagingSenderId: "650652155367",
  appId: "1:650652155367:web:41d2958e675cb4edd4d142"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
const showError = (m) => {
  $("loading").classList.add("hidden");
  $("errorView").classList.remove("hidden");
  $("errorView").classList.add("flex");
  if (m) $("errorMsg").textContent = m;
};
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const r1 = (n) => Math.round(Number(n) * 10) / 10;

function fmtDate(r) {
  if (r && typeof r.ts === "number" && isFinite(r.ts)) {
    const d = new Date(r.ts);
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  }
  return r && r.date ? String(r.date) : "";
}

/* 꺾은선 차트 (외부 라이브러리 없이 SVG로 직접 그립니다) */
function drawChart(rows) {
  const wrap = $("chartWrap");
  if (!rows.length) { wrap.innerHTML = '<p class="py-6 text-center text-[13.5px] text-slate-400">아직 기록이 없습니다.</p>'; return; }
  if (rows.length === 1) {
    wrap.innerHTML = `<p class="py-6 text-center text-[13.5px] text-slate-400">회차가 2번 이상 쌓이면 추이가 그려집니다.</p>`;
    return;
  }

  const W = 640, H = 220, PL = 38, PR = 14, PT = 18, PB = 34;
  const iw = W - PL - PR, ih = H - PT - PB;
  const n = rows.length;
  const x = (i) => PL + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
  const y = (v) => PT + ih - (ih * Math.max(0, Math.min(100, v))) / 100;

  let grid = "";
  [0, 25, 50, 75, 100].forEach((v) => {
    grid += `<line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="#E2E8F0" stroke-width="1"/>`;
    grid += `<text x="${PL - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#94A3B8">${v}</text>`;
  });

  const pts = rows.map((r, i) => `${x(i)},${y(r.score)}`).join(" ");
  const area = `${PL},${y(0)} ${pts} ${x(n - 1)},${y(0)}`;

  let dots = "", labels = "";
  rows.forEach((r, i) => {
    const last = i === n - 1;
    dots += `<circle cx="${x(i)}" cy="${y(r.score)}" r="${last ? 5.5 : 4}" fill="${last ? "#2563EB" : "#fff"}" stroke="#2563EB" stroke-width="2"/>`;
    if (last) dots += `<text x="${x(i)}" y="${y(r.score) - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">${r1(r.score)}</text>`;
    if (n <= 6 || i === 0 || last || i % 2 === 0) {
      labels += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#94A3B8">${esc(r.shortDate)}</text>`;
    }
  });

  wrap.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="h-auto w-full" role="img" aria-label="회차별 점수 추이">
      ${grid}
      <polygon points="${area}" fill="#2563EB" fill-opacity="0.06"/>
      <polyline points="${pts}" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${labels}
    </svg>`;
}

function render(p) {
  $("hName").textContent = p.name || "학생";
  const sub = [p.grade, p.subject].filter(Boolean).join(" · ");
  $("hSub").textContent = sub || "안녕하세요";

  const rows = (Array.isArray(p.results) ? p.results.slice() : [])
    .filter((r) => r && isFinite(Number(r.score)))
    .map((r) => ({
      examId: r.examId || "",
      testName: r.testName || "시험",
      score: Number(r.score),
      oxScore: isFinite(Number(r.oxScore)) ? Number(r.oxScore) : null,
      multiScore: isFinite(Number(r.multiScore)) ? Number(r.multiScore) : null,
      correctCount: isFinite(Number(r.correctCount)) ? Number(r.correctCount) : null,
      totalQuestions: isFinite(Number(r.totalQuestions)) ? Number(r.totalQuestions) : null,
      ts: isFinite(Number(r.ts)) ? Number(r.ts) : null,
      date: r.date || ""
    }))
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));

  rows.forEach((r) => {
    const d = r.ts ? new Date(r.ts) : null;
    r.shortDate = d ? `${d.getMonth() + 1}/${d.getDate()}` : "";
    r.fullDate = fmtDate(r);
  });

  if (!rows.length) {
    $("sLatest").textContent = "—";
    $("sDelta").textContent = "—";
    $("sBest").textContent = "—";
    $("msgText").textContent = "아직 등록된 시험 기록이 없어요. 첫 시험을 보고 나면 여기에 점수가 쌓입니다.";
    $("chartSection").classList.add("hidden");
    $("typeSection").classList.add("hidden");
    $("examList").innerHTML = '<li class="px-6 py-8 text-center text-[13.5px] text-slate-400">기록이 없습니다.</li>';
    finish(p);
    return;
  }

  const latest = rows[rows.length - 1];
  const prev = rows.length >= 2 ? rows[rows.length - 2] : null;
  const best = rows.reduce((a, b) => (b.score > a.score ? b : a), rows[0]);

  $("sLatest").textContent = r1(latest.score) + "점";
  $("sBest").textContent = r1(best.score) + "점";

  const dEl = $("sDelta");
  if (!prev) {
    dEl.textContent = "첫 회차";
    dEl.className = "num mt-1 text-[20px] font-bold text-white/70 sm:text-[22px]";
  } else {
    const diff = r1(latest.score - prev.score);
    if (diff > 0) { dEl.textContent = "+" + diff + "점"; dEl.className = "num mt-1 text-[20px] font-bold text-brand-200 sm:text-[22px]"; }
    else if (diff < 0) { dEl.textContent = diff + "점"; dEl.className = "num mt-1 text-[20px] font-bold text-white/60 sm:text-[22px]"; }
    else { dEl.textContent = "동점"; dEl.className = "num mt-1 text-[20px] font-bold text-white/70 sm:text-[22px]"; }
  }

  // 응원 문구 — 하락을 지적하지 않고 다음 행동으로 연결합니다.
  let msg;
  if (!prev) msg = "첫 기록이 등록되었어요. 앞으로 회차가 쌓이면 변화가 한눈에 보입니다.";
  else if (latest.score > prev.score) msg = `지난 회차보다 ${r1(latest.score - prev.score)}점 올랐어요. 지금 방식이 잘 맞고 있다는 뜻입니다.`;
  else if (latest.score === prev.score) msg = "지난 회차와 같은 점수를 유지했어요. 틀린 문제 유형만 확인해 보면 다음에 올릴 수 있습니다.";
  else msg = "이번 회차는 지난번보다 조금 내려갔어요. 아래 유형별 점수를 보고 약한 쪽부터 다시 보면 됩니다.";
  if (latest.score >= best.score && rows.length >= 2) msg = "지금까지 중 가장 높은 점수예요. 잘하고 있습니다.";
  $("msgText").textContent = msg;

  drawChart(rows.slice(-10));

  // 유형별
  const ox = latest.oxScore, mu = latest.multiScore;
  $("tOx").textContent = ox == null ? "—" : r1(ox) + "점";
  $("tMulti").textContent = mu == null ? "—" : r1(mu) + "점";
  $("tOxNote").textContent = ox == null ? "이번 회차에 없음" : "100점 만점 환산";
  $("tMultiNote").textContent = mu == null ? "이번 회차에 없음" : "100점 만점 환산";

  let advice = "";
  if (ox != null && mu != null) {
    const gap = r1(Math.abs(ox - mu));
    if (gap >= 15) advice = ox > mu
      ? "객관식이 OX보다 낮아요. 개념은 잡혀 있으니 보기를 비교하는 연습을 늘리면 좋습니다."
      : "OX가 객관식보다 낮아요. 헷갈리는 개념의 정의를 다시 정리해 보면 좋습니다.";
    else advice = "두 유형의 점수 차이가 크지 않아요. 고르게 준비되어 있습니다.";
  }
  $("typeAdvice").textContent = advice;

  // 시험 기록 목록 (최신순)
  const list = rows.slice().reverse().map((r) => {
    const detail = (r.correctCount != null && r.totalQuestions != null)
      ? `${r.correctCount} / ${r.totalQuestions}문항` : "";
    return `<li class="flex items-center gap-4 px-5 py-4 sm:px-6">
      <div class="min-w-0 flex-1">
        <p class="truncate text-[14.5px] font-medium">${esc(r.testName)}</p>
        <p class="num mt-1 text-[12.5px] text-slate-400">${esc(r.fullDate)}${detail ? " · " + esc(detail) : ""}</p>
      </div>
      <p class="num shrink-0 text-[16px] font-bold">${r1(r.score)}점</p>
    </li>`;
  }).join("");
  $("examList").innerHTML = list;

  finish(p);
}

function finish(p) {
  let t = "";
  if (p.updatedAt && typeof p.updatedAt.toDate === "function") {
    const d = p.updatedAt.toDate();
    t = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. 기준`;
  }
  $("updatedAt").textContent = t || "";
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
}

(async function () {
  try {
    const token = new URLSearchParams(location.search).get("t");
    if (!token || !/^[A-Za-z0-9_-]{12,64}$/.test(token)) { showError("링크에 필요한 정보가 없습니다."); return; }

    const snap = await getDoc(doc(db, "portals", token));
    if (!snap.exists()) { showError("만료되었거나 존재하지 않는 링크입니다."); return; }

    const p = snap.data();
    if (p.active === false) { showError("현재 사용할 수 없는 링크입니다."); return; }

    render(p);
  } catch (e) {
    console.error(e);
    showError("정보를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.");
  }
})();
</script>
</body>
</html>
