<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="/favicon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>내 성적 · 인후쌤의 과학 수업 관리 시스템</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  background:#F4F6F9;color:#101828;min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-.02em;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
.hidden{display:none !important}
.num,.stat-num,.type-score,.exam-score,.p-label{font-variant-numeric:tabular-nums}
button{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid #004AAD;outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}

/* ── Header ── */
.header{background:#fff;border-bottom:1px solid #E3E7EE;padding:0 1.2rem;padding-left:max(1.2rem,env(safe-area-inset-left));padding-right:max(1.2rem,env(safe-area-inset-right));height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:300}
.header-left{display:flex;align-items:center;gap:9px;min-width:0}
.logo-mark{width:30px;height:30px;background:#004AAD;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:clamp(11px,3vw,14px);font-weight:700;color:#101828;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-badge{display:inline-flex;align-items:center;background:#fff;border:1px solid #E3E7EE;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:700;color:#475467;white-space:nowrap;flex-shrink:0}

/* ── Wrap ── */
.wrap{max-width:78rem;margin:0 auto;padding:1.4rem 1.2rem;padding-bottom:max(4rem,calc(3rem + env(safe-area-inset-bottom)));padding-left:max(1.2rem,env(safe-area-inset-left));padding-right:max(1.2rem,env(safe-area-inset-right))}

/* ── Page Hero ── */
.page-hero{background:#fff;border:1px solid #E3E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:1.1rem 1.3rem;margin-bottom:1.4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hero-left{display:flex;align-items:center;gap:12px;min-width:0}
.hero-icon{width:44px;height:44px;border-radius:10px;background:#EFF5FD;border:1px solid #DCE8FA;color:#004AAD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-title{font-size:1.05rem;font-weight:700;letter-spacing:-.03em;line-height:1.3}
.hero-sub{font-size:11.5px;color:#667085;margin-top:3px}
.hero-date{text-align:right}
.hero-date-main{font-size:1rem;font-weight:700;color:#004AAD;letter-spacing:-.02em}
.hero-date-day{font-size:11px;color:#98A2B3;margin-top:3px;font-weight:600}

/* ── Section ── */
.section-heading{font-size:11px;font-weight:700;color:#98A2B3;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.8rem}
.section-card{background:#fff;border:1px solid #E3E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:1.1rem 1.3rem;margin-bottom:1rem}
.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:1rem}
.section-title{font-size:14px;font-weight:700;color:#101828}
.section-count{font-size:12px;color:#98A2B3;font-weight:600}
.block{margin-bottom:1.4rem}
.block:last-child{margin-bottom:0}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat-label{font-size:11.5px;color:#667085;font-weight:600}
.stat-num{font-size:20px;font-weight:700;color:#101828;letter-spacing:-.03em;margin-top:5px;line-height:1.2}
.stat-note{font-size:11px;color:#98A2B3;margin-top:4px;line-height:1.5;font-weight:600}

/* ── Message ── */
.msg-card{background:#fff;border:1px solid #E3E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:1rem 1.3rem;margin-bottom:1.4rem}
.msg-text{font-size:14px;line-height:1.75;color:#475467}

/* ── Layout ── */
.grid-main{display:grid;gap:1.4rem;align-items:start}
.grid-main .section-card{margin-bottom:0}
.grid-col{display:flex;flex-direction:column;min-width:0}
@media(min-width:1024px){
  .grid-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.1rem;align-items:stretch}
  .grid-col{height:100%}
  .grid-col .section-card{flex:1;display:flex;flex-direction:column}
}

/* ── Segmented ── */
.seg{display:inline-flex;background:#F4F6F9;border:1px solid #E3E7EE;border-radius:9px;padding:2px;gap:2px}
.seg-btn{height:30px;padding:0 12px;border:none;background:none;border-radius:7px;font-size:12px;font-weight:600;color:#667085;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg-btn:hover{color:#101828}
.seg-btn.on{background:#004AAD;color:#fff}

/* ── Chart ── */
.chart-nav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.navbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #E3E7EE;background:#fff;border-radius:8px;color:#475467;cursor:pointer;transition:background .15s,color .15s}
.navbtn:hover{background:#F4F6F9;color:#101828}
.navbtn:disabled{opacity:.3;cursor:not-allowed}
.p-label{min-width:9.5rem;text-align:center;font-size:13px;font-weight:700;color:#101828;white-space:nowrap}
.chart-svg{display:block;width:100%;height:auto}
.chart-empty{padding:2.2rem 0;text-align:center;font-size:12.5px;color:#98A2B3}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.chart-note{margin-top:12px;font-size:11.5px;line-height:1.7;color:#98A2B3}

/* ── Type cards ── */
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.type-item{border:1px solid #E3E7EE;border-radius:10px;padding:.7rem .75rem;display:flex;flex-direction:column;justify-content:center;min-width:0}
.type-chip{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.type-item .type-chip{align-self:flex-start}
.type-score{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1.2;color:#101828}
.type-note{font-size:11px;color:#667085;margin-top:3px;line-height:1.5}
.type-advice{margin-top:.85rem;font-size:12px;line-height:1.7;color:#475467}
.type-advice:empty{display:none}
@media(min-width:1024px){
  .type-grid{flex:1;grid-template-columns:1fr;grid-template-rows:repeat(3,1fr);gap:10px}
  .type-item{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:.75rem 1rem}
  .type-body{text-align:right}
  .type-score{margin-top:0;font-size:22px}
}

/* ── Exam list ── */
.list-card{background:#fff;border:1px solid #E3E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);overflow:hidden}
.exam-list{list-style:none}
.exam-item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #EFF1F5}
.exam-list li:last-child{border-bottom:none}
.exam-item .type-chip{width:60px;text-align:center;flex-shrink:0;padding:2px 0}
.exam-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam-meta{font-size:11.5px;color:#98A2B3;font-weight:600;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.exam-score{width:62px;text-align:right;font-size:16px;font-weight:700;flex-shrink:0;letter-spacing:-.03em}
.exam-empty{padding:2.5rem 1rem;text-align:center;font-size:12.5px;color:#98A2B3}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #E3E7EE;background:#FAFBFD;padding:10px 14px}
.pagebtn{height:36px;padding:0 14px;border:1px solid #E3E7EE;background:#fff;border-radius:8px;font-size:12.5px;font-weight:600;color:#475467;cursor:pointer;transition:background .15s,color .15s}
.pagebtn:hover{background:#F4F6F9;color:#101828}
.pagebtn:disabled{opacity:.35;cursor:not-allowed}
.page-num{font-size:12.5px;font-weight:600;color:#98A2B3;font-variant-numeric:tabular-nums}

.foot-note{margin-top:1.6rem;text-align:center;font-size:11.5px;color:#98A2B3}

/* ── Loading / Error ── */
.center-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1.2rem}
.center-text{font-size:13.5px;color:#667085}
.err-card{width:100%;max-width:380px;background:#fff;border:1px solid #E3E7EE;border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.05);padding:1.6rem 1.5rem;text-align:center}
.err-title{font-size:15px;font-weight:700;letter-spacing:-.03em}
.err-msg{margin-top:10px;font-size:13px;line-height:1.7;color:#475467}
.err-sub{margin-top:14px;font-size:12px;color:#98A2B3}

/* ── Responsive ── */
@media(max-width:520px){
  .header{padding:0 .9rem;height:50px}
  .header-badge{display:none}
  .wrap{padding:.9rem .85rem;padding-bottom:calc(3rem + env(safe-area-inset-bottom))}
  .page-hero{padding:.9rem 1rem;margin-bottom:1.1rem}
  .hero-icon{width:38px;height:38px}
  .hero-title{font-size:1rem}
  .hero-date{display:none}
  .section-card{padding:.9rem 1rem}
  .msg-card{padding:.9rem 1rem;margin-bottom:1.1rem}
  .msg-text{font-size:13.5px}
  .stat-grid{gap:8px}
  .stat-num{font-size:18px}
  .stat-label{font-size:11px}
  .stat-note{font-size:10.5px}
  .seg-btn{padding:0 10px;font-size:11.5px}
  .p-label{min-width:8rem;font-size:12.5px}
  .type-item{padding:.6rem .65rem}
  .type-score{font-size:18px}
  .type-note{font-size:10.5px}
  .exam-item{padding:10px 12px;gap:8px}
  .exam-item .type-chip{width:50px;font-size:10.5px}
  .exam-name{font-size:12.5px}
  .exam-meta{font-size:10.5px}
  .exam-score{width:52px;font-size:14.5px}
  .grid-main{gap:1.1rem}
  .block{margin-bottom:1.1rem}
}
@media(max-width:380px){
  .stat-num{font-size:16.5px}
  .type-grid{gap:7px}
  .type-item{padding:.55rem .5rem}
  .type-chip{padding:2px 6px;font-size:11px}
  .type-score{font-size:16.5px}
  .seg-btn{padding:0 8px;font-size:11px}
  .pagebtn{padding:0 11px;font-size:12px}
  .exam-item{padding:10px}
  .exam-item .type-chip{width:44px;font-size:10px;padding:2px 0}
  .exam-meta{font-size:10px}
  .exam-score{width:46px;font-size:13.5px}
}
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loading" class="center-wrap">
  <p class="center-text">불러오는 중입니다…</p>
</div>

<!-- 오류 -->
<div id="errorView" class="center-wrap hidden">
  <div class="err-card">
    <div class="err-title">주소를 확인해 주세요</div>
    <p id="errorMsg" class="err-msg">링크가 올바르지 않습니다.</p>
    <p class="err-sub">선생님께 링크를 다시 요청해 주세요.</p>
  </div>
</div>

<!-- 본문 -->
<div id="app" class="hidden">

  <header class="header">
    <div class="header-left">
      <div class="logo-mark">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <circle cx="9" cy="7" r="3" fill="#fff"/>
          <path d="M3.5 16c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <span class="brand-name">인후쌤의 과학 수업 관리 시스템</span>
    </div>
    <span id="hBadge" class="header-badge hidden"></span>
  </header>

  <div class="wrap">

    <div class="page-hero">
      <div class="hero-left">
        <div class="hero-icon">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19V6"/><path d="M4 19h16"/><path d="M7.5 15.5l3.5-4 3 2.5 4.5-6"/>
          </svg>
        </div>
        <div>
          <div class="hero-title"><span id="hName">—</span> 학생의 성적표</div>
          <div class="hero-sub" id="hSub">—</div>
        </div>
      </div>
      <div class="hero-date">
        <div class="hero-date-main" id="today-date">—</div>
        <div class="hero-date-day" id="today-day">—</div>
      </div>
    </div>

    <!-- 요약 -->
    <div class="section-heading">SUMMARY</div>
    <div class="section-card">
      <div class="stat-grid">
        <div>
          <p class="stat-label">최근 점수</p>
          <p class="stat-num" id="sLatest">—</p>
          <p class="stat-note" id="sLatestNote"></p>
        </div>
        <div>
          <p class="stat-label">지난 회차 대비</p>
          <p class="stat-num" id="sDelta">—</p>
          <p class="stat-note" id="sDeltaNote"></p>
        </div>
        <div>
          <p class="stat-label">나의 최고 기록</p>
          <p class="stat-num" id="sBest">—</p>
          <p class="stat-note" id="sBestNote"></p>
        </div>
      </div>
    </div>

    <!-- 응원 문구 -->
    <div id="msgBox" class="msg-card">
      <p id="msgText" class="msg-text">—</p>
    </div>

    <div class="grid-main">

      <!-- 시험 점수 분포도 -->
      <section id="chartSection" class="grid-col">
        <div class="section-heading">TREND</div>
        <div class="section-card">
          <div class="section-header">
            <span class="section-title">시험 점수 분포도</span>
            <div class="seg" role="group" aria-label="기간 길이">
              <button id="r3" type="button" class="seg-btn">3개월</button>
              <button id="r6" type="button" class="seg-btn">6개월</button>
              <button id="rAll" type="button" class="seg-btn">전체</button>
            </div>
          </div>

          <div class="chart-nav">
            <button id="pPrev" type="button" class="navbtn" aria-label="이전 기간 보기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="pLabel" class="p-label">—</span>
            <button id="pNext" type="button" class="navbtn" aria-label="다음 기간 보기">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>

          <div id="chartWrap"></div>
          <div id="legendType" class="legend"></div>
          <p class="chart-note" id="chartNote">—</p>
        </div>
      </section>

      <!-- 최근 시험 점수 -->
      <section id="typeSection" class="grid-col">
        <div class="section-heading">RECENT</div>
        <div class="section-card">
          <div class="section-header" style="margin-bottom:.8rem">
            <span class="section-title">최근 시험 점수</span>
          </div>

          <div class="type-grid">
            <div class="type-item">
              <span class="type-chip" style="background:#E7F6EC;color:#15803D">OX</span>
              <div class="type-body">
                <p class="type-score" id="tOx">—</p>
                <p class="type-note" id="tOxNote">—</p>
              </div>
            </div>
            <div class="type-item">
              <span class="type-chip" style="background:#E4EBFB;color:#1D4ED8">사지선다</span>
              <div class="type-body">
                <p class="type-score" id="tMulti">—</p>
                <p class="type-note" id="tMultiNote">—</p>
              </div>
            </div>
            <div class="type-item">
              <span class="type-chip" style="background:#FDEEE3;color:#C2410C">마스터</span>
              <div class="type-body">
                <p class="type-score" id="tMaster">—</p>
                <p class="type-note" id="tMasterNote">—</p>
              </div>
            </div>
          </div>

          <p id="typeAdvice" class="type-advice"></p>
        </div>
      </section>

    </div>

    <!-- 시험 기록 -->
    <section style="margin-top:1.6rem">
      <div class="section-heading">RECORDS</div>
      <div class="section-header" style="margin-bottom:.7rem">
        <span class="section-title">시험 기록</span>
        <span id="listCount" class="section-count"></span>
      </div>
      <div class="list-card">
        <ul id="examList" class="exam-list"></ul>
        <div id="listPager" class="pager hidden">
          <button id="lPrev" type="button" class="pagebtn">이전</button>
          <span id="lPage" class="page-num">1 / 1</span>
          <button id="lNext" type="button" class="pagebtn">다음</button>
        </div>
      </div>
    </section>

    <p class="foot-note" id="updatedAt">—</p>
  </div>
</div>

<script>
(function(){
  var n=new Date(),days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  var a=document.getElementById('today-date'),b=document.getElementById('today-day');
  if(a)a.textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일';
  if(b)b.textContent=days[n.getDay()];
})();
</script>

<script type="module">

const firebaseConfig = {

  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.firebasestorage.app",
  messagingSenderId: "650652155367",
  appId: "1:650652155367:web:41d2958e675cb4edd4d142"
};

/* ── 색 설정 ─────────────────────────────────────────────
   기본은 #004AAD 와 회색이고, 색은 데이터에만 씁니다.      */
const UP_COLOR   = "#15803D";   // 점수가 올랐을 때
const FLAT_COLOR = "#667085";   // 동점 · 하락 (지적하지 않습니다)
const INK        = "#101828";

const BANDS = [
  { min: 90, color: "#15803D", label: "90점 이상" },
  { min: 75, color: "#1D4ED8", label: "75~89점" },
  { min: 60, color: "#C2410C", label: "60~74점" },
  { min: -1, color: "#B91C1C", label: "60점 미만" }
];
const bandOf = (v) => BANDS.find((b) => v >= b.min) || BANDS[BANDS.length - 1];

/* 유형별 색 · 점 모양 · 정렬 순서
   색은 뚜렷하게 갈리는 네 가지를 쓰고, 점 모양까지 달리해
   색을 구분하기 어려운 화면에서도 유형이 보이게 했습니다.   */
const TYPE_STYLE = {
  ox:     { label: "OX",      bg: "#E7F6EC", fg: "#15803D", line: "#16A34A", shape: "circle",   order: 1 },
  multi:  { label: "사지선다", bg: "#E4EBFB", fg: "#1D4ED8", line: "#2563EB", shape: "square",   order: 2 },
  master: { label: "마스터",   bg: "#FDEEE3", fg: "#C2410C", line: "#EA580C", shape: "diamond",  order: 3 },
  total:  { label: "시험",     bg: "#FCE9E9", fg: "#B91C1C", line: "#DC2626", shape: "triangle", order: 4 }
};

/* 점 모양을 그립니다 */
function markerSvg(shape, cx, cy, r, fill, stroke, sw) {
  const a = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  if (shape === "square")
    return `<rect x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" rx="1" ${a}/>`;
  if (shape === "diamond")
    return `<polygon points="${cx},${cy - r * 1.3} ${cx + r * 1.3},${cy} ${cx},${cy + r * 1.3} ${cx - r * 1.3},${cy}" ${a}/>`;
  if (shape === "triangle")
    return `<polygon points="${cx},${cy - r * 1.35} ${cx + r * 1.25},${cy + r * 0.92} ${cx - r * 1.25},${cy + r * 0.92}" ${a}/>`;
  return `<circle cx="${cx}" cy="${cy}" r="${r}" ${a}/>`;
}
const styleOf = (k) => TYPE_STYLE[k] || TYPE_STYLE.total;

const PER_PAGE = 10;   // 시험 기록 한 페이지에 보여줄 개수

const $ = (id) => document.getElementById(id);
const showError = (m) => {
  $("loading").classList.add("hidden");
  $("errorView").classList.remove("hidden");
  if (m) $("errorMsg").textContent = m;
};
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const r1 = (n) => Math.round(Number(n) * 10) / 10;
const n0 = (x) => (x === null || x === undefined || x === "" || isNaN(Number(x)) ? null : Number(x));
const pick = (...xs) => { for (const x of xs) if (x !== null && x !== undefined) return x; return null; };
const isNum = (x) => x !== null && x !== undefined && isFinite(Number(x));

function fmtDate(r) {
  if (r && typeof r.ts === "number" && isFinite(r.ts)) {
    const d = new Date(r.ts);
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
  }
  return r && r.date ? String(r.date) : "";
}

/* 점수와 문항 수로 맞은 개수를 역산합니다 */
function calcCorrect(score, total) {
  if (score === null || total === null || total <= 0) return null;
  return Math.round((score / 100) * total);
}

/* ── 한 회차가 어떤 유형을 포함하는지 판별합니다 ─────────── */
function splitParts(r) {
  const out = {};

  if (r.master) {
    const total = pick(r.total, r.totalQuestions);
    out.master = {
      score: r.score,
      total: total,
      correct: pick(r.totalCorrect, r.correct, r.correctCount, calcCorrect(r.score, total))
    };
    return out;
  }

  const oxc = n0(r.oxCount), muc = n0(r.multiCount), tq = n0(r.totalQuestions);
  const subs = Array.isArray(r.subTypes) ? r.subTypes.map((s) => String(s).toLowerCase()) : [];

  let oxDone = null, muDone = null;

  // 1순위: 문항 수 합이 딱 맞으면 어느 쪽을 풀었는지 확실합니다
  if (tq !== null && oxc !== null && muc !== null) {
    if (tq === oxc + muc) { oxDone = true; muDone = true; }
    else if (tq === oxc)  { oxDone = true; muDone = false; }
    else if (tq === muc)  { oxDone = false; muDone = true; }
  }
  // 2순위: 완료 표시나 정답 개수가 있으면 푼 것입니다
  if (oxDone === null) oxDone = r.oxDone === true || n0(r.oxCorrect) !== null
                             || (n0(r.oxScore) !== null && n0(r.oxScore) > 0) || subs.includes("ox");
  if (muDone === null) muDone = r.multiDone === true || n0(r.multiCorrect) !== null
                             || (n0(r.multiScore) !== null && n0(r.multiScore) > 0)
                             || subs.includes("multiple") || subs.includes("multi");

  if (oxDone && n0(r.oxScore) !== null) {
    out.ox = { score: n0(r.oxScore), total: oxc,
               correct: pick(n0(r.oxCorrect), calcCorrect(n0(r.oxScore), oxc)) };
  }
  if (muDone && n0(r.multiScore) !== null) {
    out.multi = { score: n0(r.multiScore), total: muc,
                  correct: pick(n0(r.multiCorrect), calcCorrect(n0(r.multiScore), muc)) };
  }
  return out;
}

/* ── 회차를 유형 단위로 쪼갭니다 ─────────────────────────
   OX 와 사지선다를 함께 본 회차는 두 줄로 나뉩니다.        */
function buildEntries(rows) {
  const list = [];
  rows.forEach((r) => {
    const parts = r.parts || {};
    let keys = Object.keys(parts).filter((k) => parts[k] && isNum(parts[k].score));

    // 유형을 알 수 없는 회차는 전체 점수 한 줄로 남깁니다
    if (!keys.length) {
      parts.total = { score: r.score, total: r.allTotal, correct: r.allCorrect };
      keys = ["total"];
    }

    keys.forEach((k) => {
      const p = parts[k];
      list.push({
        type: k,
        examId: r.examId,
        testName: r.testName,
        score: Number(p.score),
        total: n0(p.total),
        correct: n0(p.correct),
        ts: r.ts,
        fullDate: r.fullDate,
        shortDate: r.shortDate
      });
    });
  });

  list.sort((a, b) => {
    const d = (a.ts || 0) - (b.ts || 0);
    if (d !== 0) return d;
    return styleOf(a.type).order - styleOf(b.type).order;
  });
  return list;
}

/* ── 기간 나누기 ─────────────────────────────────────────
   이번 달이 끝이 되도록 잡습니다. 8월이고 3개월이면
   6월 1일 ~ 오늘 이 가장 최근 화면이고, 그 앞은 3~5월입니다. */
function buildPeriodsMonthly(entries, months) {
  const dated = entries.filter((e) => isNum(e.ts));
  if (!dated.length) return [];

  let minT = dated[0].ts;
  dated.forEach((e) => { if (e.ts < minT) minT = e.ts; });

  const now = new Date();
  const Y = now.getFullYear(), M = now.getMonth();
  const today = now.getTime();

  const out = [];
  for (let k = 0; k < 400; k++) {
    const sMonth = M - (months - 1) - months * k;   // 이 화면의 첫 달
    const eMonth = M - months * k;                  // 이 화면의 마지막 달
    const start = new Date(Y, sMonth, 1).getTime();
    const end = k === 0 ? today : new Date(Y, eMonth + 1, 1).getTime() - 1;

    const items = dated.filter((x) => x.ts >= start && x.ts <= end);
    if (items.length) {
      const sd = new Date(start), ed = new Date(end);
      const label = sd.getFullYear() === ed.getFullYear()
        ? `${sd.getFullYear()}년 ${sd.getMonth() + 1}~${ed.getMonth() + 1}월`
        : `${sd.getFullYear()}년 ${sd.getMonth() + 1}월 ~ ${ed.getFullYear()}년 ${ed.getMonth() + 1}월`;
      out.push({ key: -k, label, start, end, items });
    }
    if (start <= minT) break;
  }
  return out.reverse();
}

function buildPeriodAll(entries) {
  const dated = entries.filter((e) => isNum(e.ts));
  if (!dated.length) return [];
  let maxT = dated[0].ts, minT = dated[0].ts;
  dated.forEach((e) => { if (e.ts > maxT) maxT = e.ts; if (e.ts < minT) minT = e.ts; });
  const pad = Math.max((maxT - minT) * 0.04, 864e5 * 3);
  return [{ key: 0, label: "전체 기간", start: minT - pad, end: maxT + pad, items: dated }];
}

/* ── 앞뒤 기간에서 이어 그릴 기록을 찾습니다 ─────────────
   dir 이 -1 이면 그 시각 바로 앞, +1 이면 바로 뒤 기록입니다. */
function neighborOf(type, ts, dir) {
  let found = null;
  for (const e of allEntries) {
    if (e.type !== type || !isNum(e.ts)) continue;
    if (dir < 0 && e.ts < ts) found = e;               // 계속 갱신 → 가장 가까운 앞 기록
    if (dir > 0 && e.ts > ts) { found = e; break; }    // 처음 만나는 뒤 기록
  }
  return found;
}

/* ── 꺾은선 차트 ─────────────────────────────────────────
   x축은 그 기간 전체를 그대로 씁니다. 기간 밖의 앞뒤 기록까지
   이어 그린 뒤 가장자리에서 잘라내기 때문에, 선이 중간에 뚝
   끊기지 않고 계속 흘러가는 것처럼 보입니다.                */
function drawChart(period) {
  const wrap = $("chartWrap");
  const pts = ((period && period.items) || []).filter((e) => isNum(e.ts));

  if (!pts.length) {
    wrap.innerHTML = '<p class="chart-empty">이 기간에는 기록이 없습니다.</p>';
    return [];
  }

  const W = 640, H = 236, PL = 36, PR = 16, PT = 26, PB = 34;
  const gx0 = PL, gx1 = W - PR;
  const x0 = PL + 10, x1 = W - PR - 10;
  const ih = H - PT - PB;

  let dMin = period.start, dMax = period.end;
  if (!isNum(dMin) || !isNum(dMax) || dMax <= dMin) {
    dMin = pts[0].ts; dMax = pts[0].ts;
    pts.forEach((p) => { if (p.ts < dMin) dMin = p.ts; if (p.ts > dMax) dMax = p.ts; });
  }
  const dSpan = dMax - dMin;

  const X = (t) => (dSpan > 0 ? x0 + (x1 - x0) * ((t - dMin) / dSpan) : (x0 + x1) / 2);
  // 기간 밖 기록은 화면 밖 좌표로 보냅니다 (잘라내기로 가려집니다)
  const Xo = (t) => {
    if (dSpan <= 0) return t < dMin ? gx0 - 40 : (t > dMax ? gx1 + 40 : (x0 + x1) / 2);
    return Math.max(gx0 - 1200, Math.min(gx1 + 1200, X(t)));
  };
  const Y = (v) => PT + ih - (ih * Math.max(0, Math.min(100, Number(v)))) / 100;

  let grid = "";
  [0, 25, 50, 75, 100].forEach((v) => {
    grid += `<line x1="${gx0}" y1="${Y(v)}" x2="${gx1}" y2="${Y(v)}" stroke="#EBEEF3" stroke-width="1"/>`;
    grid += `<text x="${gx0 - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="10.5" fill="#98A2B3">${v}</text>`;
  });

  /* 달 구분 — 어느 달 구간인지 바로 읽히도록 세로선과 이름을 넣습니다 */
  let months = [];
  {
    let c = new Date(new Date(dMin).getFullYear(), new Date(dMin).getMonth(), 1);
    while (c.getTime() < dMax && months.length < 400) {
      const nxt = new Date(c.getFullYear(), c.getMonth() + 1, 1);
      const s = Math.max(c.getTime(), dMin), e = Math.min(nxt.getTime(), dMax);
      if (e > s) months.push({ s, e, d: new Date(c) });
      c = nxt;
    }
  }
  const mStep = Math.max(1, Math.ceil(months.length / 8));
  let mAxis = "";
  months.forEach((m, i) => {
    if (i > 0 && m.s > dMin) {
      mAxis += `<line x1="${X(m.s)}" y1="${PT}" x2="${X(m.s)}" y2="${PT + ih}" stroke="#F1F3F7" stroke-width="1"/>`;
    }
    if (i % mStep !== 0 && i !== months.length - 1) return;
    const mid = (X(m.s) + X(m.e)) / 2;
    const txt = m.d.getMonth() === 0 ? `${m.d.getFullYear()}. 1월` : `${m.d.getMonth() + 1}월`;
    mAxis += `<text x="${mid}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#98A2B3">${txt}</text>`;
  });

  // 유형별로 묶습니다 (pts 는 이미 날짜순입니다)
  const groups = new Map();
  pts.forEach((p) => { if (!groups.has(p.type)) groups.set(p.type, []); groups.get(p.type).push(p); });
  const types = Array.from(groups.keys()).sort((a, b) => styleOf(a).order - styleOf(b).order);

  let lines = "", dots = "", marks = "";
  const placed = [];

  types.forEach((t) => {
    const g = groups.get(t);
    const col = styleOf(t).line;
    const shape = styleOf(t).shape;

    // 앞뒤 기간의 이웃 기록을 붙여 선을 잇습니다
    const seq = [];
    const before = neighborOf(t, g[0].ts, -1);
    if (before) seq.push(before);
    seq.push.apply(seq, g);
    const after = neighborOf(t, g[g.length - 1].ts, 1);
    if (after) seq.push(after);

    if (seq.length >= 2) {
      lines += `<polyline points="${seq.map((p) => `${Xo(p.ts)},${Y(p.score)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    g.forEach((p, i) => {
      const last = i === g.length - 1;
      const cx = X(p.ts), cy = Y(p.score);

      // 회차마다 점을 찍되, 속을 색으로 꽉 채운 작은 점으로 그립니다
      dots += markerSvg(shape, cx, cy, last ? 3.2 : 2.4, col, col, 0);

      if (last) {
        // 마지막 점수는 겹치지 않는 자리에 적습니다
        const cands = [cy - 11, cy + 17, cy - 26, cy + 32];
        let ly = cands.find((c) => c > PT + 6 && c < H - PB + 4
          && !placed.some((q) => Math.abs(q.x - cx) < 36 && Math.abs(q.y - c) < 13));
        if (ly === undefined) ly = cy - 13;
        placed.push({ x: cx, y: ly });
        marks += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="${col}">${r1(p.score)}</text>`;
      }
    });
  });

  wrap.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="시험 점수 분포도">
      <defs>
        <clipPath id="plotClip">
          <rect x="${gx0 - 1}" y="${PT - 18}" width="${gx1 - gx0 + 2}" height="${ih + 26}"/>
        </clipPath>
      </defs>
      ${mAxis}${grid}
      <g clip-path="url(#plotClip)">${lines}</g>
      ${dots}${marks}
    </svg>`;

  return types;
}

function drawLegend(types) {
  $("legendType").innerHTML = (types || []).map((t) => {
    const st = styleOf(t);
    return `<span class="legend-item" style="color:${st.fg}">
              <svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true">
                <line x1="1" y1="6" x2="25" y2="6" stroke="${st.line}" stroke-width="1.9" stroke-linecap="round"/>
                ${markerSvg(st.shape, 13, 6, 3, st.line, st.line, 0)}
              </svg>${esc(st.label)}
            </span>`;
  }).join("");
}

/* ── 화면 상태 ─────────────────────────────────────────── */
let allEntries = [];
let months = 3;          // 3 | 6 | 0(전체)
let periods = [];
let pIdx = 0;
let listItems = [];      // 최신순
let lPage = 0;

function paintSegs() {
  $("r3").className   = months === 3 ? "seg-btn on" : "seg-btn";
  $("r6").className   = months === 6 ? "seg-btn on" : "seg-btn";
  $("rAll").className = months === 0 ? "seg-btn on" : "seg-btn";
  [["r3", months === 3], ["r6", months === 6], ["rAll", months === 0]]
    .forEach(([id, on]) => $(id).setAttribute("aria-pressed", String(on)));
}

function rebuild() {
  periods = months === 0 ? buildPeriodAll(allEntries) : buildPeriodsMonthly(allEntries, months);
  pIdx = Math.max(0, periods.length - 1);
  paintSegs();
  renderPeriod();
}

function renderPeriod() {
  if (!periods.length) {
    $("chartWrap").innerHTML = '<p class="chart-empty">아직 기록이 없습니다.</p>';
    $("pLabel").textContent = "—";
    $("pPrev").disabled = true;
    $("pNext").disabled = true;
    drawLegend([]);
    $("chartNote").textContent = "";
    return;
  }
  const p = periods[pIdx];
  $("pLabel").textContent = p.label;
  $("pPrev").disabled = pIdx <= 0;
  $("pNext").disabled = pIdx >= periods.length - 1;

  const types = drawChart(p);
  drawLegend(types);

  const how = months === 0
    ? "지금까지의 기록을 한 화면에 모았습니다."
    : `이번 달까지 ${months}개월씩 끊어 보여 드립니다.`;
  const link = months === 0 ? "" : " 선은 앞뒤 기간까지 이어집니다.";
  $("chartNote").textContent =
    `${how} 이 화면에는 ${p.items.length}개의 기록이 있습니다.${link} 선의 색과 점 모양으로 유형을 구분합니다.`;
}

function renderList() {
  const totalPages = Math.max(1, Math.ceil(listItems.length / PER_PAGE));
  if (lPage > totalPages - 1) lPage = totalPages - 1;
  if (lPage < 0) lPage = 0;

  const slice = listItems.slice(lPage * PER_PAGE, lPage * PER_PAGE + PER_PAGE);

  if (!slice.length) {
    $("examList").innerHTML = '<li class="exam-empty">기록이 없습니다.</li>';
  } else {
    $("examList").innerHTML = slice.map((e) => {
      const st = styleOf(e.type);
      const chip = `<span class="type-chip" style="background:${st.bg};color:${st.fg}">${esc(st.label)}</span>`;
      const detail = e.total ? `${e.total}문항` : "";
      const meta = [e.fullDate, detail].filter(Boolean).map(esc).join(" · ");
      const c = bandOf(e.score).color;

      return `<li class="exam-item">
        ${chip}
        <span class="exam-name">${esc(e.testName)}</span>
        <span class="exam-meta">${meta}</span>
        <span class="exam-score" style="color:${c}">${r1(e.score)}점</span>
      </li>`;
    }).join("");
  }

  const pager = $("listPager");
  if (listItems.length > PER_PAGE) {
    pager.classList.remove("hidden");
    $("lPage").textContent = `${lPage + 1} / ${totalPages}`;
    $("lPrev").disabled = lPage <= 0;
    $("lNext").disabled = lPage >= totalPages - 1;
  } else {
    pager.classList.add("hidden");
  }
}

$("r3").addEventListener("click",   () => { if (months !== 3) { months = 3; rebuild(); } });
$("r6").addEventListener("click",   () => { if (months !== 6) { months = 6; rebuild(); } });
$("rAll").addEventListener("click", () => { if (months !== 0) { months = 0; rebuild(); } });

$("pPrev").addEventListener("click", () => { if (pIdx > 0) { pIdx--; renderPeriod(); } });
$("pNext").addEventListener("click", () => { if (pIdx < periods.length - 1) { pIdx++; renderPeriod(); } });
$("lPrev").addEventListener("click", () => {
  if (lPage > 0) { lPage--; renderList(); $("examList").scrollIntoView({ block: "start", behavior: "smooth" }); }
});
$("lNext").addEventListener("click", () => {
  if (lPage < Math.ceil(listItems.length / PER_PAGE) - 1) { lPage++; renderList(); $("examList").scrollIntoView({ block: "start", behavior: "smooth" }); }
});

/* ── 화면 그리기 ───────────────────────────────────────── */
function render(p) {
  $("hName").textContent = p.name || "학생";
  const sub = [p.grade, p.subject].filter(Boolean).join(" · ");
  $("hSub").textContent = sub || "안녕하세요";
  const badge = [p.name, p.grade].filter(Boolean).join(" · ");
  if (badge) { $("hBadge").textContent = badge; $("hBadge").classList.remove("hidden"); }

  const rows = (Array.isArray(p.results) ? p.results.slice() : [])
    .filter((r) => r && isFinite(Number(r.score)))
    .map((r) => ({
      examId: r.examId || "",
      testName: r.testName || "시험",
      score: Number(r.score),
      master: r.master === true,
      subTypes: Array.isArray(r.subTypes) ? r.subTypes : [],
      oxScore: n0(r.oxScore), oxCount: n0(r.oxCount), oxCorrect: n0(r.oxCorrect), oxDone: r.oxDone === true,
      multiScore: n0(r.multiScore), multiCount: n0(r.multiCount), multiCorrect: n0(r.multiCorrect), multiDone: r.multiDone === true,
      correctCount: n0(r.correctCount), totalQuestions: n0(r.totalQuestions),
      totalCorrect: n0(r.totalCorrect), total: n0(r.total), correct: n0(r.correct),
      ts: n0(r.ts), date: r.date || ""
    }))
    .sort((a, b) => (a.ts || 0) - (b.ts || 0));

  rows.forEach((r) => {
    const d = isNum(r.ts) ? new Date(r.ts) : null;
    r.shortDate = d ? `${d.getMonth() + 1}/${d.getDate()}` : "";
    r.fullDate = fmtDate(r);
    r.parts = splitParts(r);

    const partSum = Object.values(r.parts).reduce((a, x) => a + (x.correct || 0), 0);
    const partTot = Object.values(r.parts).reduce((a, x) => a + (x.total || 0), 0);
    r.allTotal = pick(r.totalQuestions, r.total, partTot || null);
    r.allCorrect = pick(r.correctCount, r.totalCorrect, r.correct,
                        partSum || null, calcCorrect(r.score, r.allTotal));
  });

  const entries = buildEntries(rows);
  allEntries = entries;

  if (!entries.length) {
    $("sLatest").textContent = "—";
    $("sDelta").textContent = "—";
    $("sBest").textContent = "—";
    $("sLatestNote").textContent = "";
    $("sDeltaNote").textContent = "";
    $("sBestNote").textContent = "";
    $("msgText").textContent = "아직 등록된 시험 기록이 없어요. 첫 시험을 보고 나면 여기에 점수가 쌓입니다.";
    $("chartSection").classList.add("hidden");
    $("typeSection").classList.add("hidden");
    $("listCount").textContent = "";
    listItems = [];
    renderList();
    finish(p);
    return;
  }

  const latest = entries[entries.length - 1];
  const latestStyle = styleOf(latest.type);

  // 같은 유형의 바로 이전 기록과 비교합니다
  let prevSame = null;
  for (let i = entries.length - 2; i >= 0; i--) {
    if (entries[i].type === latest.type) { prevSame = entries[i]; break; }
  }
  const best = entries.reduce((a, b) => (b.score > a.score ? b : a), entries[0]);

  $("sLatest").textContent = r1(latest.score) + "점";
  $("sLatest").style.color = bandOf(latest.score).color;
  $("sLatestNote").textContent = [latestStyle.label, latest.shortDate].filter(Boolean).join(" · ");

  $("sBest").textContent = r1(best.score) + "점";
  $("sBest").style.color = bandOf(best.score).color;
  $("sBestNote").textContent = [styleOf(best.type).label, best.shortDate].filter(Boolean).join(" · ");

  const dEl = $("sDelta");
  if (!prevSame) {
    dEl.textContent = "첫 회차";
    dEl.style.color = INK;
    $("sDeltaNote").textContent = `${latestStyle.label} 첫 기록`;
  } else {
    const diff = r1(latest.score - prevSame.score);
    if (diff > 0) { dEl.textContent = "+" + diff + "점"; dEl.style.color = UP_COLOR; }
    else if (diff < 0) { dEl.textContent = diff + "점"; dEl.style.color = FLAT_COLOR; }
    else { dEl.textContent = "동점"; dEl.style.color = FLAT_COLOR; }
    $("sDeltaNote").textContent = `${latestStyle.label} 기준`;
  }

  // 응원 문구 — 하락을 지적하지 않고 다음 행동으로 연결합니다.
  const tl = latestStyle.label;
  let msg;
  if (!prevSame) msg = `${tl} 유형의 첫 기록이 등록되었어요. 회차가 쌓이면 변화가 한눈에 보입니다.`;
  else if (latest.score > prevSame.score) msg = `지난 ${tl} 회차보다 ${r1(latest.score - prevSame.score)}점 올랐어요. 지금 방식이 잘 맞고 있다는 뜻입니다.`;
  else if (latest.score === prevSame.score) msg = `지난 ${tl} 회차와 같은 점수를 유지했어요. 틀린 문제 유형만 확인해 보면 다음에 올릴 수 있습니다.`;
  else msg = `이번 ${tl} 회차는 지난번보다 조금 내려갔어요. 아래 유형별 점수를 보고 약한 쪽부터 다시 보면 됩니다.`;
  if (entries.length >= 2 && latest.score >= best.score) msg = "지금까지 중 가장 높은 점수예요. 잘하고 있습니다.";
  $("msgText").textContent = msg;

  // 그래프 — 이번 달 기준 3개월로 시작합니다
  rebuild();

  /* 유형별 최근 성적 */
  const latestOf = (key) => {
    for (let i = entries.length - 1; i >= 0; i--) if (entries[i].type === key) return entries[i];
    return null;
  };

  const fill = (key, scoreId, noteId) => {
    const e = latestOf(key);
    if (!e) {
      $(scoreId).textContent = "—";
      $(scoreId).style.color = "#C4C9D2";
      $(noteId).textContent = "아직 기록 없음";
      return null;
    }
    $(scoreId).textContent = r1(e.score) + "점";
    $(scoreId).style.color = bandOf(e.score).color;
    const bits = [];
    if (isNum(e.correct) && e.total) bits.push(`${e.correct}/${e.total}문항`);
    if (e.shortDate) bits.push(e.shortDate);
    $(noteId).textContent = bits.join(" · ") || "기록됨";
    return e;
  };

  const fOx = fill("ox", "tOx", "tOxNote");
  const fMu = fill("multi", "tMulti", "tMultiNote");
  fill("master", "tMaster", "tMasterNote");

  let advice = "";
  if (fOx && fMu) {
    const gap = r1(Math.abs(fOx.score - fMu.score));
    if (gap >= 15) advice = fOx.score > fMu.score
      ? "사지선다가 OX보다 낮아요. 개념은 잡혀 있으니 보기를 비교하는 연습을 늘리면 좋습니다."
      : "OX가 사지선다보다 낮아요. 헷갈리는 개념의 정의를 다시 정리해 보면 좋습니다.";
    else advice = "두 유형의 점수 차이가 크지 않아요. 고르게 준비되어 있습니다.";
  }
  $("typeAdvice").textContent = advice;

  /* 시험 기록 — 최신순, 10개씩 */
  listItems = entries.slice().reverse();
  lPage = 0;
  $("listCount").textContent = `모두 ${listItems.length}건`;
  renderList();

  finish(p);
}

function finish(p) {
  let t = "";
  if (p.updatedAt && typeof p.updatedAt.toDate === "function") {
    const d = p.updatedAt.toDate();
    t = `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}. 기준`;
  }
  $("updatedAt").textContent = t || "";
  $("loading").classList.add("hidden");
  $("app").classList.remove("hidden");
}
