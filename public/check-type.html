<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>시험 유형 확인 · 인후쌤 과학수업</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{--ink:#16263F;--line:#E2E8F0;--accent:#4C5FA8}
  *{box-sizing:border-box}
  body{margin:0;background:#F8FAFC;color:var(--ink);
       font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
       letter-spacing:-.02em;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px calc(env(safe-area-inset-bottom) + 60px)}
  h1{font-size:19px;font-weight:800;letter-spacing:-.035em;margin:0}
  .lead{margin:8px 0 0;font-size:14px;line-height:1.65;color:#64748B}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
        font-size:16px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--accent);
         color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
         min-height:48px;touch-action:manipulation}
  button:disabled{opacity:.5}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
  pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;line-height:1.75;margin:0;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#0F172A}
  .hint{margin:10px 0 0;font-size:12.5px;color:#94A3B8;line-height:1.6}
  .err{color:#B91C1C}
</style>
</head>
<body>
<div class="wrap">
  <h1>시험 유형 확인</h1>
  <p class="lead">이 페이지는 데이터를 읽기만 합니다. 아무것도 바꾸거나 지우지 않습니다.<br />
     확인이 끝나면 파일을 지우셔도 됩니다.</p>

  <div class="card">
    <label for="em" style="font-size:13px;font-weight:600;color:#475569">관리자 이메일</label>
    <input id="em" type="email" autocomplete="username" value="harpy7777@naver.com" style="margin-top:6px" />
    <label for="pw" style="display:block;margin-top:12px;font-size:13px;font-weight:600;color:#475569">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" style="margin-top:6px" />
    <button id="go">확인하기</button>
    <p class="hint">로그인 정보는 이 페이지 밖으로 나가지 않습니다.</p>
  </div>

  <div class="card" id="out" style="display:none">
    <pre id="txt"></pre>
    <button class="ghost" id="copy" style="margin-top:16px">결과 전체 복사</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5MQx_rXO_xRYelyKxK090TaKa3Gg2D3k",
  authDomain: "beta-science.firebaseapp.com",
  projectId: "beta-science",
  storageBucket: "beta-science.firebasestorage.app",
  messagingSenderId: "650652155367",
  appId: "1:650652155367:web:41d2958e675cb4edd4d142"
};

const $ = (id) => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 값의 종류와 빈도를 세는 도우미 */
function tally(list){
  const m = new Map();
  for (const v of list){
    const k = (v === undefined) ? "(필드 없음)"
            : (v === null) ? "(null)"
            : Array.isArray(v) ? "[" + v.join(", ") + "]"
            : String(v);
    m.set(k, (m.get(k) || 0) + 1);
  }
  return Array.from(m.entries())
    .sort((a,b) => b[1] - a[1])
    .map(([k,c]) => `    ${k}  →  ${c}건`)
    .join("\n") || "    (값 없음)";
}

function short(v){
  if (v === undefined) return "(필드 없음)";
  if (v === null) return "(null)";
  if (Array.isArray(v)) return "[" + v.slice(0,6).join(", ") + (v.length>6?", …":"") + "]";
  if (v && typeof v.toDate === "function") { try { return v.toDate().toISOString().slice(0,10); } catch(e){ return "(시각)"; } }
  if (typeof v === "object") return JSON.stringify(v).slice(0,60);
  const s = String(v);
  return s.length > 60 ? s.slice(0,60) + "…" : s;
}

$("go").addEventListener("click", async () => {
  const btn = $("go");
  btn.disabled = true;
  $("out").style.display = "block";
  $("txt").className = "";
  $("txt").textContent = "확인하는 중입니다…";

  try {
    await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value);
    const snap = await getDocs(collection(db, "grades"));

    const docs = [];
    snap.forEach((d) => docs.push({ id: d.id, v: d.data() || {} }));

    const L = [];
    L.push(`grades 문서 총 ${docs.length}건`);
    L.push("");

    if (!docs.length){
      L.push("문서가 없거나 읽기 권한이 없습니다.");
      $("txt").textContent = L.join("\n");
      btn.disabled = false;
      return;
    }

    /* 유형을 담고 있을 만한 필드들을 전부 훑습니다 */
    const typeFields = ["testType","subTypes","lastSubType","category","type","examType","kind","mode","subType"];
    L.push("── 유형 관련 필드에 실제로 들어 있는 값 ──");
    for (const f of typeFields){
      const vals = docs.map(d => d.v[f]);
      const has = vals.some(v => v !== undefined);
      if (!has) continue;
      L.push(`  ${f}`);
      L.push(tally(vals));
      L.push("");
    }

    /* 문항 수·정답 수 관련 필드가 실제로 채워져 있는지 */
    L.push("── 문항 수 / 정답 수 필드가 채워진 비율 ──");
    const countFields = ["totalQuestions","correctCount","totalCorrect","total",
                         "oxCount","oxCorrect","oxScore","multiCount","multiCorrect","multiScore",
                         "answeredCount","score"];
    for (const f of countFields){
      const filled = docs.filter(d => d.v[f] !== undefined && d.v[f] !== null && d.v[f] !== "").length;
      L.push(`  ${f.padEnd(16)} ${filled} / ${docs.length}건`);
    }
    L.push("");

    /* 실제 문서 3개를 통째로 보여줍니다 */
    L.push("── 실제 문서 3건 (전체 필드) ──");
    const pick = [docs[0], docs[Math.floor(docs.length/2)], docs[docs.length-1]];
    pick.forEach((d, i) => {
      L.push(`  [${i+1}] 문서ID: ${d.id}`);
      Object.keys(d.v).sort().forEach(k => {
        L.push(`      ${k}: ${short(d.v[k])}`);
      });
      L.push("");
    });

    $("txt").textContent = L.join("\n");
  } catch (e) {
    console.error(e);
    $("txt").className = "err";
    $("txt").textContent = (e && e.code === "auth/invalid-credential")
      ? "이메일 또는 비밀번호가 맞지 않습니다."
      : "확인하지 못했습니다: " + ((e && e.code) || (e && e.message) || "알 수 없는 오류");
  } finally {
    btn.disabled = false;
  }
});

$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("txt").textContent); $("copy").textContent = "복사했습니다"; }
  catch { window.prompt("아래 내용을 복사하세요", $("txt").textContent); }
  setTimeout(() => { $("copy").textContent = "결과 전체 복사"; }, 1800);
});

$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
</script>
</body>
</html>
