  <!-- Open Graph / 카카오톡·소셜 링크 미리보기 -->

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="우리 아이 과학 학습 리포트" />
<meta name="twitter:description" content="수업 내용과 시험 결과를 한눈에 확인하세요." />

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#ec4899;--pink-lt:#fdf2f8;--pink-dk:#be185d;
  --bg:#f8f4f7;--wh:#fff;--tx:#1e293b;--mt:#94a3b8;--bd:#f0e4ec;
  --r:14px;--ok:#10b981;
  --blue:#3b82f6;--blue-lt:#eff6ff;
  --green:#10b981;--green-lt:#ecfdf5;
  --safe-top:env(safe-area-inset-top);
  --safe-bot:env(safe-area-inset-bottom);
}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
.ls-body,.ls-hw,.ls-fb-tx,.sc-row-val{overflow-wrap:anywhere}

.loading-screen,.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--mt);text-align:center;padding:24px}
.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-screen h2{font-size:20px;color:var(--tx);font-weight:600}
.error-screen p{font-size:14px;line-height:2}
#portalApp{display:none}

/* ══ 데스크탑 헤더 ══ */
.desktop-header{
  background:linear-gradient(135deg,#f472b6 0%,#db2777 100%);
  color:#fff;padding:28px 40px;
  display:flex;flex-direction:column;
}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.dh-bottom{margin-top:14px}
.logo-row-d{display:flex;align-items:center;gap:10px}
.logo-icon-d{width:32px;height:32px;background:rgba(255,255,255,.25);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name-d{font-size:14px;font-weight:500;color:#fff;letter-spacing:-.01em}
.header-divider{width:100%;height:1px;background:rgba(255,255,255,.3);display:block}
.header-label-d{font-size:14px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.student-name-d{font-size:38px;font-weight:700;line-height:1;flex-shrink:0}
.name-row-d{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:4px}
.student-chips-d{display:flex;gap:10px;flex-wrap:nowrap;align-items:center}
.s-chip{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:500;white-space:nowrap}

/* ══ 데스크탑 탭 ══ */
.desktop-tabs{
  background:var(--wh);border-bottom:2px solid var(--bd);
  display:flex;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.d-tab{
  flex:1;padding:16px 6px;font-size:14px;font-weight:600;
  color:var(--mt);cursor:pointer;background:none;border:none;
  font-family:inherit;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;
}
.d-tab.active{color:var(--pink);border-bottom-color:var(--pink)}
.d-tab:hover{color:var(--tx)}
.desktop-body{max-width:1100px;margin:0 auto;padding:32px 40px 60px}

/* ══ 모바일 헤더 ══ */
.mobile-header{
  background:linear-gradient(160deg,#f472b6 0%,#db2777 100%);
  color:#fff;padding:calc(18px + var(--safe-top)) 20px 16px;
  position:relative;overflow:hidden;
}
.mobile-header::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%}
.mh-inner{position:relative;z-index:1}
.mh-top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo-row-m{display:flex;align-items:center;gap:10px}
.logo-icon-m{width:30px;height:30px;background:rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name-m{font-size:13px;font-weight:500;color:#fff;letter-spacing:-.01em}
.header-label-m{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.student-name-m{font-size:26px;font-weight:700;line-height:1;flex-shrink:0}
.name-row-m{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-bottom:4px}
.student-chips-m{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;overflow-x:auto}
.student-chips-m::-webkit-scrollbar{display:none}

/* ══ 모바일 탭 (5칸) ══ */
.mobile-tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--wh);border-top:1px solid var(--bd);
  display:flex;padding-bottom:var(--safe-bot);
  z-index:200;box-shadow:0 -2px 16px rgba(0,0,0,.08);
}
.m-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px 0 7px;
  font-family:inherit;color:var(--mt);cursor:pointer;
  background:none;border:none;transition:color .15s;min-height:54px;
  min-width:0;
}
.m-tab:active{background:var(--pink-lt)}
.m-tab.active{color:var(--pink)}
.m-tab.active .m-tab-icon{transform:translateY(-1px)}
.m-tab-icon{transition:transform .15s;font-size:18px;line-height:1}
.m-tab-lbl{font-size:9px;font-weight:600;white-space:nowrap;letter-spacing:-.02em}
.mobile-body{
  padding:16px 16px 8px;max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}

/* ══ 공통 컴포넌트 ══ */
.section{display:none}
.section.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-row.at4{grid-template-columns:repeat(4,1fr)}
.stat-box{border-radius:14px;padding:15px 10px 16px;text-align:center;border:1px solid #fbcfe8;background:var(--pink-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:84px}
.stat-box.blue{background:var(--blue-lt);border-color:#bfdbfe}
.stat-box.green{background:var(--green-lt);border-color:#6ee7b7}
.stat-lbl{font-size:12px;color:var(--mt);font-weight:600;line-height:1.2;letter-spacing:.01em}
.stat-num{font-size:24px;font-weight:700;color:var(--pink);line-height:1.2;word-break:keep-all}
.stat-box.blue .stat-num{color:var(--blue)}
.stat-box.green .stat-num{color:var(--green)}

.sec-label{font-size:12px;font-weight:600;color:var(--mt);letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--bd)}

.info-card{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:18px 22px}
.info-card p{text-align:center;font-size:14px;color:var(--mt);line-height:1.9;font-weight:400}
.info-card strong{color:var(--tx);font-weight:600}

.ls-fb{margin-top:11px;padding:12px 14px;background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:11px}
.ls-fb+.ls-fb{margin-top:8px}
.ls-fb b{display:block;font-size:11.5px;font-weight:800;color:var(--pink-dk);letter-spacing:.03em;margin-bottom:6px}
.ls-fb-tx{font-size:13.5px;line-height:1.95;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.ls-card.fbonly{border-color:#fbcfe8;background:#fffdfe}

.empty-box{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);text-align:center;padding:56px 24px;color:var(--mt);font-size:14px;line-height:2}
.empty-icon{font-size:48px;margin-bottom:14px}

/* ══ 출결 흐름 ══ */
.at-flow{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:22px}
.at-line{display:flex;flex-wrap:wrap;gap:6px}
.at-line::-webkit-scrollbar{display:none}
.at-dot{min-width:40px;padding:6px 4px;border-radius:10px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.3;border:1.5px solid}
.at-dot .at-d{display:block;font-size:9px;font-weight:700;opacity:.7;margin-top:1px}
.at-wait{font-size:13px;color:var(--mt)}
.at-st-출석{background:var(--green-lt);border-color:#6ee7b7;color:#047857}
.at-st-지각{background:#fffbeb;border-color:#fde68a;color:#b45309}
.at-st-결석{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.at-st-보강{background:var(--blue-lt);border-color:#bfdbfe;color:#1d4ed8}
.at-st-휴강{background:#f3f4f6;border-color:#e5e7eb;color:#6b7280}
/* 같은 날 두 번째 칸(보강)임을 살짝 표시 */
.at-dot.at-pair{box-shadow:0 0 0 2px rgba(59,130,246,.14)}
.at-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:11px;color:var(--mt)}
.at-lg{display:flex;align-items:center;gap:5px}
.at-lg i{width:11px;height:11px;border-radius:4px;display:inline-block;border:1.5px solid}
.at-note{font-size:11.5px;color:var(--mt);line-height:1.75;margin-top:10px;word-break:keep-all}

/* ══ 수업 기록 카드 (최신순) ══ */
.ls-card{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.ls-card.latest{border-color:#fbcfe8;box-shadow:0 2px 12px rgba(236,72,153,.07)}
.ls-card.mk{border-color:#bfdbfe}
.ls-top{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;row-gap:6px}
.ls-date{font-size:14px;font-weight:700;color:var(--tx)}
.ls-badge{font-size:11.5px;font-weight:800;padding:3px 11px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.ls-slot{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
.ls-new{font-size:10.5px;font-weight:800;color:#fff;background:var(--pink);border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.ls-no{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--mt);white-space:nowrap}
.ls-unit{font-size:12px;font-weight:700;color:var(--pink-dk);background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:7px;padding:4px 10px;word-break:keep-all;margin-bottom:9px;display:inline-block}
.ls-body{font-size:13.5px;line-height:1.95;color:#5b6573;white-space:pre-wrap;word-break:break-word}
.ls-body.mute{color:var(--mt)}
.ls-hw{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:13px;line-height:1.9;color:#5b6573;white-space:pre-wrap;word-break:break-word}
.ls-hw b{color:var(--pink-dk);font-weight:700;display:block;margin-bottom:3px;font-size:12px;letter-spacing:.03em}
.ls-more{text-align:center;font-size:12.5px;color:var(--mt);padding:14px 8px 4px;line-height:1.8}

/* ══ 과학 개념 지도 탭 ══ */
.cm-hero{
  background:linear-gradient(135deg,#f472b6 0%,#db2777 55%,#a21caf 100%);
  border-radius:var(--r);padding:20px;color:#fff;margin-bottom:20px;
  position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(219,39,119,.2);
}
.cm-hero::after{content:'';position:absolute;right:-56px;top:-56px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.cm-hero>*{position:relative;z-index:1}
.cm-h-lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.85)}
.cm-h-big{margin-top:8px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cm-h-big b{font-size:2.3rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.cm-h-big span{font-size:15px;font-weight:700}
.cm-h-sub{font-size:12px;color:rgba(255,255,255,.86);margin-top:7px;line-height:1.6;word-break:keep-all}
.cm-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.24);margin-top:14px}
.cm-bar i{display:block;height:100%}
.cm-key{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:11px}
.cm-key span{font-size:11px;font-weight:600;color:rgba(255,255,255,.92);display:flex;align-items:center;gap:5px}
.cm-key i{width:9px;height:9px;border-radius:3px;display:inline-block}
.cm-h-date{font-size:11px;color:rgba(255,255,255,.74);margin-top:14px}

.cm-focus{background:var(--wh);border:1px solid #fbcfe8;border-radius:var(--r);padding:17px 19px;margin-bottom:22px;box-shadow:0 2px 12px rgba(236,72,153,.06)}
.cm-focus .lbl{font-size:11px;font-weight:800;color:var(--pink-dk);letter-spacing:.05em}
.cm-focus h4{font-size:17px;font-weight:800;color:var(--tx);margin-top:7px;letter-spacing:-.01em;line-height:1.4}
.cm-focus p{font-size:13.5px;line-height:1.95;color:#5b6573;margin-top:9px;word-break:keep-all}
.cm-focus p b{color:var(--pink-dk);font-weight:800}
.cm-plan{margin-top:13px;background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.85;color:var(--pink-dk);font-weight:700;word-break:keep-all}
.cm-why{margin-top:10px;font-size:11.5px;color:var(--mt)}

.cm-area{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:6px 18px;margin-bottom:22px}
.cm-arow{padding:13px 0;border-bottom:1px solid #f7f1f5}
.cm-arow:last-child{border-bottom:none}
.cm-ahead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:5px}
.cm-aname{font-size:13.5px;font-weight:700;color:var(--tx)}
.cm-astate{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.cm-anum{margin-left:auto;font-size:11px;color:var(--mt);font-weight:600;white-space:nowrap}
.cm-abar{display:flex;height:7px;border-radius:999px;overflow:hidden;background:#f2edf1;margin-top:9px}
.cm-abar i{display:block;height:100%}

.cm-chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cm-chips::-webkit-scrollbar{display:none}
.cm-chip{
  flex:0 0 auto;font-family:inherit;font-size:12.5px;font-weight:700;
  padding:10px 15px;border-radius:999px;border:1px solid var(--bd);
  background:var(--wh);color:var(--mt);cursor:pointer;min-height:42px;
}
.cm-chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.cm-mapbox{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.cm-mapbox::-webkit-scrollbar{display:none}
.cm-mapbox svg{display:block}
.cm-legend{display:flex;flex-wrap:wrap;gap:9px 12px;margin-top:11px}
.cm-legend span{font-size:11px;color:var(--mt);font-weight:600;display:flex;align-items:center;gap:5px}
.cm-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.07)}
.cm-hint{font-size:11.5px;color:var(--mt);line-height:1.75;margin-top:9px;margin-bottom:24px;word-break:keep-all}

.cm-note{font-size:12px;color:var(--mt);line-height:1.75;margin-bottom:11px;word-break:keep-all}
.cm-tblbox{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.cm-tbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.cm-tbl th{font-size:11px;color:var(--pink-dk);font-weight:700;padding:11px 8px;border-bottom:1px solid var(--bd);background:var(--pink-lt);text-align:center;white-space:nowrap}
.cm-tbl td{padding:11px 8px;border-bottom:1px solid #f7f1f5;text-align:center;vertical-align:middle}
.cm-tbl tr:last-child td{border-bottom:none}
.cm-c-std{width:34%;font-size:11.5px;color:var(--mt);font-weight:600}
.cm-c-name{width:34%;font-weight:600;color:var(--tx);word-break:keep-all}
.cm-c-state{width:32%}
.cm-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block}

.cm-guide{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:0 18px;margin-top:22px}
.cm-guide>summary{
  cursor:pointer;list-style:none;font-size:13px;font-weight:700;color:var(--pink-dk);
  padding:16px 0;display:flex;align-items:center;gap:8px;
}
.cm-guide>summary::-webkit-details-marker{display:none}
.cm-guide>summary::after{content:'▾';margin-left:auto;font-size:12px;color:var(--mt)}
.cm-guide[open]>summary::after{content:'▴'}
.cm-g-lead{font-size:12.5px;line-height:1.9;color:var(--mt);padding-bottom:14px;border-top:1px solid var(--bd);padding-top:14px;word-break:keep-all}
.cm-g-item{padding:14px 0;border-top:1px solid #f7f1f5}
.cm-g-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:4px}
.cm-g-cri{font-size:10.5px;color:var(--mt);font-weight:600}
.cm-g-mean{font-size:13px;line-height:1.9;color:#5b6573;margin-top:9px;word-break:keep-all}
.cm-g-plan{font-size:12.5px;line-height:1.85;color:var(--pink-dk);background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:10px;padding:9px 12px;margin-top:9px;word-break:keep-all}
.cm-g-plan b{font-weight:800}

/* ══ 점수 카드 ══ */
.test-item{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:10px}
.test-head{display:flex;align-items:center;gap:16px;justify-content:space-between}
.score-circle{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sc-high{background:#d1fae5;color:#065f46}.sc-mid{background:#fef9c3;color:#854d0e}.sc-low{background:#fee2e2;color:#991b1b}.sc-none{background:#f5f5f7;color:#6e6e73}
.sc-pct{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.sc-unit{font-size:9.5px;font-weight:700;opacity:.75;line-height:1;letter-spacing:.02em}
.test-info{flex:1;min-width:0}
.sc-rows{display:flex;flex-direction:column;gap:8px}
.sc-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.45}

/* ════════════════════════════════════════════════════════════════
   ★ 슬롯(slot) — 같은 날 본수업과 보강을 따로 담는다
   students 문서의 recentAttendance · recentLessons 항목은
   { d:'2026-08-05', k:'ls'|'mk', s:'출석' } 형태다.
     · ls = 본수업 (출석 · 지각 · 결석 · 휴강)
     · mk = 보강
   k 가 없는 예전 기록은 모두 ls 로 읽는다. (그대로 표시된다)
   같은 날짜에 ls 와 mk 가 모두 있으면 칸도 2개, 카드도 2장 나온다.
════════════════════════════════════════════════════════════════ */
const SLOT_LS='ls',SLOT_MK='mk';
function normSlot(k){return String(k==null?'':k)===SLOT_MK?SLOT_MK:SLOT_LS;}
function slotKey(d,k){return String(d)+'|'+normSlot(k);}
function slotName(k){return normSlot(k)===SLOT_MK?'보강 수업':'본수업';}
function cmpSlot(a,b){return String(a.d).localeCompare(String(b.d))||normSlot(a.k).localeCompare(normSlot(b.k));}

async function loadPortal(sid){
  try{
    const sq=query(collection(db,'students'),where('id','==',sid));
    const ss=await getDocs(sq);
    if(ss.empty){showError();return;}
    const sdoc=ss.docs[0];const student={fireId:sdoc.id,...sdoc.data()};
    ['hNameD','hNameM'].forEach(id=>document.getElementById(id).textContent=student.name||'학생');
    document.title=`${student.name||'학생'} 개별 학습 리포트 - 인후쌤의 과학 수업 관리 시스템`;
    if(student.grade){['hGradeD','hGradeM'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=student.grade;el.style.display='inline';}})}
    if(student.subject&&student.subject!=='-'){['hSubjectD','hSubjectM'].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=student.subject;el.style.display='inline';}})}
    const html=buildSections();
    document.getElementById('desktopContent').innerHTML=html;
    document.getElementById('mobileContent').innerHTML=html;
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('portalApp').style.display='block';
    renderConcept();

  }catch(err){showError();}
}

/* ════════ 선생님 메모 (feedbacks/{학생문서ID}) ════════ */
function fbMillis(v){
  if(v==null)return 0;
  if(typeof v==='number')return v;
  if(typeof v==='object'){
    if(typeof v.toMillis==='function'){try{return v.toMillis();}catch(e){return 0;}}
    if(v.seconds!=null)return v.seconds*1000;
    if(v instanceof Date)return v.getTime();
    return 0;
  }
  const t=Date.parse(v);return isNaN(t)?0:t;
}
function fbDateFromMs(ms){
  if(!ms)return'';
  const d=new Date(ms);if(isNaN(d.getTime()))return'';
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseFbEntries(data){
  if(!data)return[];
  let list=[];
  if(Array.isArray(data.entries)){
    list=data.entries.filter(x=>x&&String(x.text||'').trim()).map((x,i)=>({
      id:String(x.id||('e'+i)),
      text:String(x.text||''),
      date:String(x.date||fbDateFromMs(fbMillis(x.createdAt))),
      createdAt:fbMillis(x.createdAt)
    }));
  }else if(String(data.text||'').trim()){
    const ms=fbMillis(data.updatedAt);
    list=[{id:'legacy-1',text:String(data.text),date:fbDateFromMs(ms),createdAt:ms}];
  }
  return list.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(b.createdAt-a.createdAt));
}
async function fetchFeedback(fireId){
  try{
    const snap=await getDoc(doc(db,'feedbacks',fireId));
    return parseFbEntries(snap.exists()?snap.data():null);
  }catch(err){return[];}
}

/* ════════════════════════════════════════════════════════════════
   ★ 메모를 수업 슬롯에 배정한다 — 2026-08 수정
   ────────────────────────────────────────────────────────────────
   [무엇이 어긋나 있었나]
   예전에는 "메모 날짜보다 앞선 수업 중 가장 가까운 것"에 무조건
   붙였다. 그래서 마지막 수업이 7/31 이면 8/7 에 쓴 메모까지
   7월 31일 카드 속으로 빨려 들어갔다.
   화면에서는 8월 메모가 통째로 7월에 머물러 있는 것처럼 보였고,
   달이 바뀌어도 날짜가 넘어가지 않는 것처럼 느껴졌다.

   [지금 규칙]
   · 같은 날짜에 수업 기록이 있을 때만 그 카드 안에 붙인다.
   · 수업이 없는 날 쓴 메모는 자기 날짜로 된 카드 한 장을 따로 만든다.
     (renderLessons 에서 orphans 로 처리 → 목록 맨 위에 8/7 로 뜬다)
   · 같은 날 본수업 + 보강이 모두 있으면 뒤쪽(보강) 카드에 붙인다.
   반환 { map:Map('날짜|슬롯' → [메모…]), orphans:[메모…] }
════════════════════════════════════════════════════════════════ */
function assignFeedback(slots,fbList){
  const map=new Map(),orphans=[];
  const byDate=new Map();
  (Array.isArray(slots)?slots:[]).forEach(s=>{
    if(!s||!atYmd(s.d))return;
    const d=String(s.d),k=normSlot(s.k);
    if(!byDate.has(d))byDate.set(d,[]);
    const arr=byDate.get(d);
    if(arr.indexOf(k)<0)arr.push(k);
  });
  (Array.isArray(fbList)?fbList:[]).forEach(fb=>{
    const d=String(fb&&fb.date||'');
    const ks=atYmd(d)?byDate.get(d):null;
    if(!ks||!ks.length){orphans.push(fb);return;}
    const k=(ks.indexOf(SLOT_MK)>=0)?SLOT_MK:ks[0];
    const key=slotKey(d,k);
    if(!map.has(key))map.set(key,[]);
    map.get(key).push(fb);
  });
  return{map,orphans};
}
/* 메모 블록 — 작성 날짜를 항상 함께 보여준다 (어느 달 메모인지 바로 확인) */
function fbBlock(fb){
  const d=String(fb&&fb.date||'');
  const tag=atYmd(d)?(' · '+atLongDate(d)):'';
  return`<div class="ls-fb"><b>💬 선생님 메모${e(tag)}</b><div class="ls-fb-tx">${e(fb&&fb.text||'')}</div></div>`;
}

/* ════════ 출결 · 수업 회차 · 보강 ════════ */
function atNum(v){return(typeof v==='number'&&isFinite(v))?v:null;}
function atYmd(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v==null?'':v).trim());
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt;
}
function atLongDate(v){const d=atYmd(v);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`:String(v==null?'':v);}
function atShortDate(v){const d=atYmd(v);return d?`${d.getMonth()+1}/${d.getDate()}`:String(v==null?'':v);}
const AT_VALID=['출석','지각','결석','보강','휴강'];
function atStatusOf(x){
  const st=String(x&&x.s!=null?x.s:'').trim();
  return AT_VALID.indexOf(st)>=0?st:'출석';
}
/* 같은 날짜가 2건 이상인 날 목록 */
function pairedDates(list){
  const cnt=new Map();
  list.forEach(x=>cnt.set(x.d,(cnt.get(x.d)||0)+1));
  const out=[];
  cnt.forEach((n,d)=>{if(n>1)out.push(d);});
  return out.sort();
}
function renderAttendance(student){
  try{
    const ses=atNum(student&&student.sessionCount);
    const abs=atNum(student&&student.absentCount);
    const mk=atNum(student&&student.makeupCount);
    const last=(student&&atYmd(student.lastClassDate))?String(student.lastClassDate):'';
    document.querySelectorAll('#at-ses').forEach(el=>el.textContent=ses!=null?ses+'회':'—');
    document.querySelectorAll('#at-abs').forEach(el=>el.textContent=abs!=null?abs+'회':'—');
    document.querySelectorAll('#at-mk').forEach(el=>el.textContent=mk!=null?mk+'회':'—');
    document.querySelectorAll('#at-last').forEach(el=>el.textContent=last?atShortDate(last):'—');

    const raw=Array.isArray(student&&student.recentAttendance)?student.recentAttendance:[];
    // 날짜 + 슬롯 순으로 정렬 — 같은 날이면 본수업 먼저, 보강 나중
    const flow=raw.filter(x=>x&&atYmd(x.d))
      .map(x=>({d:String(x.d),k:normSlot(x.k),s:atStatusOf(x)}))
      .sort(cmpSlot)
      .slice(-40);
    const pairs=new Set(pairedDates(flow));
    const flowHtml=flow.length
      ?flow.map(x=>`<span class="at-dot at-st-${e(x.s)}${pairs.has(x.d)?' at-pair':''}" title="${e(atLongDate(x.d))} ${e(slotName(x.k))} · ${e(x.s)}">${e(x.s.charAt(0))}<span class="at-d">${e(atShortDate(x.d))}</span></span>`).join('')
      :`<span class="at-wait">${ses?'출결 기록이 정리되는 중입니다.':'아직 기록된 수업이 없습니다.'}</span>`;
    document.querySelectorAll('#at-line').forEach(el=>el.innerHTML=flowHtml);
    const noteEl=pairs.size
      ?`같은 날에 본수업과 보강을 함께 진행한 날이 ${pairs.size}일 있습니다. 그 날은 칸이 두 개로 표시되고, 수업 회차도 두 번으로 계산됩니다.`
      :'';
    document.querySelectorAll('#at-note').forEach(el=>el.textContent=noteEl);
  }catch(err){
    ['#at-ses','#at-abs','#at-mk','#at-last'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.textContent='—'));
    document.querySelectorAll('#at-line').forEach(el=>el.innerHTML='<span class="at-wait">출결을 불러오지 못했습니다.</span>');
  }
}

const LS_LESSON=['출석','지각','보강'];
const LS_BADGE={
  '출석':'background:#ecfdf5;border-color:#6ee7b7;color:#047857',
  '지각':'background:#fffbeb;border-color:#fde68a;color:#b45309',

/* ════════════════════════════════════════════════════════════════
   ★★ 2026-08 수정 — 회차 번호가 40회를 넘으면 어긋나던 문제
   ────────────────────────────────────────────────────────────────
   [무엇이 어긋나 있었나]
   students 문서의 recentLessons 는 최근 40칸만 보관한다.
   (선생님 화면의 LESSON_MAX = 40)
   그런데 이 화면은 배열 안에서 1부터 다시 세고 있었다.
     let no=0; ... no++
   그래서 총 45회 다닌 학생은 배열에 40칸만 남아 있으므로
   실제 6회차인 수업이 화면에 「1회차」로 찍혔다.
   위쪽 통계는 "수업 회차 45회"라고 나오는데 아래 카드는 1~40회차라
   학부모가 보기에 숫자가 서로 맞지 않았다.
   (지금은 40회를 넘은 학생이 없어 드러나지 않지만,
    주 1회 기준 10개월쯤 지나면 여러 학생이 한꺼번에 넘어간다)

   [지금 규칙]
   밀려난 회차 수(cut)를 sessionCount 에서 역산해 시작 번호로 쓴다.
     cut = 총 회차(sessionCount) − 배열에 남은 수업 수
     첫 카드 번호 = cut + 1
   45회 중 40칸이 남았으면 6회차부터 시작한다.
   sessionCount 가 없거나 배열보다 작으면(집계 전 · 재집계 직후 등)
   cut = 0 이 되어 예전처럼 1부터 센다. → 40회 이하 학생은 화면 변화 없음.
════════════════════════════════════════════════════════════════ */
function renderLessons(student,fbList){
  try{
    const raw=Array.isArray(student&&student.recentLessons)?student.recentLessons:[];
    const list=raw.filter(x=>x&&atYmd(x.d))
      .map(x=>({d:String(x.d),k:normSlot(x.k),s:atStatusOf(x),u:String(x.u||''),c:String(x.c||''),h:String(x.h||'')}))
      .sort(cmpSlot);

    if(!list.length){renderLessonsFallback(student,fbList);return;}

    const pairs=new Set(pairedDates(list));

    /* ★ 회차 번호 보정 — 배열에서 밀려난 만큼 시작 번호를 올린다 */
    const shown=list.filter(x=>LS_LESSON.indexOf(x.s)>=0).length;   // 지금 보이는 수업 수
    const total=atNum(student&&student.sessionCount);               // 실제 총 회차
    const cut=(total!=null&&total>shown)?(total-shown):0;           // 밀려난 회차 수

    let no=cut;
    const numbered=list.map(x=>{
      if(LS_LESSON.indexOf(x.s)>=0)no++;
      return{...x,no:LS_LESSON.indexOf(x.s)>=0?no:null};
    });
    numbered.reverse();

    const{map,orphans}=assignFeedback(list.map(x=>({d:x.d,k:x.k})),fbList);

    const items=numbered.map(x=>({kind:'lesson',d:x.d,k:x.k,x}));
    orphans.forEach(fb=>{
      const d=String(fb&&fb.date||'');
      if(atYmd(d))items.push({kind:'fb',d,k:SLOT_MK,fb});
    });
    items.sort((a,b)=>cmpSlot(b,a));
    orphans.filter(fb=>!atYmd(String(fb&&fb.date||''))).forEach(fb=>items.unshift({kind:'fb',d:'',k:SLOT_LS,fb}));

    const html=items.map((it,i)=>{
      if(it.kind==='fb'){
        return`<div class="ls-card fbonly${i===0?' latest':''}">
          <div class="ls-top">
            <span class="ls-date">${e(it.d?atLongDate(it.d):'작성일 미상')}</span>
            <span class="ls-badge" style="${LS_BADGE['보강']}">선생님 메모</span>
            ${i===0&&items.length>1?'<span class="ls-new">최신</span>':''}
          </div>
          ${fbBlock(it.fb)}
        </div>`;
      }
      const x=it.x;
      const badge=LS_BADGE[x.s]||LS_BADGE['출석'];
      const body=x.c
        ?`<div class="ls-body">${e(x.c)}</div>`
        :(x.s==='결석'?'<div class="ls-body mute">결석으로 기록된 날입니다.</div>'
         :(x.s==='휴강'?'<div class="ls-body mute">휴강일입니다.</div>'
         :'<div class="ls-body mute">수업 내용이 등록되지 않았습니다.</div>'));
      const hw=x.h?`<div class="ls-hw"><b>과제</b>${e(x.h)}</div>`:'';
      const unit=x.u?`<div class="ls-unit">📘 ${e(x.u)}</div>`:'';
      // 같은 날 2건인 날에만 '본수업 / 보강 수업' 구분표를 붙인다
      const slotTag=pairs.has(x.d)?`<span class="ls-slot">${e(slotName(x.k))}</span>`:'';
      const fbs=(map.get(slotKey(x.d,x.k))||[]).map(fbBlock).join('');
      return`<div class="ls-card${i===0?' latest':''}${x.k===SLOT_MK?' mk':''}">
        <div class="ls-top">
          <span class="ls-date">${e(atLongDate(x.d))}</span>
          <span class="ls-badge" style="${badge}">${e(x.s)}</span>
          ${slotTag}
          ${i===0&&items.length>1?'<span class="ls-new">최신</span>':''}
          ${x.no?`<span class="ls-no">${x.no}회차</span>`:''}
        </div>
        ${unit}${body}${hw}${fbs}
      </div>`;
    }).join('');

    /* ★ 몇 회가 빠졌는지 분명히 알려준다 (학부모 문의를 줄인다) */
    const more=cut>0
      ?`<div class="ls-more">최근 ${shown}회 수업(${cut+1}회차 ~ ${cut+shown}회차)을 보여드리고 있습니다.<br>그 이전 ${cut}회 기록은 학원으로 문의해 주세요.</div>`:'';
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html+more);
  }catch(err){
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML='<div class="empty-box">수업 기록을 불러오지 못했습니다.</div>');
  }
}
function renderLessonsFallback(student,fbList){
  const fbs=(Array.isArray(fbList)?fbList:[]);
  const fbHtml=fbs.map(fb=>`<div class="ls-card fbonly">
      <div class="ls-top">
        <span class="ls-date">${e(fb.date?atLongDate(fb.date):'작성일 미상')}</span>
        <span class="ls-badge" style="${LS_BADGE['보강']}">선생님 메모</span>
      </div>
      ${fbBlock(fb)}
    </div>`).join('');
  const hw=(student&&student.lastHomework&&typeof student.lastHomework==='object')?student.lastHomework:null;
  const text=hw?String(hw.text||'').trim():'';
  const date=(hw&&atYmd(hw.date))?String(hw.date):'';
  if(!text){
    const html=fbHtml||emptyBox('🗓','아직 등록된 수업 기록이 없습니다.<br>수업이 진행되면 이곳에 표시됩니다.');
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html);
    return;
  }
  const html=fbHtml+`<div class="ls-card latest">
      <div class="ls-top">
        <span class="ls-date">${e(date?atLongDate(date):'최근 수업')}</span>
        <span class="ls-badge" style="${LS_BADGE['출석']}">과제</span>
      </div>
      <div class="ls-hw" style="margin-top:0;padding-top:0;border-top:none"><b>과제</b>${e(text)}</div>
    </div>
    <div class="ls-more">지난 수업 기록을 정리하고 있습니다.<br>곧 전체 내용을 확인하실 수 있습니다.</div>`;
  document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html);
}

/* ════════════════════════════════════════════════════════════════
   ★ 시험 기록 (grades) — 점수 해석을 한 곳으로 통일
   ────────────────────────────────────────────────────────────────
   [무엇이 어긋나 있었나]
   같은 oxScore · multiScore 를 두 곳이 다르게 읽고 있었다.
     · 점수 카드 : 정답률(%)로 보고 맞은 문항 수를 역산  → 맞음
     · 개념 지도 : 맞은 문항 수로 보고 그대로 합산        → 틀림
   채점하는 쪽(examService.ts)을 확인한 결과
     score = Math.round(정답 수 / 응시 문항 수 * 100)
   즉 oxScore · multiScore · score 는 모두 백분율(%)이고,
   맞은 문항 수는 ox.correct · multiple.correct · totalCorrect 에 있다.
   → 아래 판정 함수 하나로 통일했고, 개념 지도도 같은 값을 쓴다.

   [0점이 사라지던 문제]
   예전에는 "oxScore > 0" 이어야 응시로 봤다. 그래서 진짜 0점을 받은
   시험이 화면에서 통째로 사라졌다.
   → 응시 여부는 점수가 아니라 '그 파트 기록이 있는가'로 판단한다.
     (examService 는 응시하지 않은 파트를 null 로 저장한다)

   ★★ 응시 횟수 (attemptCount)
   ────────────────────────────────────────────────────────────────
   grades 문서 ID 는 {시험ID}__{학생ID} 로 고정되어 있다.
   재응시하면 같은 문서를 덮어쓰므로 문서는 언제나 1개다.
   그런데 화면은 '문서 개수'를 세고 있었다.
     → 2번 본 시험도 "1회"로 보였다.
   → attemptOf() 로 attemptCount 를 읽어 '응시 횟수'에 합산한다.
     필드가 없는 옛 기록은 1회로 본다.

   [누적 정답 · 최고 기록은 왜 그대로인가]
   문서에는 마지막 응시 결과 한 벌만 남는다. 이전 응시의 문항별
   채점 결과는 남아 있지 않으므로 정답 수를 곱해서 부풀리지 않는다.
════════════════════════════════════════════════════════════════ */
function toNum(v){return(typeof v==='number')?v:(v!=null&&v!==''&&!isNaN(Number(v))?Number(v):null);}
function hasBlock(v){return!!(v&&typeof v==='object');}
function normalizeGrade(id,r){
  const oxCorrect=toNum(r.oxCorrect!=null?r.oxCorrect:(r.ox&&r.ox.correct));
  const multiCorrect=toNum(r.multiCorrect!=null?r.multiCorrect:(r.multiple&&r.multiple.correct));
  const oxScore=toNum(r.oxScore!=null?r.oxScore:(r.ox&&r.ox.score));
  const multiScore=toNum(r.multiScore!=null?r.multiScore:(r.multiple&&r.multiple.score));
  return{
    id,
    testName:r.testName||r.examTitle||r.unitName||'',
    subject:r.subject||r.studentSubject||'',
    grade:r.grade||'',
    oxScore,
    oxCount:toNum(r.oxCount!=null?r.oxCount:(r.ox&&r.ox.total)),
    oxCorrect,
    /* 응시 여부 — 점수가 0이어도 기록이 있으면 응시로 본다 */
    oxHas:hasBlock(r.ox)||oxScore!=null||oxCorrect!=null,
    multiScore,
    multiCount:toNum(r.multiCount!=null?r.multiCount:(r.multiple&&r.multiple.total)),
    multiCorrect,
    multiHas:hasBlock(r.multiple)||multiScore!=null||multiCorrect!=null,
    masterScore:toNum(r.masterScore!=null?r.masterScore:null),
    score:toNum(r.score!=null?r.score:(r.percentage!=null?r.percentage:null)),
    totalQuestions:toNum(r.totalQuestions!=null?r.totalQuestions:(r.totalQ!=null?r.totalQ:r.total)),
    totalCorrect:toNum(r.totalCorrect!=null?r.totalCorrect:(r.correctCount!=null?r.correctCount:(r.correct!=null?r.correct:null))),
    answeredCount:toNum(r.answeredCount),
    /* ★ 재응시 횟수 — 문서 1개 = 응시 1회가 아니다 */
    attemptCount:toNum(
      r.attemptCount!=null?r.attemptCount:
      (r.attempts!=null?r.attempts:
      (r.attemptNo!=null?r.attemptNo:
      (r.tryCount!=null?r.tryCount:null)))
    ),
    testType:String(r.testType||r.category||'').toLowerCase(),
    timestamp:r.timestamp||r.submittedTimestamp||r.submittedAt||r.date||null,
    cmKey:cmExamKey(id,r),
    cmTally:null   // loadGrades 에서 tallyOf 기준으로 채운다
  };
}

/* ★ 실제 응시 횟수 — attemptCount 가 없거나 이상하면 1회로 본다 */
function attemptOf(r){
  const n=toNum(r&&r.attemptCount);
  if(n==null||!isFinite(n))return 1;
  const v=Math.floor(n);
  if(v<1)return 1;
  if(v>999)return 999;   // 잘못 기록된 값이 통계를 망가뜨리지 않게 한다
  return v;
}

function isMasterRec(r){return r.testType==='master'||r.masterScore!=null;}
/* 한 파트의 결과 {correct,total,rate} — 정답 수가 있으면 그것을 우선한다.
   없으면 점수(%)에서 역산한다. (score 는 언제나 백분율) */
function makeSec(correct,total,rate){
  let c=(correct!=null&&isFinite(correct))?correct:null;
  const t=(total!=null&&isFinite(total)&&total>0)?total:null;
  let pct=(rate!=null&&isFinite(rate))?rate:null;
  if(c==null&&t!=null&&pct!=null)c=Math.round(pct/100*t);
  if(pct==null&&t!=null&&c!=null)pct=Math.round(c/t*100);
  if(c!=null&&t!=null&&c>t)c=t;
  if(c!=null&&c<0)c=0;
  if(c==null&&pct==null)return null;
  return{correct:c,total:t,rate:pct};
}
function oxOf(r){
  if(isMasterRec(r))return null;
  if(!r.oxHas)return null;                       // 그 시험에 OX 응시 기록 자체가 없음
  if(!(r.oxCount>0)&&r.oxCorrect==null)return null;
  return makeSec(r.oxCorrect,r.oxCount,r.oxScore);
}
function mcOf(r){
  if(isMasterRec(r))return null;
  if(!r.multiHas)return null;
  if(!(r.multiCount>0)&&r.multiCorrect==null)return null;
  return makeSec(r.multiCorrect,r.multiCount,r.multiScore);
}
function masterOf(r){
  if(!isMasterRec(r))return null;
  if(r.totalQuestions>0&&r.totalCorrect!=null)return makeSec(r.totalCorrect,r.totalQuestions,null);
  if(r.multiCorrect!=null&&r.multiCount>0)return makeSec(r.multiCorrect,r.multiCount,r.multiScore);
  if(r.masterScore!=null)return makeSec(null,r.totalQuestions,r.masterScore);
  if(r.score!=null)return makeSec(null,r.totalQuestions,r.score);
  return null;
}
/* 개념 지도용 집계 — 위와 똑같은 판정을 쓴다 (두 화면의 숫자가 어긋날 수 없다) */
function tallyOf(r){
  const parts=[oxOf(r),mcOf(r),masterOf(r)].filter(Boolean);
  let c=0,t=0,any=false;
  parts.forEach(s=>{if(s.correct!=null&&s.total!=null){c+=s.correct;t+=s.total;any=true;}});
  if(any&&t>0)return{total:t,correct:Math.min(c,t)};
  // 파트 정보가 없을 때만 전체 집계 필드로 폴백
  const base=(r.answeredCount!=null&&r.answeredCount>0)?r.answeredCount:r.totalQuestions;
  if(base!=null&&base>0){
    if(r.totalCorrect!=null)return{total:base,correct:Math.max(0,Math.min(r.totalCorrect,base))};
    if(r.score!=null)return{total:base,correct:Math.max(0,Math.min(base,Math.round(r.score/100*base)))};
  }
  const p=cmParseAnswers(r.rawAnswers);
  if(p.total>0)return{total:p.total,correct:p.correct};
  return null;
}

function gradeTime(r){
  const t=r.timestamp;
  if(!t)return 0;
  if(typeof t==='object'){if(t.seconds!=null)return t.seconds*1000;if(typeof t.toMillis==='function'){try{return t.toMillis();}catch(e){}}return 0;}
  const d=new Date(t);return isNaN(d.getTime())?0:d.getTime();
}
function gradeDateStr(r){
  const t=r.timestamp;
  if(typeof t==='string'){const m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1].slice(2)}/${m[2]}/${m[3]}`;}
  const ms=gradeTime(r);if(!ms)return'';
  const d=new Date(ms);
  return`${String(d.getFullYear()).slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

async function loadGrades(sid,fireId){
  try{
    let docs=[];const seen=new Set();
    async function q(field,val){
      try{
        const s=await getDocs(query(collection(db,'grades'),where(field,'==',val)));
        s.forEach(d=>{
          if(seen.has(d.id))return;
          seen.add(d.id);
          const raw=d.data()||{};
          const g=normalizeGrade(d.id,raw);
          g.rawAnswers=raw.answers;
          g.cmTally=tallyOf(g);
          docs.push(g);
        });
      }catch(e){}
    }
    await q('studentId',sid);
    if(fireId&&fireId!==sid)await q('studentId',fireId);
    docs.sort((a,b)=>gradeTime(b)-gradeTime(a));
    renderOx(docs);
    renderMultiple(docs);
    renderMaster(docs);
    await loadConceptTags();
    buildConceptAnalysis(docs);
    renderConcept();
  }catch(err){
    ['#oxResultList','#testResultList','#masterTestList'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.innerHTML='<div class="empty-box">기록을 불러오지 못했습니다.</div>'));
  }
}

/* items = [{r, sec}] — 응시 횟수는 attemptCount 합, 점수는 최근 기록 기준 */
function setStats(prefix,items){
  const list=(Array.isArray(items)?items:[]).filter(x=>x&&x.sec);
  const count=list.reduce((a,x)=>a+attemptOf(x.r),0);
  const secs=list.map(x=>x.sec);
  const known=secs.filter(s=>s.correct!=null&&s.total!=null);
  const sumC=known.reduce((a,s)=>a+s.correct,0);
  const sumT=known.reduce((a,s)=>a+s.total,0);
  let best=null,bestRate=-1;
  secs.forEach(s=>{
    const rate=(s.rate!=null)?s.rate:((s.correct!=null&&s.total)?Math.round(s.correct/s.total*100):null);
    if(rate==null)return;
    if(rate>bestRate){bestRate=rate;best=s;}
  });
  document.querySelectorAll('#'+prefix+'-total').forEach(el=>el.textContent=count+'회');
  document.querySelectorAll('#'+prefix+'-sum').forEach(el=>{
    el.textContent=known.length?`${sumC}/${sumT}`:'—';
  });
  document.querySelectorAll('#'+prefix+'-best').forEach(el=>{
    if(!best){el.textContent='—';return;}
    el.textContent=(best.correct!=null&&best.total!=null)?`${best.correct}/${best.total}`:`${bestRate}%`;
  });
}

function renderOx(docs){
  const items=docs.map(r=>({r,sec:oxOf(r)})).filter(x=>x.sec);
  setStats('ox',items);
  const html=!items.length?emptyBox('⭕','아직 응시한 OX 퀴즈가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#oxResultList').forEach(el=>el.innerHTML=html);
}
function renderMultiple(docs){
  const items=docs.map(r=>({r,sec:mcOf(r)})).filter(x=>x.sec);
  setStats('ts',items);
  const html=!items.length?emptyBox('📝','아직 응시한 4지선다 테스트가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#testResultList').forEach(el=>el.innerHTML=html);
}
function renderMaster(docs){
  const items=docs.map(r=>({r,sec:masterOf(r)})).filter(x=>x.sec);
  setStats('ms',items);
  const html=!items.length?emptyBox('🎯','아직 응시한 마스터테스트가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#masterTestList').forEach(el=>el.innerHTML=html);
}

function renderScoreCard(r,sec){
  const rate=(sec.rate!=null)?sec.rate:((sec.correct!=null&&sec.total)?Math.round(sec.correct/sec.total*100):null);
  const cls=(rate==null)?'sc-none':(rate>=80?'sc-high':rate>=60?'sc-mid':'sc-low');
  const dt=gradeDateStr(r)||'—';
  const hasFrac=(sec.correct!=null&&sec.total!=null);
  const title=e(r.testName||r.subject||'테스트');
  const at=attemptOf(r);                 // ★ 실제 응시 횟수
  const many=at>1;

  const rows=[];
  rows.push(`<div class="sc-row sc-row-title"><span class="sc-row-lbl">단원명</span><span class="sc-row-val">${title}${many?`<span class="sc-badge">${at}회 응시</span>`:''}</span></div>`);
  if(r.subject)rows.push(`<div class="sc-row"><span class="sc-row-lbl">과목</span><span class="sc-row-val">${e(r.subject)}</span></div>`);
  rows.push(`<div class="sc-row"><span class="sc-row-lbl">${many?'최근 응시':'응시 날짜'}</span><span class="sc-row-val sc-date">${dt}</span></div>`);
  if(many){
    rows.push(`<div class="sc-row"><span class="sc-row-lbl">응시 횟수</span><span class="sc-row-val">총 <b class="sc-retry">${at}</b>회 응시 <span class="sc-sub">· 아래 결과는 가장 최근 기록입니다</span></span></div>`);
  }
  if(hasFrac){
    rows.push(`<div class="sc-row"><span class="sc-row-lbl">채점 결과</span><span class="sc-row-val">전체 <b class="sc-total">${sec.total}</b>문항 중 <b class="sc-correct">${sec.correct}</b>문항 정답${rate!=null?` <span class="sc-rate">(정답률 ${rate}%)</span>`:''}</span></div>`);
  }else if(rate!=null){
    rows.push(`<div class="sc-row"><span class="sc-row-lbl">채점 결과</span><span class="sc-row-val sc-rate">정답률 ${rate}%</span></div>`);
  }

  const circle=hasFrac
    ?`<div class="sc-pct">${sec.correct}/${sec.total}</div><div class="sc-unit">문항</div>`
    :`<div class="sc-pct">${rate!=null?rate+'%':'—'}</div><div class="sc-unit">정답률</div>`;

  return`<div class="test-item">
    <div class="test-head">
      <div class="test-info"><div class="sc-rows">${rows.join('')}</div></div>
      <div class="score-circle ${cls}">${circle}</div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════════
   과학 개념 지도 (탭 1)
   · 개념·문구·색은 concept-map.js 한 곳에서만 관리한다
   · 문항 집계는 위의 tallyOf() 를 그대로 쓴다 (점수 카드와 동일)
   · '누적 평가' 횟수도 attemptCount 를 합산한다 (탭 숫자와 일치)
════════════════════════════════════════════════════════════════ */
const CM=(typeof window!=='undefined'&&window.ConceptMap)?window.ConceptMap:null;
let cmTagMap={},cmAnalysis=null,cmArea=1,cmExamCount=0;

function cmNum(x){
  if(x===null||x===undefined||x==='')return null;
  const n=Number(x);return isFinite(n)?n:null;
}
function cmPick(obj,names){
  for(let i=0;i<names.length;i++){
    const v=obj?obj[names[i]]:undefined;
    if(v!==undefined&&v!==null&&v!=='')return v;
  }
  return null;
}
function cmExamKey(id,r){
  const t=cmPick(r,['examId','testName','examTitle','title','testId']);
  return t?String(t):String(id);
}
function cmParseAnswers(ans){
  let list=[];
  if(Array.isArray(ans))list=ans;
  else if(ans&&typeof ans==='object')list=Object.keys(ans).map(k=>ans[k]);
  let total=0,correct=0;
  list.forEach(it=>{
    let c=null;
    if(typeof it==='boolean')c=it;
    else if(it&&typeof it==='object'){
      if(typeof it.correct==='boolean')c=it.correct;
      else if(typeof it.isCorrect==='boolean')c=it.isCorrect;
      else if(it.result!==undefined)c=(it.result===true||it.result==='O'||it.result==='correct');
      else{
        const key=cmPick(it,['answer','correctAnswer','key']);
        const mine=cmPick(it,['userAnswer','studentAnswer','selected','input','value','my']);
        if(key!==null&&mine!==null)c=String(key).trim()===String(mine).trim();
      }
    }
    if(c===null)return;
    total++;if(c)correct++;
  });
  return{total,correct};
}
function cmNormalizeTag(v){
  if(!CM)return[];
  if(Array.isArray(v.concepts)&&v.concepts.length)return v.concepts.filter(id=>CM.getNode(id));
  if(Array.isArray(v.standards)&&v.standards.length){
    const out=[];
    v.standards.forEach(std=>(CM.byStandard(std)||[]).forEach(n=>out.push(n.id)));
    return out;
  }
  return[];
}
async function loadConceptTags(){
  if(!CM)return;
  try{
    const snap=await getDocs(collection(db,'conceptTags'));
    const m={};
    snap.forEach(d=>{
      const v=d.data()||{};
      const key=v.examId?String(v.examId):d.id;
      const ids=cmNormalizeTag(v);
      if(ids.length)m[key]=ids;
    });
    cmTagMap=m;
  }catch(err){cmTagMap={};}
}
function buildConceptAnalysis(docs){
  if(!CM)return;
  const recs=[];let taken=0;
  (Array.isArray(docs)?docs:[]).forEach(r=>{
    /* 응시한 시험이면 실제 응시 횟수만큼 세어 탭의 '응시 횟수'와 맞춘다.
       (개념 판정에 쓰는 문항 기록은 마지막 응시분 한 벌만 사용한다) */
    if(r.cmTally||oxOf(r)||mcOf(r)||masterOf(r))taken+=attemptOf(r);
    const t=r.cmTally;
    if(!t)return;
    const ids=cmTagMap[r.cmKey]||[];
    ids.forEach(id=>{
      const node=CM.getNode(id);
      if(!node)return;
      for(let i=0;i<t.total;i++)recs.push({conceptId:node.id,std:node.std,correct:i<t.correct});
    });
  });
  cmExamCount=taken;
  cmAnalysis=CM.analyze(recs);
}

function cmSet(sel,html){document.querySelectorAll(sel).forEach(el=>el.innerHTML=html);}
function cmTxt(sel,txt){document.querySelectorAll(sel).forEach(el=>el.textContent=txt);}
function cmToday(){
  const d=new Date();
  return`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function cmMapSvg(areaId){
  const nodes=CM.byArea(areaId);
  if(!nodes.length)return'';
  const depth=CM.levels();
  let minD=Infinity;
  nodes.forEach(n=>{minD=Math.min(minD,depth[n.id]);});
  const cols={};
  nodes.forEach(n=>{
    const d=depth[n.id]-minD;
    if(!cols[d])cols[d]=[];
    cols[d].push(n);
  });
  const keys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  const BW=114,BH=42,GX=46,GY=11,PAD=14;
  let maxRows=0;
  keys.forEach(k=>{maxRows=Math.max(maxRows,cols[k].length);});
  const W=PAD*2+keys.length*BW+Math.max(0,keys.length-1)*GX;
  const H=PAD*2+maxRows*BH+Math.max(0,maxRows-1)*GY;
  const pos={};
  keys.forEach((k,i)=>{
    const list=cols[k];
    const colH=list.length*BH+(list.length-1)*GY;
    const y0=PAD+(H-PAD*2-colH)/2;
    list.forEach((n,j)=>{pos[n.id]={x:PAD+i*(BW+GX),y:y0+j*(BH+GY)};});
  });

  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="개념이 이어지는 순서">`;
  svg+='<defs><marker id="cmar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#dcd3da"/></marker></defs>';
  nodes.forEach(n=>{
    n.prereq.forEach(pid=>{
      const p=pos[pid],q=pos[n.id];
      if(!p||!q)return;
      const x1=p.x+BW,y1=p.y+BH/2,x2=q.x,y2=q.y+BH/2,mx=(x1+x2)/2;
      svg+=`<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="#ece4ea" stroke-width="1.4" marker-end="url(#cmar)"/>`;
    });
  });
  nodes.forEach(n=>{
    const pt=pos[n.id];
    const st=(cmAnalysis&&cmAnalysis.stats[n.id])?cmAnalysis.stats[n.id]:{status:'unknown'};
    const s=CM.styleOf(st.status,'parent');
    const label=n.name.length>9?n.name.slice(0,8)+'…':n.name;
    svg+=`<rect x="${pt.x}" y="${pt.y}" width="${BW}" height="${BH}" rx="10" fill="${s.bg}" stroke="${s.line}" stroke-width="1.3"/>`;
    svg+=`<text x="${pt.x+BW/2}" y="${pt.y+18}" text-anchor="middle" font-size="11" font-weight="700" fill="${s.fg}" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${e(label)}</text>`;
    svg+=`<text x="${pt.x+BW/2}" y="${pt.y+32}" text-anchor="middle" font-size="9" fill="${s.fg}" opacity="0.8" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${e(s.label)}</text>`;
  });
  svg+='</svg>';
  return svg;
}

function renderConceptArea(){
  if(!CM)return;
  const chips=CM.AREAS.map(a=>
    `<button type="button" class="cm-chip${cmArea===a.id?' on':''}" onclick="cmSetArea(${a.id})">${e(a.name)}</button>`
  ).join('');
  cmSet('#cm-chips',chips);
  cmSet('#cm-map',cmMapSvg(cmArea));

  const order=['ok','warn','weak','few','unknown'];
  cmSet('#cm-legend',order.map(k=>{
    const s=CM.styleOf(k,'parent');
    return`<span><i style="background:${s.bg};border-color:${s.line}"></i>${e(s.label)}</span>`;
  }).join(''));
  cmSet('#cm-hint','화살표는 개념이 이어지는 순서입니다. 왼쪽을 먼저 익혀야 오른쪽이 쉬워집니다. 지도는 옆으로 밀어서 보실 수 있습니다.');

  const nodes=CM.byArea(cmArea).filter(n=>{
    const st=cmAnalysis&&cmAnalysis.stats[n.id];
    return!!(st&&st.total>0);
  });
  if(!nodes.length){
    cmTxt('#cm-note','');
    cmSet('#cm-table','<div class="empty-box">이 영역은 앞으로 수업에서 다룰 예정입니다.<br>평가가 진행되면 확인한 개념이 하나씩 이곳에 쌓입니다.</div>');
    return;
  }
  cmTxt('#cm-note','지금까지 평가로 확인한 개념 '+nodes.length+'개입니다. 각 개념은 교육부가 고시한 성취기준에 연결해 관리합니다.');
  const rows=nodes.map(n=>{
    const st=cmAnalysis.stats[n.id];
    const s=CM.styleOf(st.status,'parent');
    return`<tr>
      <td class="cm-c-std">${CM.stdCell(n.std)}</td>
      <td class="cm-c-name">${e(n.name)}</td>
      <td class="cm-c-state"><span class="cm-pill" style="background:${s.bg};color:${s.fg}">${e(s.label)}</span></td>
    </tr>`;
  }).join('');
  cmSet('#cm-table',`<div class="cm-tblbox"><table class="cm-tbl">
    <thead><tr><th class="cm-c-std">성취기준</th><th class="cm-c-name">개념</th><th class="cm-c-state">상태</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`);
}

function renderConcept(){
  if(!CM){
    cmTxt('#cm-ok','—');cmTxt('#cm-warn','—');cmTxt('#cm-weak','—');cmTxt('#cm-exam','—');
    cmSet('#cm-focus','<div class="empty-box">개념 지도를 준비하고 있습니다.<br>잠시 후 다시 열어봐 주세요.</div>');
    return;
  }
  const c=CM.countByStatus(cmAnalysis,null);
  const P=CM.STYLE.parent;

  cmTxt('#cm-ok',c.ok+'개');
  cmTxt('#cm-warn',c.warn+'개');
  cmTxt('#cm-weak',c.weak+'개');
  cmTxt('#cm-exam',cmExamCount+'회');

  cmSet('#cm-hero',`<div class="cm-hero">
    <div class="cm-h-lbl">지금까지의 학습</div>
    <div class="cm-h-big"><b>${c.ok}</b><span>개 개념을 다졌습니다</span></div>
    <div class="cm-h-sub">교육부 고시 성취기준을 ${c.total}개 개념으로 나누어 하나씩 확인하고 있습니다</div>
    ${CM.stackBar(c,'parent','cm-bar')}
    <div class="cm-key">
      <span><i style="background:${P.ok.line}"></i>다짐 ${c.ok}</span>
      <span><i style="background:${P.warn.line}"></i>다지는 중 ${c.warn}</span>
      <span><i style="background:${P.weak.line}"></i>집중 ${c.weak}</span>
      <span><i style="background:${P.unknown.line}"></i>예정 ${c.unknown+c.few}</span>
    </div>
    <div class="cm-h-date">${e(cmToday())} 기준 · 누적 평가 ${cmExamCount}회</div>
  </div>`);

  const f=CM.focusCopy(cmAnalysis,{link:false});
  cmSet('#cm-focus',`<div class="cm-focus">
    <div class="lbl">${e(f.lbl)}</div>
    <h4>${e(f.nm)}</h4>
    <p>${f.ds}</p>
    ${f.plan?`<div class="cm-plan">${e(f.plan)}</div>`:''}
    ${f.why?`<div class="cm-why">${e(f.why)}</div>`:''}
  </div>`);

  cmSet('#cm-areas',CM.AREAS.map(a=>{
    const st=CM.areaState(cmAnalysis,a.id,'parent');
    return`<div class="cm-arow">
      <div class="cm-ahead">
        <span class="cm-aname">${e(a.name)}</span>
        <span class="cm-astate" style="background:${st.style.bg};color:${st.style.fg}">${e(st.label)}</span>
        <span class="cm-anum">${e(st.right)}</span>
      </div>
      ${CM.stackBar(st.counts,'parent','cm-abar')}
    </div>`;
  }).join(''));

  cmSet('#cm-guide-body',`<div class="cm-g-lead">${e(CM.GUIDE_LEAD)}</div>`
    +CM.GUIDE.parent.map(g=>{
      const s=CM.styleOf(g.k,'parent');
      const cri=CM.CRITERIA[g.k]||'';
      return`<div class="cm-g-item">
        <div class="cm-g-head">
          <span class="cm-pill" style="background:${s.bg};color:${s.fg}">${e(s.label)}</span>
          <span class="cm-g-cri">${e(cri)}</span>
        </div>
        <div class="cm-g-mean">${e(g.mean)}</div>
        ${g.plan?`<div class="cm-g-plan"><b>이렇게 합니다</b> · ${e(g.plan)}</div>`:''}
      </div>`;
    }).join(''));

  renderConceptArea();
}

window.cmSetArea=function(id){
  const n=Number(id);
  cmArea=(n===1||n===2||n===3)?n:1;
  renderConceptArea();
};

function emptyBox(icon,msg){return`<div class="empty-box"><div class="empty-icon">${icon}</div>${msg}</div>`;}
function showError(){document.getElementById('loadingScreen').style.display='none';document.getElementById('errorScreen').style.display='flex';}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.switchTab=function(idx){
  document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i%TAB_COUNT===idx));
  document.querySelectorAll('.d-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.m-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  window.scrollTo({top:0,behavior:'smooth'});
};
</script>
</body>
</html>
