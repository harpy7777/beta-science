<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="/favicon.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>개별 학습 리포트 - 인후쌤의 과학 수업 관리 시스템</title>
  <!-- Open Graph / 카카오톡·소셜 링크 미리보기 -->
<meta property="og:type" content="website" />

<meta property="og:description" content="수업 내용과 시험 결과를 한눈에 확인하세요. 인후쌤의 과학 수업 관리 시스템." />

<!-- 트위터/기타 플랫폼 대응 -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="우리 아이 과학 학습 리포트" />
<meta name="twitter:description" content="수업 내용과 시험 결과를 한눈에 확인하세요." />
<meta name="twitter:image" content="https://beta-science.vercel.app/og-parent.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#ec4899;--pink-lt:#fdf2f8;--pink-dk:#be185d;
  --bg:#f8f4f7;--wh:#fff;--tx:#1e293b;--mt:#94a3b8;--bd:#f0e4ec;
  --r:14px;--ok:#10b981;
  --blue:#3b82f6;--blue-lt:#eff6ff;
  --green:#10b981;--green-lt:#ecfdf5;
  --safe-top:env(safe-area-inset-top);
  --safe-bot:env(safe-area-inset-bottom);
}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
/* 학부모가 붙여넣은 긴 단어·URL 이 카드를 밀어내지 않도록 */
.ls-body,.ls-hw,.ls-fb-tx,.sc-row-val{overflow-wrap:anywhere}

.loading-screen,.error-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;color:var(--mt);text-align:center;padding:24px}
.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-screen h2{font-size:20px;color:var(--tx);font-weight:600}
.error-screen p{font-size:14px;line-height:2}
#portalApp{display:none}

/* ══ 데스크탑 헤더 ══ */
.desktop-header{
  background:linear-gradient(135deg,#f472b6 0%,#db2777 100%);
  color:#fff;padding:28px 40px;
  display:flex;flex-direction:column;
}
.dh-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.dh-bottom{margin-top:14px}
.logo-row-d{display:flex;align-items:center;gap:10px}
.logo-icon-d{width:32px;height:32px;background:rgba(255,255,255,.25);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name-d{font-size:14px;font-weight:500;color:#fff;letter-spacing:-.01em}
.header-divider{width:100%;height:1px;background:rgba(255,255,255,.3);display:block}
.header-label-d{font-size:14px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.student-name-d{font-size:38px;font-weight:700;line-height:1;flex-shrink:0}
.name-row-d{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:4px}
.student-chips-d{display:flex;gap:10px;flex-wrap:nowrap;align-items:center}
.s-chip{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;font-size:13px;font-weight:500;white-space:nowrap}

/* ══ 데스크탑 탭 ══ */
.desktop-tabs{
  background:var(--wh);border-bottom:2px solid var(--bd);
  display:flex;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.d-tab{
  flex:1;padding:16px 8px;font-size:14px;font-weight:600;
  color:var(--mt);cursor:pointer;background:none;border:none;
  font-family:inherit;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:7px;
  white-space:nowrap;
}
.d-tab.active{color:var(--pink);border-bottom-color:var(--pink)}
.d-tab:hover{color:var(--tx)}
.desktop-body{max-width:1100px;margin:0 auto;padding:32px 40px 60px}

/* ══ 모바일 헤더 ══ */
.mobile-header{
  background:linear-gradient(160deg,#f472b6 0%,#db2777 100%);
  color:#fff;padding:calc(18px + var(--safe-top)) 20px 16px;
  position:relative;overflow:hidden;
}
.mobile-header::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:rgba(255,255,255,.07);border-radius:50%}
.mh-inner{position:relative;z-index:1}
.mh-top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.logo-row-m{display:flex;align-items:center;gap:10px}
.logo-icon-m{width:30px;height:30px;background:rgba(255,255,255,.25);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-name-m{font-size:13px;font-weight:500;color:#fff;letter-spacing:-.01em}
.header-label-m{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);white-space:nowrap}
.student-name-m{font-size:26px;font-weight:700;line-height:1;flex-shrink:0}
.name-row-m{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding-bottom:4px}
.student-chips-m{display:flex;gap:8px;flex-wrap:nowrap;align-items:center;overflow-x:auto}
.student-chips-m::-webkit-scrollbar{display:none}

/* ══ 모바일 탭 ══ */
.mobile-tabs{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--wh);border-top:1px solid var(--bd);
  display:flex;padding-bottom:var(--safe-bot);
  z-index:200;box-shadow:0 -2px 16px rgba(0,0,0,.08);
}
.m-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;padding:8px 1px 7px;
  font-family:inherit;color:var(--mt);cursor:pointer;
  background:none;border:none;transition:color .15s;min-height:54px;
}
.m-tab:active{background:var(--pink-lt)}
.m-tab.active{color:var(--pink)}
.m-tab.active .m-tab-icon{transform:translateY(-1px)}
.m-tab-icon{transition:transform .15s}
.m-tab-icon{font-size:19px;line-height:1}
.m-tab-lbl{font-size:9.5px;font-weight:600;white-space:nowrap}
.mobile-body{
  padding:16px 16px 8px;max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}

/* ══ 공통 컴포넌트 ══ */
.section{display:none}
.section.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ══ 과학 개념 지도 바로가기 카드 ══ */
.cm-card{
  display:flex;align-items:center;gap:14px;text-decoration:none;
  background:linear-gradient(135deg,#f472b6 0%,#db2777 100%);
  border-radius:var(--r);padding:16px 18px;margin-bottom:18px;color:#fff;
  box-shadow:0 6px 20px rgba(219,39,119,.22);
  position:relative;overflow:hidden;
}
.cm-card::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.cm-card:active{transform:scale(.985)}
.cm-ico{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:19px;
  position:relative;z-index:1;
}
.cm-tx{flex:1;min-width:0;position:relative;z-index:1}
.cm-tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.cm-tx span{display:block;font-size:12px;color:rgba(255,255,255,.86);margin-top:3px;line-height:1.5;word-break:keep-all}
.cm-go{flex-shrink:0;font-size:17px;font-weight:700;opacity:.85;position:relative;z-index:1}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
/* 출결 탭 — 회차 · 결석 · 보강 · 최근 수업 4칸 */
.stat-row.at4{grid-template-columns:repeat(4,1fr)}
.stat-box{border-radius:14px;padding:15px 10px 16px;text-align:center;border:1px solid #fbcfe8;background:var(--pink-lt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:84px}
.stat-box.blue{background:var(--blue-lt);border-color:#bfdbfe}
.stat-box.green{background:var(--green-lt);border-color:#6ee7b7}
.stat-lbl{font-size:12px;color:var(--mt);font-weight:600;line-height:1.2;letter-spacing:.01em}
.stat-num{font-size:24px;font-weight:700;color:var(--pink);line-height:1.2;word-break:keep-all}
.stat-box.blue .stat-num{color:var(--blue)}
.stat-box.green .stat-num{color:var(--green)}

.sec-label{font-size:12px;font-weight:600;color:var(--mt);letter-spacing:.06em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--bd)}

.info-card{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:18px 22px}
.info-card p{text-align:center;font-size:14px;color:var(--mt);line-height:1.9;font-weight:400}
.info-card strong{color:var(--tx);font-weight:600}

/* ══ 수업카드 안 선생님 메모 — 그 날짜에 작성된 경우에만 생성 ══ */
.ls-fb{margin-top:11px;padding:12px 14px;background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:11px}
.ls-fb+.ls-fb{margin-top:8px}
.ls-fb b{display:block;font-size:11.5px;font-weight:800;color:var(--pink-dk);letter-spacing:.03em;margin-bottom:6px}
.ls-fb-tx{font-size:13.5px;line-height:1.95;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.ls-card.fbonly{border-color:#fbcfe8;background:#fffdfe}

.empty-box{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);text-align:center;padding:56px 24px;color:var(--mt);font-size:14px;line-height:2}
.empty-icon{font-size:48px;margin-bottom:14px}

/* ══ 출결 흐름 ══ */
.at-flow{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:22px}
.at-line{display:flex;flex-wrap:wrap;gap:6px}
.at-line::-webkit-scrollbar{display:none}
.at-dot{min-width:40px;padding:6px 4px;border-radius:10px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.3;border:1.5px solid}
.at-dot .at-d{display:block;font-size:9px;font-weight:700;opacity:.7;margin-top:1px}
.at-wait{font-size:13px;color:var(--mt)}
.at-st-출석{background:var(--green-lt);border-color:#6ee7b7;color:#047857}
.at-st-지각{background:#fffbeb;border-color:#fde68a;color:#b45309}
.at-st-결석{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.at-st-보강{background:var(--blue-lt);border-color:#bfdbfe;color:#1d4ed8}
.at-st-휴강{background:#f3f4f6;border-color:#e5e7eb;color:#6b7280}
.at-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:13px;font-size:11px;color:var(--mt)}
.at-lg{display:flex;align-items:center;gap:5px}
.at-lg i{width:11px;height:11px;border-radius:4px;display:inline-block;border:1.5px solid}

/* ══ 수업 기록 카드 (최신순) ══ */
.ls-card{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.ls-card.latest{border-color:#fbcfe8;box-shadow:0 2px 12px rgba(236,72,153,.07)}
.ls-top{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;row-gap:6px}
.ls-date{font-size:14px;font-weight:700;color:var(--tx)}
.ls-badge{font-size:11.5px;font-weight:800;padding:3px 11px;border-radius:999px;border:1.5px solid;white-space:nowrap}
.ls-new{font-size:10.5px;font-weight:800;color:#fff;background:var(--pink);border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.ls-no{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--mt);white-space:nowrap}
.ls-unit{font-size:12px;font-weight:700;color:var(--pink-dk);background:var(--pink-lt);border:1px solid #fbcfe8;border-radius:7px;padding:4px 10px;word-break:keep-all;margin-bottom:9px;display:inline-block}
.ls-body{font-size:13.5px;line-height:1.95;color:#5b6573;white-space:pre-wrap;word-break:break-word}
.ls-body.mute{color:var(--mt)}
.ls-hw{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:13px;line-height:1.9;color:#5b6573;white-space:pre-wrap;word-break:break-word}
.ls-hw b{color:var(--pink-dk);font-weight:700;display:block;margin-bottom:3px;font-size:12px;letter-spacing:.03em}
.ls-more{text-align:center;font-size:12.5px;color:var(--mt);padding:14px 8px 4px;line-height:1.8}

/* ══ 점수 카드 (OX / 4지선다 / 마스터 공통) ══ */
/* 점수는 백분율이 아니라 "맞은 문항 / 전체 문항" 으로 보여준다.
   문항 수가 100으로 나눠떨어지지 않아도 학부모가 바로 이해할 수 있다. */
.test-item{background:var(--wh);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:10px}
.test-head{display:flex;align-items:center;gap:16px;justify-content:space-between}
.score-circle{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.sc-high{background:#d1fae5;color:#065f46}.sc-mid{background:#fef9c3;color:#854d0e}.sc-low{background:#fee2e2;color:#991b1b}.sc-none{background:#f5f5f7;color:#6e6e73}
.sc-pct{font-size:19px;font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.sc-unit{font-size:9.5px;font-weight:700;opacity:.75;line-height:1;letter-spacing:.02em}
.test-info{flex:1;min-width:0}
.sc-rows{display:flex;flex-direction:column;gap:8px}
.sc-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;line-height:1.45}
.sc-row-lbl{flex-shrink:0;width:62px;font-size:12px;font-weight:600;color:#a8b1bd;padding-top:1px}
.sc-row-val{flex:1;min-width:0;font-weight:600;color:#5b6573;word-break:keep-all}
.sc-row-val b{font-weight:800}
.sc-row-title{margin-bottom:2px;align-items:center}
.sc-row-title .sc-row-lbl{padding-top:0}
.sc-row-title .sc-row-val{font-size:15px;font-weight:700;line-height:1.4;letter-spacing:-.01em;color:#3f4854}
.sc-date{color:#aeb6c2;font-weight:600}
.sc-correct{color:#0d9488;font-weight:800}
.sc-total{color:#1d4ed8;font-weight:800}
.sc-rate{color:#7c8598;font-weight:700}

.desktop-only{display:block}
.mobile-only{display:none}

/* ══ 반응형 ══ */
@media(max-width:768px){
  .desktop-only{display:none!important}
  .mobile-only{display:block!important}
  body{padding-bottom:calc(64px + var(--safe-bot))}
  /* 출결 흐름 — 한 줄로 고정하고 가로 스크롤 (세로 공간 절약) */
  .at-line{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .at-dot{flex:0 0 auto;scroll-snap-align:start}
  .at-legend{gap:9px;font-size:10.5px}
  /* 수업 카드 — 회차를 오른쪽 끝에 유지 */
  .ls-top{gap:7px}
  .ls-no{margin-left:auto}
  .sec-label{margin-bottom:11px}
  .info-card p{white-space:normal}
  .stat-box{min-height:76px;gap:6px;padding:13px 8px 14px}
  .stat-num{font-size:20px}
  .stat-lbl{font-size:11px}
  .stat-row.at4{grid-template-columns:repeat(2,1fr)}
  .section{padding-top:2px}
  .ls-fb{padding:11px 12px;margin-top:10px}
  .ls-fb-tx{font-size:13px;line-height:1.9}
  .ls-hw{font-size:12.5px}
  .ls-unit{max-width:100%}
  .at-flow{padding:14px 15px}
  .ls-card{padding:14px 15px}
  .ls-date{font-size:13.5px}
  .test-item{padding:15px 16px}
  .test-head{gap:12px}
  .score-circle{width:64px;height:64px}
  .sc-pct{font-size:16.5px}
  .sc-unit{font-size:9px}
  .sc-rows{gap:7px}
  .sc-row{gap:8px;font-size:13px}
  .sc-row-lbl{width:54px;font-size:11.5px}
  .sc-row-title .sc-row-val{font-size:15px}
  .cm-card{padding:14px 15px;gap:12px;margin-bottom:16px}
  .cm-ico{width:36px;height:36px;border-radius:11px;font-size:17px}
  .cm-tx b{font-size:14px}
  .cm-tx span{font-size:11.5px}
}
/* ── 아이폰 SE·미니 등 좁은 화면 ── */
@media(max-width:380px){
  .mobile-body{padding:14px 12px 8px}
  .mobile-header{padding:calc(16px + var(--safe-top)) 16px 14px}
  .student-name-m{font-size:23px}
  .logo-name-m{font-size:12px}
  .header-label-m{font-size:12px}
  .s-chip{padding:4px 11px;font-size:12px}
  .stat-row{gap:8px}
  .stat-box{min-height:70px;padding:12px 6px 13px}
  .stat-num{font-size:17px}
  .stat-lbl{font-size:10.5px}
  .sc-row{flex-direction:column;gap:1px}
  .sc-row-lbl{width:auto;padding-top:0}
  .sc-row-title{align-items:flex-start}
  .sc-row-title .sc-row-val{font-size:15px}
  .score-circle{width:58px;height:58px}
  .sc-pct{font-size:15px}
  .sc-unit{font-size:8.5px}
  .m-tab-lbl{font-size:9px}
  .m-tab-icon{font-size:18px}
  .at-dot{min-width:36px;font-size:11px}
  .ls-top{gap:6px}
  .ls-no{margin-left:0;font-size:11px}
  .ls-date{font-size:13px}
  .ls-badge{font-size:11px;padding:3px 9px}
  .ls-fb{padding:10px 11px}
  .ls-fb b{font-size:11px}
  .ls-fb-tx{font-size:12.5px;line-height:1.85}
  .ls-unit{font-size:11.5px;padding:3px 8px}
  .cm-card{padding:13px 14px;gap:11px}
  .cm-ico{width:34px;height:34px;font-size:16px}
  .cm-tx b{font-size:13.5px}
  .cm-tx span{font-size:11px}
  .cm-go{font-size:15px}
}
/* ── 폴더블 접힘 등 초협소 화면 안전망 ── */
@media(max-width:340px){
  .mobile-body{padding:12px 10px 8px}
  .stat-row.at4{grid-template-columns:repeat(2,1fr);gap:7px}
  .stat-num{font-size:16px}
  .stat-lbl{font-size:10px}
  .ls-card{padding:12px 13px}
  .ls-date{font-size:12.5px}
  .ls-badge{font-size:10.5px;padding:2px 8px}
  .ls-no{font-size:10.5px}
  .ls-body{font-size:13px}

/* ══════════════════════════════════════════════════════════════
   [스크롤 복구] 모바일에서 화면 아래가 안 내려가던 문제
   ① body 의 overflow-x:hidden 이 body 를 별도 스크롤 박스로 만들어
      sticky · 아래쪽 스크롤이 함께 깨졌다 → html 에만 남기고 해제
   ② 하단 탭바 여백을 var(--safe-bot) 로 계산했는데, env() 를 커스텀
      속성에 담아 calc 로 쓰면 일부 사파리에서 선언 전체가 무효가 되어
      여백이 0 이 된다 → 고정값 먼저, env() 는 별도 선언으로 덧씀
   ③ 100vh 는 iOS 주소창 높이를 포함해 첫 화면이 잘린다 → svh 보강
══════════════════════════════════════════════════════════════ */
html { overflow-x: hidden; }
body {

}
@supports (min-height: 100svh) {

}

}

    const fbList=await fetchFeedback(student.fireId);   // 메모를 먼저 받아 수업 기록에 얹는다

/* ════════════════════════════════════════════════
   선생님 메모 (feedbacks/{학생문서ID})
   저장 구조: { entries:[{id,text,date,createdAt}], text, updatedAt }
   · 작성된 항목이 하나도 없으면 섹션 자체를 표시하지 않는다.
   · 불러오기에 실패한 경우에도 빈 안내를 띄우지 않고 조용히 숨긴다.
════════════════════════════════════════════════ */
function fbMillis(v){
  if(v==null)return 0;
  if(typeof v==='number')return v;
  if(typeof v==='object'){
    if(typeof v.toMillis==='function'){try{return v.toMillis();}catch(e){return 0;}}
    if(v.seconds!=null)return v.seconds*1000;
    if(v instanceof Date)return v.getTime();
    return 0;
  }
  const t=Date.parse(v);return isNaN(t)?0:t;
}
function fbDateFromMs(ms){
  if(!ms)return'';
  const d=new Date(ms);if(isNaN(d.getTime()))return'';
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseFbEntries(data){
  if(!data)return[];
  let list=[];
  if(Array.isArray(data.entries)){
    list=data.entries.filter(x=>x&&String(x.text||'').trim()).map((x,i)=>({
      id:String(x.id||('e'+i)),
      text:String(x.text||''),
      date:String(x.date||fbDateFromMs(fbMillis(x.createdAt))),
      createdAt:fbMillis(x.createdAt)
    }));
  }else if(String(data.text||'').trim()){
    const ms=fbMillis(data.updatedAt);
    list=[{id:'legacy-1',text:String(data.text),date:fbDateFromMs(ms),createdAt:ms}];
  }
  return list.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(b.createdAt-a.createdAt));
}
/* 메모를 읽어오기만 한다 (화면 표시는 수업 기록 쪽에서 담당)
   실패하면 빈 배열 — 메모 때문에 수업 기록이 막히지 않게 한다. */
async function fetchFeedback(fireId){
  try{
    const snap=await getDoc(doc(db,'feedbacks',fireId));
    return parseFbEntries(snap.exists()?snap.data():null);
  }catch(err){return[];}
}

/* 메모를 수업일에 배정한다
   ① 같은 날짜의 수업이 있으면 그 수업카드 안으로
   ② 없으면 그 날짜 '이전'의 가장 가까운 수업으로 (수업 뒤에 쓴 메모)
   ③ 모든 수업보다 이른 메모 · 날짜 없는 메모는 독립 카드로
   반환 { map:Map(수업날짜→[메모…]), orphans:[메모…] } */
function assignFeedback(lessonDates,fbList){
  const map=new Map(),orphans=[];
  const sorted=[...lessonDates].sort();
  (Array.isArray(fbList)?fbList:[]).forEach(fb=>{
    const d=String(fb&&fb.date||'');
    if(!atYmd(d)){orphans.push(fb);return;}
    let target='';
    for(let i=0;i<sorted.length;i++){
      if(sorted[i]<=d)target=sorted[i];
      else break;
    }
    if(target){if(!map.has(target))map.set(target,[]);map.get(target).push(fb);}
    else orphans.push(fb);
  });
  return{map,orphans};
}
function fbBlock(fb){
  return`<div class="ls-fb"><b>💬 선생님 메모</b><div class="ls-fb-tx">${e(fb&&fb.text||'')}</div></div>`;
}

/* ════════════════════════════════════════════════
   출결 · 수업 회차 · 보강
   · classCards 를 읽지 않는다 — 수업카드는 선생님 전용(내부 기록)
   · students 문서에 집계된 값만 사용:
     sessionCount / absentCount / makeupCount /
     lastClassDate / recentAttendance / recentLessons
   · 학생 문서 1개만 읽으므로 남의 학생 기록에 접근할 경로가 없다
════════════════════════════════════════════════ */
function atNum(v){return(typeof v==='number'&&isFinite(v))?v:null;}
function atYmd(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v==null?'':v).trim());
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>31)return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return dt;
}
function atLongDate(v){const d=atYmd(v);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`:String(v==null?'':v);}
function atShortDate(v){const d=atYmd(v);return d?`${d.getMonth()+1}/${d.getDate()}`:String(v==null?'':v);}
const AT_VALID=['출석','지각','결석','보강','휴강'];
function atStatusOf(x){
  const st=String(x&&x.s!=null?x.s:'').trim();
  return AT_VALID.indexOf(st)>=0?st:'출석';
}
function renderAttendance(student){
  try{
    const ses=atNum(student&&student.sessionCount);
    const abs=atNum(student&&student.absentCount);
    const mk=atNum(student&&student.makeupCount);
    const last=(student&&atYmd(student.lastClassDate))?String(student.lastClassDate):'';
    document.querySelectorAll('#at-ses').forEach(el=>el.textContent=ses!=null?ses+'회':'—');
    document.querySelectorAll('#at-abs').forEach(el=>el.textContent=abs!=null?abs+'회':'—');
    document.querySelectorAll('#at-mk').forEach(el=>el.textContent=mk!=null?mk+'회':'—');
    document.querySelectorAll('#at-last').forEach(el=>el.textContent=last?atShortDate(last):'—');

    // 출결 흐름 — recentAttendance: [{d:'2026-07-24', s:'출석'}, ...]
    const raw=Array.isArray(student&&student.recentAttendance)?student.recentAttendance:[];
    const flow=raw.filter(x=>x&&atYmd(x.d))
      .map(x=>({d:String(x.d),s:atStatusOf(x)}))
      .sort((a,b)=>a.d.localeCompare(b.d))
      .slice(-12);
    const flowHtml=flow.length
      ?flow.map(x=>`<span class="at-dot at-st-${e(x.s)}">${e(x.s.charAt(0))}<span class="at-d">${e(atShortDate(x.d))}</span></span>`).join('')
      :`<span class="at-wait">${ses?'출결 기록이 정리되는 중입니다.':'아직 기록된 수업이 없습니다.'}</span>`;
    document.querySelectorAll('#at-line').forEach(el=>el.innerHTML=flowHtml);
  }catch(err){
    ['#at-ses','#at-abs','#at-mk','#at-last'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.textContent='—'));
    document.querySelectorAll('#at-line').forEach(el=>el.innerHTML='<span class="at-wait">출결을 불러오지 못했습니다.</span>');
  }
}

/* ════════════════════════════════════════════════
   수업 내용 · 과제 — recentLessons (최근 30건, 최신순)
   [{d:'2026-07-24', s:'출석', u:'단원', c:'수업 내용', h:'과제'}]
   회차 번호는 출석 계열(출석·지각·보강)만 세어 매긴다.
   아직 recentLessons 가 없는 학생은 lastHomework 로 대체 표시한다.
════════════════════════════════════════════════ */
const LS_LESSON=['출석','지각','보강'];
const LS_BADGE={
  '출석':'background:#ecfdf5;border-color:#6ee7b7;color:#047857',
  '지각':'background:#fffbeb;border-color:#fde68a;color:#b45309',
  '결석':'background:#fef2f2;border-color:#fecaca;color:#b91c1c',
  '보강':'background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8',
  '휴강':'background:#f3f4f6;border-color:#e5e7eb;color:#6b7280'
};
function renderLessons(student,fbList){
  try{
    const raw=Array.isArray(student&&student.recentLessons)?student.recentLessons:[];
    const list=raw.filter(x=>x&&atYmd(x.d))
      .map(x=>({d:String(x.d),s:atStatusOf(x),u:String(x.u||''),c:String(x.c||''),h:String(x.h||'')}))
      .sort((a,b)=>a.d.localeCompare(b.d));   // 오래된 순으로 정렬해 회차 번호를 매긴다

    if(!list.length){renderLessonsFallback(student,fbList);return;}

    let no=0;
    const numbered=list.map(x=>{
      if(LS_LESSON.indexOf(x.s)>=0)no++;
      return{...x,no:LS_LESSON.indexOf(x.s)>=0?no:null};
    });
    numbered.reverse();                        // 최신이 맨 위

    const{map,orphans}=assignFeedback(list.map(x=>x.d),fbList);

    // 수업 카드 + 어느 수업에도 붙지 않은 메모 카드를 날짜순으로 합친다
    const items=numbered.map(x=>({kind:'lesson',d:x.d,x}));
    orphans.forEach(fb=>{
      const d=String(fb&&fb.date||'');
      if(atYmd(d))items.push({kind:'fb',d,fb});
    });
    items.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
    orphans.filter(fb=>!atYmd(String(fb&&fb.date||''))).forEach(fb=>items.unshift({kind:'fb',d:'',fb}));

    const html=items.map((it,i)=>{
      if(it.kind==='fb'){
        return`<div class="ls-card fbonly">
          <div class="ls-top">
            <span class="ls-date">${e(it.d?atLongDate(it.d):'작성일 미상')}</span>
            <span class="ls-badge" style="${LS_BADGE['보강']}">선생님 메모</span>
          </div>
          ${fbBlock(it.fb)}
        </div>`;
      }
      const x=it.x;
      const badge=LS_BADGE[x.s]||LS_BADGE['출석'];
      const body=x.c
        ?`<div class="ls-body">${e(x.c)}</div>`
        :(x.s==='결석'?'<div class="ls-body mute">결석으로 기록된 날입니다.</div>'
         :(x.s==='휴강'?'<div class="ls-body mute">휴강일입니다.</div>'
         :'<div class="ls-body mute">수업 내용이 등록되지 않았습니다.</div>'));
      const hw=x.h?`<div class="ls-hw"><b>과제</b>${e(x.h)}</div>`:'';
      const unit=x.u?`<div class="ls-unit">📘 ${e(x.u)}</div>`:'';
      // 메모는 과제 아래에, 그 날짜에 작성된 것이 있을 때만 생성된다
      const fbs=(map.get(x.d)||[]).map(fbBlock).join('');
      return`<div class="ls-card${i===0?' latest':''}">
        <div class="ls-top">
          <span class="ls-date">${e(atLongDate(x.d))}</span>
          <span class="ls-badge" style="${badge}">${e(x.s)}</span>
          ${i===0&&items.length>1?'<span class="ls-new">최신</span>':''}
          ${x.no?`<span class="ls-no">${x.no}회차</span>`:''}
        </div>
        ${unit}${body}${hw}${fbs}
      </div>`;
    }).join('');

    const total=atNum(student&&student.sessionCount);
    const shown=numbered.filter(x=>x.no).length;
    const more=(total!=null&&total>shown)
      ?`<div class="ls-more">최근 ${shown}회 수업을 보여드리고 있습니다.<br>그 이전 기록은 학원으로 문의해 주세요.</div>`:'';
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html+more);
  }catch(err){
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML='<div class="empty-box">수업 기록을 불러오지 못했습니다.</div>');
  }
}
// recentLessons 가 아직 없는 학생 — 예전 방식(lastHomework) + 메모만이라도 보여준다
function renderLessonsFallback(student,fbList){
  const fbs=(Array.isArray(fbList)?fbList:[]);
  const fbHtml=fbs.map(fb=>`<div class="ls-card fbonly">
      <div class="ls-top">
        <span class="ls-date">${e(fb.date?atLongDate(fb.date):'작성일 미상')}</span>
        <span class="ls-badge" style="${LS_BADGE['보강']}">선생님 메모</span>
      </div>
      ${fbBlock(fb)}
    </div>`).join('');
  const hw=(student&&student.lastHomework&&typeof student.lastHomework==='object')?student.lastHomework:null;
  const text=hw?String(hw.text||'').trim():'';
  const date=(hw&&atYmd(hw.date))?String(hw.date):'';
  if(!text){
    const html=fbHtml||emptyBox('🗓','아직 등록된 수업 기록이 없습니다.<br>수업이 진행되면 이곳에 표시됩니다.');
    document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html);
    return;
  }
  const html=fbHtml+`<div class="ls-card latest">
      <div class="ls-top">
        <span class="ls-date">${e(date?atLongDate(date):'최근 수업')}</span>
        <span class="ls-badge" style="${LS_BADGE['출석']}">과제</span>
      </div>
      <div class="ls-hw" style="margin-top:0;padding-top:0;border-top:none"><b>과제</b>${e(text)}</div>
    </div>
    <div class="ls-more">지난 수업 기록을 정리하고 있습니다.<br>곧 전체 내용을 확인하실 수 있습니다.</div>`;
  document.querySelectorAll('#lessonList').forEach(el=>el.innerHTML=html);
}

/* ════════════════════════════════════════════════
   시험 기록 (grades) — 관리자 페이지와 동일 컬렉션
════════════════════════════════════════════════ */
function toNum(v){return(typeof v==='number')?v:(v!=null&&v!==''&&!isNaN(Number(v))?Number(v):null);}
function normalizeGrade(id,r){
  return{
    id,
    testName:r.testName||r.examTitle||r.unitName||'',
    subject:r.subject||r.studentSubject||'',
    grade:r.grade||'',
    /* 실제 Firestore 평면 필드 */
    oxScore:toNum(r.oxScore!=null?r.oxScore:(r.ox&&r.ox.score)),
    oxCount:toNum(r.oxCount!=null?r.oxCount:(r.ox&&r.ox.total)),
    oxCorrect:toNum(r.oxCorrect!=null?r.oxCorrect:(r.ox&&r.ox.correct)),
    multiScore:toNum(r.multiScore!=null?r.multiScore:(r.multiple&&r.multiple.score)),
    multiCount:toNum(r.multiCount!=null?r.multiCount:(r.multiple&&r.multiple.total)),
    multiCorrect:toNum(r.multiCorrect!=null?r.multiCorrect:(r.multiple&&r.multiple.correct)),
    masterScore:toNum(r.masterScore!=null?r.masterScore:null),
    score:toNum(r.score!=null?r.score:(r.percentage!=null?r.percentage:null)),
    totalQuestions:toNum(r.totalQuestions!=null?r.totalQuestions:(r.totalQ!=null?r.totalQ:r.total)),
    totalCorrect:toNum(r.totalCorrect!=null?r.totalCorrect:(r.correct!=null?r.correct:null)),
    testType:String(r.testType||r.category||'').toLowerCase(),
    timestamp:r.timestamp||r.submittedTimestamp||r.submittedAt||r.date||null
  };
}

/* ── 한 기록에서 섹션별 결과 추출 {correct,total,rate} 또는 null ──
   화면에는 "맞은 문항 / 전체 문항" 으로 표기하고, 정답률(%)은 보조로만 쓴다.
   correct 가 저장돼 있으면 그 값을 그대로 쓰고, 없으면 점수(%)에서 되돌려 계산한다.
   한 시험에 OX·4지선다 칸이 둘 다 있어도, 실제로 응시하지 않은
   0점짜리 빈 섹션(상대 섹션만 채점된 경우)은 유령 항목으로 보이지 않게 거른다. */
function isMasterRec(r){return r.testType==='master'||r.masterScore!=null;}
function makeSec(correct,total,rate){
  let c=(correct!=null&&isFinite(correct))?correct:null;
  const t=(total!=null&&isFinite(total)&&total>0)?total:null;
  let pct=(rate!=null&&isFinite(rate))?rate:null;
  if(c==null&&t!=null&&pct!=null)c=Math.round(pct/100*t);          // 정답 수가 없으면 점수에서 환산
  if(pct==null&&t!=null&&c!=null)pct=Math.round(c/t*100);          // 점수가 없으면 정답 수에서 환산
  if(c!=null&&t!=null&&c>t)c=t;                                    // 방어: 정답이 전체보다 클 수 없다
  if(c==null&&pct==null)return null;
  return{correct:c,total:t,rate:pct};
}
function oxOf(r){
  if(isMasterRec(r))return null;
  if(!(r.oxCount>0&&r.oxScore!=null&&r.oxScore>0))return null;   // 0점 파트 = 미응시 → 숨김
  return makeSec(r.oxCorrect,r.oxCount,r.oxScore);
}
function mcOf(r){
  if(isMasterRec(r))return null;
  if(!(r.multiCount>0&&r.multiScore!=null&&r.multiScore>0))return null;   // 0점 파트 = 미응시 → 숨김
  return makeSec(r.multiCorrect,r.multiCount,r.multiScore);
}
function masterOf(r){
  if(!isMasterRec(r))return null;
  if(r.totalQuestions>0&&r.totalCorrect!=null)return makeSec(r.totalCorrect,r.totalQuestions,null);
  if(r.masterScore!=null)return makeSec(null,r.totalQuestions,r.masterScore);
  if(r.score!=null)return makeSec(null,r.totalQuestions,r.score);
  return null;
}

function gradeTime(r){
  const t=r.timestamp;
  if(!t)return 0;
  if(typeof t==='object'){if(t.seconds!=null)return t.seconds*1000;if(typeof t.toMillis==='function'){try{return t.toMillis();}catch(e){}}return 0;}
  const d=new Date(t);return isNaN(d.getTime())?0:d.getTime();
}
function gradeDateStr(r){
  const t=r.timestamp;
  if(typeof t==='string'){const m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[1].slice(2)}/${m[2]}/${m[3]}`;}
  const ms=gradeTime(r);if(!ms)return'';
  const d=new Date(ms);
  return`${String(d.getFullYear()).slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

async function loadGrades(sid,fireId){
  try{
    let docs=[];const seen=new Set();
    async function q(field,val){
      try{const s=await getDocs(query(collection(db,'grades'),where(field,'==',val)));s.forEach(d=>{if(!seen.has(d.id)){seen.add(d.id);docs.push(normalizeGrade(d.id,d.data()));}});}catch(e){}
    }
    await q('studentId',sid);
    if(fireId&&fireId!==sid)await q('studentId',fireId);
    docs.sort((a,b)=>gradeTime(b)-gradeTime(a));
    renderOx(docs);
    renderMultiple(docs);
    renderMaster(docs);
  }catch(err){
    ['#oxResultList','#testResultList','#masterTestList'].forEach(sel=>document.querySelectorAll(sel).forEach(el=>el.innerHTML='<div class="empty-box">기록을 불러오지 못했습니다.</div>'));
  }
}

/* 요약 3칸 — 응시 횟수 / 누적 정답(맞은 문항 합 / 전체 문항 합) / 최고 기록(한 시험 최고)
   문항 수가 시험마다 달라도 "몇 문제 중 몇 개" 로 읽히도록 맞췄다. */
function setStats(prefix,secs){
  const count=secs.length;
  const known=secs.filter(s=>s.correct!=null&&s.total!=null);
  const sumC=known.reduce((a,s)=>a+s.correct,0);
  const sumT=known.reduce((a,s)=>a+s.total,0);

  let best=null,bestRate=-1;
  secs.forEach(s=>{
    const rate=(s.rate!=null)?s.rate:((s.correct!=null&&s.total)?Math.round(s.correct/s.total*100):null);
    if(rate==null)return;
    if(rate>bestRate){bestRate=rate;best=s;}
  });

  document.querySelectorAll('#'+prefix+'-total').forEach(el=>el.textContent=count+'회');
  document.querySelectorAll('#'+prefix+'-sum').forEach(el=>{
    el.textContent=known.length?`${sumC}/${sumT}`:'—';
  });
  document.querySelectorAll('#'+prefix+'-best').forEach(el=>{
    if(!best){el.textContent='—';return;}
    el.textContent=(best.correct!=null&&best.total!=null)?`${best.correct}/${best.total}`:`${bestRate}%`;
  });
}

function renderOx(docs){
  const items=docs.map(r=>({r,sec:oxOf(r)})).filter(x=>x.sec);
  setStats('ox',items.map(x=>x.sec));
  const html=!items.length?emptyBox('⭕','아직 응시한 OX 퀴즈가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#oxResultList').forEach(el=>el.innerHTML=html);
}
function renderMultiple(docs){
  const items=docs.map(r=>({r,sec:mcOf(r)})).filter(x=>x.sec);
  setStats('ts',items.map(x=>x.sec));
  const html=!items.length?emptyBox('📝','아직 응시한 4지선다 테스트가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#testResultList').forEach(el=>el.innerHTML=html);
}
function renderMaster(docs){
  const items=docs.map(r=>({r,sec:masterOf(r)})).filter(x=>x.sec);
  setStats('ms',items.map(x=>x.sec));
  const html=!items.length?emptyBox('🎯','아직 응시한 마스터테스트가 없습니다.'):items.map(x=>renderScoreCard(x.r,x.sec)).join('');
  document.querySelectorAll('#masterTestList').forEach(el=>el.innerHTML=html);
}

/* OX / 4지선다 / 마스터 공통 카드
   오른쪽 원 = "맞은 문항 / 전체 문항" (예: 40/50)
   문항 수를 알 수 없는 옛 기록만 예외적으로 정답률(%)을 원에 표시한다. */
function renderScoreCard(r,sec){
  const rate=(sec.rate!=null)?sec.rate:((sec.correct!=null&&sec.total)?Math.round(sec.correct/sec.total*100):null);
  const cls=(rate==null)?'sc-none':(rate>=80?'sc-high':rate>=60?'sc-mid':'sc-low');
  const dt=gradeDateStr(r)||'—';
  const hasFrac=(sec.correct!=null&&sec.total!=null);
  const title=e(r.testName||r.subject||'테스트');

  const rows=[];
  rows.push(`<div class="sc-row sc-row-title"><span class="sc-row-lbl">단원명</span><span class="sc-row-val">${title}</span></div>`);
  if(r.subject)rows.push(`<div class="sc-row"><span class="sc-row-lbl">과목</span><span class="sc-row-val">${e(r.subject)}</span></div>`);
  rows.push(`<div class="sc-row"><span class="sc-row-lbl">응시 날짜</span><span class="sc-row-val sc-date">${dt}</span></div>`);
  if(hasFrac){
    rows.push(`<div class="sc-row"><span class="sc-row-lbl">채점 결과</span><span class="sc-row-val">전체 <b class="sc-total">${sec.total}</b>문항 중 <b class="sc-correct">${sec.correct}</b>문항 정답${rate!=null?` <span class="sc-rate">(정답률 ${rate}%)</span>`:''}</span></div>`);
  }else if(rate!=null){
    rows.push(`<div class="sc-row"><span class="sc-row-lbl">채점 결과</span><span class="sc-row-val sc-rate">정답률 ${rate}%</span></div>`);
  }

  const circle=hasFrac
    ?`<div class="sc-pct">${sec.correct}/${sec.total}</div><div class="sc-unit">문항</div>`
    :`<div class="sc-pct">${rate!=null?rate+'%':'—'}</div><div class="sc-unit">정답률</div>`;

  return`<div class="test-item">
    <div class="test-head">
      <div class="test-info"><div class="sc-rows">${rows.join('')}</div></div>
      <div class="score-circle ${cls}">${circle}</div>
    </div>
  </div>`;
}

function emptyBox(icon,msg){return`<div class="empty-box"><div class="empty-icon">${icon}</div>${msg}</div>`;}
function showError(){document.getElementById('loadingScreen').style.display='none';document.getElementById('errorScreen').style.display='flex';}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

window.switchTab=function(idx){
  document.querySelectorAll('.section').forEach((s,i)=>s.classList.toggle('active',i%TAB_COUNT===idx));
  document.querySelectorAll('.d-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.m-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  window.scrollTo({top:0,behavior:'smooth'});
};
